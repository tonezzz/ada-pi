    - gesture_recall
    - memory_index_recall
    - memory_person_scope
    - memory_confirmed_write
    - memory_confirm_gate
    - identity_confusion_guard
    - speaker_contamination_guard
    - kk_first_contact
    - kk_info_probe
    - new_person_nat
    - archive_recall
    - doc_recall

  # Report surface — does the self-test record stay recallable and does
  # Ada judge "what's worth reporting" correctly? Read-only.
