  # Release gate — the deploy-gate probes. Arg shapes, honesty under
  # failure, and storm budgets. Run before promoting ada-pi; every
  # tool-consolidation merge card closes through this suite.
  gate:
    - tool_selection_accuracy
    - tool_args_shape
    - tool_honesty
    - tool_storm_budget
    - tools_probe_readonly
    - tools_probe_writes
    - tools_probe_flows
