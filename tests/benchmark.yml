    # three dub_* metrics scenarios are http_check-only (no tool calls);
    # the suite's two live-path entries actuate real surfaces
    - yt_dub_liam_e2e        # cast_to_screen play on a numbered vcast display
    - cast_dub_to_tv         # tv_action / ada_camera_snapshot on the
                           # dark-panel verify turn

# The standard — what a benchmark result is allowed to mean. Three clauses:
# evidence contract, failure integrity, retention. Enforced by
# scenario-live.py (assertions), scenario-benchmark.py (scoring/validity),
# and scenario-prune.py (retention/dedupe).
standard:
  # Clause 1 — evidence contract. A PASS must be backed by observable
  # state, per domain. Tool-call presence is necessary, never sufficient:
  # a tool returning is not the action having happened.
  evidence:
    gev:      remote_screens includes the target screen AND a
              screen-targeted command (e.g. get_current_view_state)
              returns real state — a vcast nav ACK alone proves nothing
    vcast:    p*:frame-ok / img-* / video-* render evidence from a real
              browser display (vcast-real@N); headless ACKs don't count
    tv/cast:  the cast/nav tool returned success THIS turn — recalled
              state from an earlier turn or session is not proof
    cctv/cam: actual snapshot bytes published/returned, not a tool ACK
    cms/docs: the page exists and is readable after the write
    memory:   a follow-up recall returns the stored value
  # Clause 2 — failure integrity. These statuses are never scored
  # (they measure the environment, not Ada): infra, quota, skip-quota,
  # unimplemented. A run where >50% of scenarios are unscored is stamped
  # meta.valid=false and excluded from trend/baseline comparisons.
  # Concurrent suite runs are refused outright (TCP lock :8199) — a
  # contended run is invalid data, not a result.
  failure_integrity:
    unscored_statuses: [infra, quota, skip-quota, unimplemented]
    invalid_run_threshold: 0.5
    flaky: "pass-on-retry = 0.5; fail-on-retry = 0"
  # Clause 3 — retention (enforced by real mddb TTL at write time and by
  # scenario-prune.py for legacy docs + dedupe).
  retention:
    report_pass:       3d    # aggregate benchmark doc already records it
    report_flaky:      7d
    report_fail:       30d   # dedupe: consecutive identical fails keep
                             # first + latest only
    report_infra_quota: 3d   # environment noise
    auto_report:       30d
    benchmark:         keep  # trend data; invalid runs stamped, not deleted

# Tracked metrics — numbers a suite must surface on the benchmark doc.
# Scenario http_check turns declare `capture:` regexes; scenario-benchmark
# records the values as meta.metrics + a "Captured metrics" section, so
# runs carry real numbers for trend diffs, not only pass/fail.
metrics:
  # dub program (card yt-voice-dub-scenarios) — source: the dub-metrics/1
  # sidecar each published dub ships beside its mp4 under /apps/yt-live/
  # (<basename>.metrics.json, emitted by yt-vtt-dub.py --metrics-json).
  # Contract: docs/ssot/jobs/dub/2026-10-07-dub-metrics-contract.yml.
  # The pass/fail bars live in the dub_* scenario regexes; this list is
  # the canonical name -> meaning map for what the benchmark trends.
  dub:
    cue_overflow_pct:   "% of TTS segments ending past cue window + tolerance — gate <=10"
    wer_vs_source:      "ASR WER of the dub track vs source captions — gate <=0.30"
    voices_per_speaker: "max distinct voices any single speaker uses — gate ==1"
    loudness_delta_db:  "dub-vs-original loudness gap during dub segments — gate [6,20] dB"

# Usage plan — cadence that keeps Gemini grounded-search quota healthy.
# MEASURED: free-tier quota is 20 grounded requests/day/project/model
# (429 RESOURCE_EXHAUSTED, GenerateRequestsPerDayPerModel) — shared with
# interactive voice web_search AND ada_ops action='research' rounds.
# Budget per day: ~20 total → standard deep research (3 rounds) ≈ 15%,
# deep (5 rounds) ≈ 25%. A full benchmark day can consume the whole quota.
usage:
  smoke:   hourly (existing ada-scenario-smoke.timer — unchanged)
  research: weekly — Monday 03:30 (ada-scenario-research.timer),
            ~7 scenarios ≈ 15-25 grounded calls — runs at quota-reset edge;
            acceptable to consume most of one day's grounded budget
  memory:   weekly — Wednesday 03:30 (manual, on-request)
  tools:    weekly — Friday 03:30 (manual, on-request)
  full:     on-request only (~1h, can exceed the daily grounded quota —
            run when voice use is low; DDG fallback keeps results landing)
  dub:      on-request / before closing yt-voice-dub-* cards — artifact
            gates are driver-side http_check (no LLM, no quota); the two
            live-path entries actuate the lab display + TV
  notes:
    - "429 → web_search auto-falls back to duckduckgo (free, no key).
      DDG needs SHORT keyword queries — prose queries return 0 results."
    - "ada_ops action='research' — standard=3 rounds, deep=5, 2s pacing,
      keyword-compacted queries; interactive use shares the same
      daily quota — prefer standard unless the user asks for deep."
    - "Quota resets daily (~midnight PT); a paid Gemini tier raises it
      from 20/day — infra decision, not an automated action."

suites:
  # Fast confidence check — same set ada-scenario-smoke.timer runs daily.
  smoke: '@smoke'   # expands to every scenarios-live file with tier: smoke

  # Deep-research & CMS competency — the "research → report" pipeline.
  research:
    - deep_research_neuralink
    - flood_situation
    - deep_dive_flood_report
    - cms_publish_handshake
    - cms_ops_assessment
    - report_references_lifecycle
