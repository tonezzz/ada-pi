# Chaba Nest topology registry — declarative compound-AI structures.
#
# Levels (cost tiers):
#   L0  rules/regex/deterministic — free, always first
#   L1  student micro model (gemma-3-1b, phi3) — ~1 cpu-s/call
#   L2  heavy local (gemma-3-4b) — ~5-10 cpu-s/call
#   L3  arbiter cloud (Gemini) — quota-priced, last resort
#
# Wiring `ways`:
#   series    — output of each node feeds the next (cascade)
#   parallel  — all nodes run, votes merge (weighted in gray band)
#   router    — feature router picks ONE node per input
#   verifier  — node decides, auditor may veto
#
# impl: builtin  → orch-bench --structure <name> hand-coded path
# impl: chain    → graph executor (chain.py). Nodes carry edges:
#                    - {when: <pred>, to: <node-id|accept>}
#                  predicates: else, kind:<k>, feat:<f>, yes, no,
#                  in_band, veto, uphold — first match wins.
#
# Live fleet (2026-10-07) — same model on multiple lanes lets shards
# run parallel and lets 'parallel' actually parallelize:
#   student  jev-student distilbert  idc03:8778   systemd (prod confirm gate)
#   student  gemma-3-1b              tony-omen:8778  systemd (open-jev-student)
#   student  gemma-3-1b              idc03:8779   quadlet openjev:cpu container
#   heavy    gemma-3-4b              idc02:8777   venv (prod jev-advisory)
#   heavy    gemma-3-4b              tony-omen:8777  systemd (open-jev)
student_endpoint: http://100.75.102.88:8778   # gemma-3-1b-it (open-jev)
heavy_endpoint:   http://100.75.102.88:8777   # gemma-3-4b-it (open-jev)

topologies:
  student:
    impl: builtin            # orch-bench --structure student
    way: series
    nodes: [{level: L1, role: decider}]
    note: baseline — small model alone, no backup

  cascade:
    impl: builtin
    way: series
    nodes:
      - {level: L1, role: decider, escalate_in: [0.35, 0.75]}
      - {level: L2, role: decider}
    note: cheap decider first; L2 only takes the gray band

  parallel:
    impl: builtin
    way: parallel
    nodes:
      - {level: L1, role: voter}
      - {level: L2, role: voter, weight_in_gray: 0.75}
    note: both always run — the cost ceiling, quality ceiling too?

  router:
    impl: builtin
    way: router
    nodes:
      - {level: L0, role: router, feats: [code-switch, imperative, tool-shaped]}
      - {level: L1, role: decider, when: clean-short}
      - {level: L2, role: decider, when: default}
    note: zero extra calls to route — stands in for a learned router

  verifier:
    impl: builtin
    way: verifier
    nodes:
      - {level: L1, role: decider}
      - {level: L2, role: auditor, audits: [yes-decisions, tool-choices]}
    note: asymmetry — only expensive-to-be-wrong answers get audited

  # --- executable chains (impl: chain — the graph executor) ------------
  nest-2l-router:
    impl: chain
    way: router+series
    entry: route
    note: >-
      L0 route -> domain experts -> L2 escalate in-band. The kanban-brief
      tier model generalized: every kind gets an L1 first pass, choice
      kinds and hard-featured confirms go straight to L2, gray-band and
      low-confidence answers escalate. Zero extra calls to route.
    nodes:
      - id: route
        level: L0
        role: router
        edges:
          - {when: 'kind:tool', to: dec_hard}      # student stub: no real choice head
          - {when: 'kind:bank', to: dec_easy}      # measure whether L1 can route banks
          - {when: 'kind:triage', to: dec_easy}
          - {when: 'feat:code_switch', to: dec_hard}
          - {when: 'feat:embedded', to: dec_hard}
          - {when: 'feat:imperative', to: dec_hard}
          - {to: dec_easy}
      - id: dec_easy
        level: L1
        role: decider
        edges:
          - {when: in_band, to: dec_hard}
          - {to: accept}
      - id: dec_hard
        level: L2
        role: decider

  nest-3l-verify:
    impl: chain
    way: series+verifier
    entry: dec1
    note: >-
      cascade decide -> L2 audit of affirmative/commit decisions -> L3
      arbiter only when the auditor vetoes. The fullest trust ladder;
      measures whether escalation depth pays for itself. L3 falls back
      to --heavy until a Gemini-backed systemone lane exists.
    nodes:
      - id: dec1
        level: L1
        role: decider
        edges:
          - {when: 'yes', to: audit}
          - {to: accept}
      - id: audit
        level: L2
        role: auditor
        edges:
          - {when: veto, to: arbitrate}
          - {to: accept}
      - id: arbitrate
        level: L3
        role: arbiter

  nest-learned-router:
    impl: chain
    way: router+series
    entry: route
    note: >-
      Learned router — routes by per-featsig accuracy accumulated in the
      --stats-out corpus; cold signatures fall back to the feature
      predicates (the same edges as nest-2l-router). min_n before a
      signature is trusted: 15 node rows per level.
    nodes:
      - id: route
        level: L0
        role: learned_router
        min_n: 15
        edges:
          - {when: 'kind:tool', to: dec_hard}
          - {when: 'kind:bank', to: dec_easy}   # must exercise L1 or its
                                               # stats can never warm
          - {when: 'feat:code_switch', to: dec_hard}
          - {when: 'feat:embedded', to: dec_hard}
          - {when: 'feat:imperative', to: dec_hard}
          - {to: dec_easy}
      - id: dec_easy
        level: L1
        role: decider
        edges:
          - {when: in_band, to: dec_hard}
          - {to: accept}
      - id: dec_hard
        level: L2
        role: decider

# ---------------------------------------------------------------------------
# Model registry — the checkpoints behind the specialists (card
# nest-micro-training). One entry per trained/deployed model.
#
#   task       domains.yml kind it answers (or 'generic /v1/systemone')
#   specialist suites.yml key it defends (may be null for bench models)
#   checkpoint where the weights live (host:path or hf repo)
#   corpus     corpus version it was trained on (merge stats/iteration)
#   bench      last recorded suite scores (golden/hard/adversarial)
#   status     train | shadow | prod | retired
#
# Lifecycle: the train loop (chaba scripts/ada/nest-train-loop.py) benches
# a candidate against the incumbent across suites.yml tiers; when the
# gate passes it posts a board request and the entry lands here as
# status: shadow. Live divergence metrics (jev_advisory events,
# client_noul agreement) decide prod promotion — same posture as the
# CAM++ speaker shadow and the client_noul edge lane.

models:
  jev-student-v5:
    task: confirm
    specialist: confirm-gate
    arch: distilbert-base-multilingual-cased seq-cls (2-label, thr 0.70)
    checkpoint: idc03:~/jev-student/ckpt        # deployed 2026-10-04
    serves: http://idc03.taila0626a.ts.net:8778
    corpus: 'jev-corpus i5 — live+mined+reviewed+augment merge'
    bench:
      at: 2026-10-07
      golden: '10/10'
      hard: '27/35'
      adv-confirm: '12/21'
      p50_s: 0.07
      misses: >-
        hard/{code-switch,ok-nonconfirm} + adv-confirm/{meta-reference,
        imperative-bait,relayed-affirm,slang-negation,trailing-negation}
        false-fires and short-form ('y','k','mm-hmm','affirmative')
        under-fires — the v6 target list
    status: prod
    note: >-
      Fifth corpus iteration; replaced the zero-shot gemma-1b gate
      (56% -> 100% golden). Prior snapshots on idc03:
      ckpt-v1-20260930, ckpt-v2-20261002, ckpt-v0-deployed-20261004.
      Tool-routing head is a stub — returns 'answer' for choice calls;
      the tool-routing suite is the open specialist lane.

  gemma-3-1b-zeroshot:
    task: generic /v1/systemone
    specialist: null
    arch: gemma-3-1b-it zero-shot LM-head (open-jev scorer)
    checkpoint: open-jev models/ (unsloth ungated mirror)
    serves:
      - http://tony-omen.taila0626a.ts.net:8778   # open-jev-student
      - http://idc03.taila0626a.ts.net:8779       # openjev:cpu quadlet
    corpus: none                                 # zero-shot
    bench:
      golden: '56% (first bench, pre-student baseline)'
    status: prod                                 # L1 lane in topologies
    note: >-
      First upgrade candidate for a real multi-question student —
      LoRA/QLoRA tune keeps choice+score working (recipe:
      CMS jev-unsloth-finetune).

  gemma-3-4b-zeroshot:
    task: generic /v1/systemone
    specialist: null
    arch: gemma-3-4b-it zero-shot LM-head (open-jev scorer)
    checkpoint: open-jev models/ (unsloth ungated mirror)
    serves:
      - http://idc02:8777                        # prod jev-advisory
      - http://tony-omen.taila0626a.ts.net:8777  # open-jev
    corpus: none
    bench: {}
    status: prod                                 # L2 lane in topologies
    note: teacher/bench role — 6-12 s/decision on CPU, uncalibrated.

  jev-gemma-head-v1:
    task: confirm
    specialist: confirm-gate
    arch: jevlike attention head over frozen gemma-3-1b hidden states
    checkpoint: open-jev features/ head (torch port of MLX path)
    serves: null                                 # bench-only
    corpus: 'jev-corpus (shared merge)'
    bench: {}
    status: train
    note: >-
      noul-only head — cannot serve choice/score; kept as a training
      experiment, not a promotion candidate (see jev-unsloth-finetune).

# ---------------------------------------------------------------------------
# Training lanes — where candidates get built (recipe: CMS page
# jev-unsloth-finetune; loop owner: chaba scripts/ada/nest-train-loop.py).
lanes:
  tony-omen-gtx1650:
    host: tony-omen
    gpu: 'GTX 1650 4GB (sm_75), torch 2.14.0+cu130 in ~/CascadeProjects/open-jev/.venv'
    good_for: >-
      distilbert seq-cls FT (~11 min/4 epochs) — the proven jev-student
      path; gemma-3-1b/270m LoRA via 4-bit bitsandbytes (~1-2 GB VRAM)
    watch: >-
      no fast flash-attn path on sm_75; 4b QLoRA sits at the VRAM edge
      (batch=1, seq<=256, grad checkpointing) — prefer colab for that
    cadence: nightly/burst, GPU is shared with dev work — keep runs short
  colab-burst:
    host: 'Google Colab via colab-mcp'
    good_for: >-
      bigger runs — 4b QLoRA, multi-epoch distill, anything over ~3 GB
      VRAM or long schedulable epochs
    notebooks:
      - scripts/jev/jev-student-colab.ipynb
      - scripts/jev/jev-4b-qlora-colab.ipynb
    corpus_in: 'scripts/jev-corpus-export.py -> jev-corpus-out/{train,eval}.jsonl'
  idc01-cold:
    host: idc01
    good_for: >-
      cold batch — corpus mining, eval sweeps, embedding jobs, anything
      latency-tolerant. Retired from ada-prod 2026-10-05: no ada
      services, no mddb writes from here.
    corpus_archive: >-
      ~/.local/share/ada/jev-corpus{,-mined,-reviewed}.jsonl — the
      pre-migration archive the loop still merges from
