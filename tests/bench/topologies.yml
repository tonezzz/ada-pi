# Chaba Nest topology registry — declarative compound-AI structures.
#
# Levels (cost tiers):
#   L0  rules/regex/deterministic — free, always first
#   L1  student micro model (gemma-3-1b, phi3) — ~1 cpu-s/call
#   L2  heavy local (gemma-3-4b) — ~5-10 cpu-s/call
#   L3  arbiter cloud (Gemini) — quota-priced, last resort
#
# Wiring `ways`:
#   series    — output of each node feeds the next (cascade)
#   parallel  — all nodes run, votes merge (weighted in gray band)
#   router    — feature router picks ONE node per input
#   verifier  — node decides, auditor may veto
#
# impl: builtin  → orch-bench --structure <name> hand-coded path
# impl: chain    → graph executor (chain.py). Nodes carry edges:
#                    - {when: <pred>, to: <node-id|accept>}
#                  predicates: else, kind:<k>, feat:<f>, yes, no,
#                  in_band, veto, uphold — first match wins.
#
# Live fleet (2026-10-07) — same model on multiple lanes lets shards
# run parallel and lets 'parallel' actually parallelize:
#   student  jev-student distilbert  idc03:8778   systemd (prod confirm gate)
#   student  gemma-3-1b              tony-omen:8778  systemd (open-jev-student)
#   student  gemma-3-1b              idc03:8779   quadlet openjev:cpu container
#   heavy    gemma-3-4b              idc02:8777   venv (prod jev-advisory)
#   heavy    gemma-3-4b              tony-omen:8777  systemd (open-jev)
student_endpoint: http://100.75.102.88:8778   # gemma-3-1b-it (open-jev)
heavy_endpoint:   http://100.75.102.88:8777   # gemma-3-4b-it (open-jev)

topologies:
  student:
    impl: builtin            # orch-bench --structure student
    way: series
    nodes: [{level: L1, role: decider}]
    note: baseline — small model alone, no backup

  cascade:
    impl: builtin
    way: series
    nodes:
      - {level: L1, role: decider, escalate_in: [0.35, 0.75]}
      - {level: L2, role: decider}
    note: cheap decider first; L2 only takes the gray band

  parallel:
    impl: builtin
    way: parallel
    nodes:
      - {level: L1, role: voter}
      - {level: L2, role: voter, weight_in_gray: 0.75}
    note: both always run — the cost ceiling, quality ceiling too?

  router:
    impl: builtin
    way: router
    nodes:
      - {level: L0, role: router, feats: [code-switch, imperative, tool-shaped]}
      - {level: L1, role: decider, when: clean-short}
      - {level: L2, role: decider, when: default}
    note: zero extra calls to route — stands in for a learned router

  verifier:
    impl: builtin
    way: verifier
    nodes:
      - {level: L1, role: decider}
      - {level: L2, role: auditor, audits: [yes-decisions, tool-choices]}
    note: asymmetry — only expensive-to-be-wrong answers get audited

  # --- executable chains (impl: chain — the graph executor) ------------
  nest-2l-router:
    impl: chain
    way: router+series
    entry: route
    note: >-
      L0 route -> domain experts -> L2 escalate in-band. The kanban-brief
      tier model generalized: every kind gets an L1 first pass, choice
      kinds and hard-featured confirms go straight to L2, gray-band and
      low-confidence answers escalate. Zero extra calls to route.
    nodes:
      - id: route
        level: L0
        role: router
        edges:
          - {when: 'kind:tool', to: dec_hard}      # student stub: no real choice head
          - {when: 'kind:bank', to: dec_easy}      # measure whether L1 can route banks
          - {when: 'kind:triage', to: dec_easy}
          - {when: 'feat:code_switch', to: dec_hard}
          - {when: 'feat:embedded', to: dec_hard}
          - {when: 'feat:imperative', to: dec_hard}
          - {to: dec_easy}
      - id: dec_easy
        level: L1
        role: decider
        edges:
          - {when: in_band, to: dec_hard}
          - {to: accept}
      - id: dec_hard
        level: L2
        role: decider

  nest-3l-verify:
    impl: chain
    way: series+verifier
    entry: dec1
    note: >-
      cascade decide -> L2 audit of affirmative/commit decisions -> L3
      arbiter only when the auditor vetoes. The fullest trust ladder;
      measures whether escalation depth pays for itself. L3 falls back
      to --heavy until a Gemini-backed systemone lane exists.
    nodes:
      - id: dec1
        level: L1
        role: decider
        edges:
          - {when: 'yes', to: audit}
          - {to: accept}
      - id: audit
        level: L2
        role: auditor
        edges:
          - {when: veto, to: arbitrate}
          - {to: accept}
      - id: arbitrate
        level: L3
        role: arbiter

  nest-learned-router:
    impl: chain
    way: router+series
    entry: route
    note: >-
      Learned router — routes by per-featsig accuracy accumulated in the
      --stats-out corpus; cold signatures fall back to the feature
      predicates (the same edges as nest-2l-router). min_n before a
      signature is trusted: 15 node rows per level.
    nodes:
      - id: route
        level: L0
        role: learned_router
        min_n: 15
        edges:
          - {when: 'kind:tool', to: dec_hard}
          - {when: 'kind:bank', to: dec_easy}   # must exercise L1 or its
                                               # stats can never warm
          - {when: 'feat:code_switch', to: dec_hard}
          - {when: 'feat:embedded', to: dec_hard}
          - {when: 'feat:imperative', to: dec_hard}
          - {to: dec_easy}
      - id: dec_easy
        level: L1
        role: decider
        edges:
          - {when: in_band, to: dec_hard}
          - {to: accept}
      - id: dec_hard
        level: L2
        role: decider
