name: gev_bkk_tour
tier: full
turns:
- user: Hi Ada.
  expect:
    timeout_s: 45
    settle_s: 4
- user: First, stop the camera walls bound to screen {real_screen} — the traffic and rama9 zones.
    I want it fully idle.
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    - vcast_list
    timeout_s: 120
    settle_s: 10
- user: Split screen {real_screen} into two panes — God's Eye View on the left, and I'll put camera
    pictures on the right.
  expect:
    response_nonempty: true
    timeout_s: 120
    settle_s: 8
- user: Yes — do the split and put God's Eye View on the left pane.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 120
    settle_s: 25
- user: Fly the map into Bangkok — right over the city.
  expect:
    calls_any:
    - gev_command
    result_contains:
    - delivered
    result_not_contains:
    - gev command relay
    - no GEV clients
    - '"ok": false'
    - '\\"ok\\": false'
    response_nonempty: true
    timeout_s: 120
    settle_s: 12
    no_failed_result:
    - gev_command
- user: Put the traffic camera wall on the right pane — the rama9 zone.
  expect:
    calls_any:
    - cast_to_screen
    - cctv_wall
    timeout_s: 120
    settle_s: 12
- user: Grab one live frame from any Bangkok camera you can — try a couple if needed.
  expect:
    calls_any:
    - ada_camera_snapshot
    timeout_s: 150
    settle_s: 12
- user: Say what you see — narrate it on that screen, out loud.
  expect:
    calls_any:
    - vcast_say
    timeout_s: 90
    settle_s: 8
- user: Take a snapshot of screen {real_screen} so I can check both panes.
  expect:
    calls_any:
    - vcast_snapshot
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
- user: All done — clear screen {real_screen} completely.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
