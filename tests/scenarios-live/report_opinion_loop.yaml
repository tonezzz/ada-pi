# Report → session loop: the Ada-in-the-loop opinion path (card
# report-loop-bench; umbrella report-session-loop; design
# docs/design/report-session-loop.md §4a in chaba).
#
# Tony asks Ada's opinion of a CMS report -> she must cms_get_page it
# (never opine unread — educate_standard evidence_rule) -> post it to
# the report-linked card as a from=ada [opinion] comment via
# ada_board_write.
#
# Fixtures (live state, no seeding needed):
#   report: dev-kanban  — regenerated by kanban-sync, always present
#   card:   scenario-report-opinion (report: dev-kanban) — dedicated
#           comms sink in chaba docs/ssot/kanban/cards/; [opinion] comms
#           from ada there are scenario output, not real review input.
#
# Card-side verification (the comment landed on the probe card) is out
# of the runner's reach — it asserts tool calls, not board state.
# Spot-check GET /apps/board-api/cards for the probe card's comms tail.
#
# tier: smoke — same cadence as education_correction so a regression in
# the loop shows in the hourly bench.
name: report_opinion_loop
tier: smoke

turns:
  # --- read-before-opine -------------------------------------------------
  # An opinion without a cms_get_page first is the failure this scenario
  # exists to catch.
  - user: "What's your opinion of the dev-kanban report — is it accurate?"
    expect:
      calls_any: [cms_read, cms_get_page]
      response_nonempty: true
      timeout_s: 120
      settle_s: 8

  # --- post the opinion ---------------------------------------------------
  # She may already have posted it on turn 1 (the instructions tell her
  # to) — either way a board write must be observed on this turn, and it
  # must target the report-LINKED card. call_args_contain guards the
  # landing spot: the first live run (pre-§3b deploy) passed a bare
  # calls_any while Ada posted to report-loop-ada-opinion by title match
  # — a write to the wrong card is a broken loop, not a pass.
  - user: "Post that opinion to the linked kanban card now — use ada_board_write to comment it"
    expect:
      calls_any: [kanban]
      call_args_contain:
        kanban: ["scenario-report-opinion"]
      response_nonempty: true
      timeout_s: 120
      settle_s: 8

# No cleanup: probe card comms accumulate by design (they're the scenario
# trail, and the seed corpus for the report-opinion bench domain);
# dev-kanban is read-only here.
