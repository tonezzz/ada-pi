# Deep research request — Ada is asked to research tiny on-device models
# (~43MB class) as a front-end preprocessor for Chaba. Target behavior:
# she acknowledges the scope, dispatches a long-running research task
# (devin_dispatch or web_search loop today; ada_deep_research once it
# exists), and does NOT block waiting — the report arrives later.
name: deep_research_tiny_models
turns:
  - user: >-
      Research tiny AI models around 43 megabytes — like SmolLM2-135M or
      Qwen quantized — and assess whether one could work as a front-end
      preprocessor for Chaba: classify my intent, extract slots, decide
      answer-locally vs escalate. Include how we should benchmark it.
    expect:
      calls_any: [web_search, devin_dispatch, ada_memory_search]
      timeout_s: 120
      settle_s: 15
      # Once ada_deep_research exists: expect calls_any: [ada_deep_research]
      # and she must NOT attempt to answer inline — background job.
