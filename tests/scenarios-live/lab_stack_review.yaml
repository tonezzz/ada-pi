name: lab_stack_review
turns:
- expect:
    calls_any:
    - ada_memory_search
    - ada_session_recall
    # No keyword check — Ada answers bilingual and Thai transcripts tokenize
    # unpredictably; recall-tool + non-empty answer is the real assertion.
    response_nonempty: true
    settle_s: 20
    timeout_s: 180
  user: Please review the pros and cons of my lab stack plan in the tony-projects
    memory bank, then give me your suggestion.
