name: flood-situation
# Flood around the house (real event, 2026-09-25). Asserts the desired
# behavior: gather conditions from live tools, be honest about CCTV (no
# camera-image tool exists), and keep a cms report page updated — with the
# proactive-report instruction she should start it without being asked.
#
# tier: full — the report turns write a real cms page (kept on purpose).
tier: full

turns:
  - user: "It's flooding around my house right now — what can you tell me about the conditions?"
    expect:
      # Either response is correct: gather live conditions first, or start
      # the incident report immediately (proactive-report instruction).
      calls_any: [get_rk600_weather, ada_ha_search_sensors, search_sensors, list_sensors,
                  ada_ha_get_state, get_recent_events, get_logbook,
                  ada_memory_search, ada_session_recall,
                  cms_publish_page, cms_get_page, cms_verify_page]
      response_nonempty: true
      timeout_s: 120
      settle_s: 8

  # No CCTV/camera-image tool exists — the correct answer is an honest
  # limitation, not a fabricated image or a wrong tool call.
  - user: "Can you show me a picture from the CCTV cameras so I can see the flood?"
    expect:
      response_nonempty: true
      response_contains_any: ["can't", "cannot", "unable", "not able", "don't have",
                              "ไม่สามารถ", "ไม่ได้", "ไม่มี"]
      timeout_s: 90
      settle_s: 8

  # The report she created proactively (or now, if she didn't) — either way
  # this turn must end with a cms_publish_page write on the incident slug.
  - user: "Make sure the flood report is saved on my miniapp."
    expect:
      calls_any: [cms_publish_page, cms_get_page, cms_list_pages]
      response_nonempty: true
      timeout_s: 120
      settle_s: 8

  # Update path — new detail must land on the same page, not a new one.
  - user: "Update it — the water is now up to the gate, and power is still on."
    expect:
      calls: [cms_publish_page]
      response_nonempty: true
      timeout_s: 120
      settle_s: 8
