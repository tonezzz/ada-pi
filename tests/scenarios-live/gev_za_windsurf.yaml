name: gev_za_windsurf
tier: full
turns:
- user: Hi Ada.
  expect:
    timeout_s: 45
    settle_s: 4
- user: First, stop every camera wall bound to screen 1 — check vcast_list for which
    zones hold it and disable them all. I want it fully idle.
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    - vcast_list
    timeout_s: 120
    settle_s: 10
- user: Put God's Eye View on screen 1, full screen.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 150
    settle_s: 30
- user: Start in Johannesburg — fly the map over the city first.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 120
    settle_s: 12
    no_failed_result:
    - gev_command
- user: Now fly south — all the way down to Cape Town. When you arrive, frame Bloubergstrand
    beach on the west coast, north of the city — that's the windsurf strip.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 20
    no_failed_result:
    - gev_command
- user: 'Spy the windsurf clubs: fly to -33.7940, 18.4620 — that''s Bloubergstrand,
    the main kite and windsurf launch. Zoom low, annotate the beach, and narrate what
    you''d look for — sail colors, launch area, parking.'
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: Slide down the coast to -33.7880, 18.4550 — Big Bay, the next launch south.
    Annotate and narrate it too.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: 'One more down the strip: -33.8410, 18.4800 — Sunset Beach, where the downwind
    runs end. Annotate it, narrate, then pull back so all three spots are in frame
    together.'
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 18
    no_failed_result:
    - gev_command
- user: Read me what the map is actually looking at right now — the real view state.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 90
    settle_s: 10
    no_failed_result:
    - gev_command
- user: Take a snapshot of screen 1 — I want to see the three spots framed.
  expect:
    calls_any:
    - vcast_snapshot
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
- user: Done — clear screen 1 back to idle.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
