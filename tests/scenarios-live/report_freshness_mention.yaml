# Freshness ritual — when Ada answers from a report she must state
# when it was last updated (time-of-event) before its content, so the
# user knows how current the claim is. ops-health is the fixture: it
# updates every 15min and always has an `updated` timestamp.
name: report_freshness_mention
tier: full
turns:
  - user: >-
      Ada, what's the ops health status right now? And when was that
      report last updated?
    expect:
      calls_any: [cms_get_page, cms_list_pages]
      response_nonempty: true
      timeout_s: 90
      settle_s: 8
      # She must give a recency/time answer — the ritual's core claim.
      response_contains_any:
        # A real answer reports the health state. Any-list across both
        # languages; time words ("เมื่อ") alone are too common and let a
        # drifted transcript pass.
        - "health"
        - "status"
        - "สถานะ"
        - "degraded"
        - "ok"
        - "ปกติ"
        - "เฮลท์"
        - "healthy"
      # Health state must appear too — merge into the any-list (Thai
      # sessions won't say "health"; DEGRADED/ok/ปกติ cover both langs).
      # The not_contains guards against pure-hedge answers.
      response_not_contains:
        - "I don't have"
        - "ไม่มีรายงาน"
        - "not sure"
