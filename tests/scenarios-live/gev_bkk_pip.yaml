name: gev_bkk_pip
tier: full
preflight:
  - {check: gev_relay}
  - {check: vcast_online, screens: ["{real_screen}"]}

turns:
- user: Hi Ada.
  expect:
    timeout_s: 45
    settle_s: 4
- user: First, stop the camera walls bound to screen {real_screen} — the traffic and rama9 zones.
    I want it fully idle.
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    timeout_s: 120
    settle_s: 10
- user: Put God's Eye View fullscreen on screen {real_screen} with a floating camera window pinned
    top-right — picture-in-picture — start it on the rama9 camera zone.
  expect:
    calls_any:
    - cast_to_screen
    - cctv_wall
    response_nonempty: true
    timeout_s: 180
    settle_s: 50
- user: Check screen {real_screen}'s state — tell me its layout.
  expect:
    calls_any:
    - vcast_list
    result_contains:
    - panes
    result_contains_any:
    - p1:img-nw
    - p1:frame-ok
    - p1:video-vw
    timeout_s: 90
    settle_s: 8
- user: 'Tour stop 1: fly the map to 13.8399, 100.5412 — the Pracha Niwet intersection
    in north Bangkok. Then swap the floating window to this camera: https://tony-dell.taila0626a.ts.net/apps/camwall/data/traffic/itic---pracha-niwet-intersection--bangkok.jpg
    — and narrate it properly on the screen: where we are, what this camera looks
    at, and what the frame shows right now.'
  expect:
    calls_any:
    - gev_command
    - cast_to_screen
    no_unattempted_refusal:
    - gev_command
    - cast_to_screen
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - 13.8399
    - 100.5412
    - 15
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - ประชานิเวศน์
    timeout_s: 240
    settle_s: 18
    no_failed_result:
    - gev_command
- user: 'Stop 2: fly to 13.7226, 100.5533 — the Rama 4 expressway interchange downtown.
    Point the floating window at this camera: https://tony-dell.taila0626a.ts.net/apps/camwall/data/traffic/itic---expressway--rama-4-interchange.jpg
    — narrate it: the junction, the expressway, what the frame is showing.'
  expect:
    calls_any:
    - gev_command
    - cast_to_screen
    no_unattempted_refusal:
    - gev_command
    - cast_to_screen
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - 13.7226
    - 100.5533
    - 15
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - - พระราม
        - Rama
    timeout_s: 240
    settle_s: 18
    no_failed_result:
    - gev_command
- user: 'Last stop: fly to 13.6689, 100.6292 — the Burapha Withi expressway at Bang
    Na km zero. Put this camera in the floating window: https://tony-dell.taila0626a.ts.net/apps/camwall/data/burapha/%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B8%9E-%E0%B9%80%E0%B8%A8%E0%B8%A9%E0%B8%9A-%E0%B8%A3%E0%B8%9E%E0%B8%B2%E0%B8%A7-%E0%B8%96----bangna-trat-km-0--east.jpg
    — narrate it, then tell me we''re done.'
  expect:
    calls_any:
    - gev_command
    - cast_to_screen
    no_unattempted_refusal:
    - gev_command
    - cast_to_screen
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - 13.6689
    - 100.6292
    - 15
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - - บูรพา
        - บางนา
        - Bang Na
    timeout_s: 240
    settle_s: 18
    no_failed_result:
    - gev_command
- user: Snapshot screen {real_screen}, then clear it back to idle.
  expect:
    calls_any:
    - vcast_snapshot
    timeout_s: 120
    settle_s: 10
