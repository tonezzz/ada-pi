name: gev_screen1_interact
tier: full
preflight:
  - {check: gev_relay}
  - {check: vcast_online, screens: [1]}

turns:
- user: Put God's Eye View on screen 1 for me.
  expect:
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
- user: Yes, go ahead — screen 1 is fine to use.
  expect:
    result_not_contains:
    - denied
    response_nonempty: true
    timeout_s: 120
    settle_s: 20
- user: What's it showing right now?
  expect:
    calls_any:
    - gev_command
    - vcast_snapshot
    - vcast_list
    response_nonempty: true
    timeout_s: 90
    settle_s: 12
    no_failed_result:
    - gev_command
- user: Fly the view to Bangkok.
  expect:
    calls_any:
    - gev_command
    result_contains:
    - delivered
    result_not_contains:
    - '"delivered": 0'
    - '\\"delivered\\": 0'
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 90
    settle_s: 15
    no_failed_result:
    - gev_command
- user: Now zoom out so I can see the whole globe.
  expect:
    calls_any:
    - gev_command
    result_contains:
    - delivered
    result_not_contains:
    - '"delivered": 0'
    - '\\"delivered\\": 0'
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 90
    settle_s: 15
    no_failed_result:
    - gev_command
- user: Confirm the camera actually moved — ask it for the current view state.
  expect:
    calls_any:
    - gev_command
    result_contains:
    - responses
    result_not_contains:
    - gev command relay
    - no GEV clients
    - '"delivered": 0'
    - '\\"delivered\\": 0'
    response_nonempty: true
    timeout_s: 90
    settle_s: 10
    no_failed_result:
    - gev_command
- user: Done — take it off that screen.
  expect:
    calls_any:
    - cast_to_screen
    - vcast_screen_cast
    response_nonempty: true
    timeout_s: 90
    settle_s: 12
