name: gev_za_tour
tier: full
turns:
- user: Hi Ada.
  expect:
    timeout_s: 45
    settle_s: 4
- user: First, stop every camera wall bound to screen {real_screen} — check vcast_list for which
    zones hold it and disable them all. I want it fully idle.
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    - vcast_list
    timeout_s: 120
    settle_s: 10
- user: Put God's Eye View on screen {real_screen} — full screen this time, no split.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 150
    settle_s: 30
- user: Fly the map into Johannesburg, South Africa — right over the city.
  expect:
    calls_any:
    - gev_command
    result_contains:
    - delivered
    result_not_contains:
    - gev command relay
    - no GEV clients
    - '"ok": false'
    - '\\"ok\\": false'
    response_nonempty: true
    timeout_s: 120
    settle_s: 12
    no_failed_result:
    - gev_command
- user: 'Stop 1: fly to -26.2348, 27.9824 — FNB Stadium, the big calabash-shaped World
    Cup stadium. Drop a map annotation on it and tell the screen what we''re looking
    at.'
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: 'Stop 2: fly to -26.1076, 28.0567 — Nelson Mandela Square in Sandton. Annotate
    it and narrate again on the screen.'
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: 'Last stop: fly to -26.1889, 28.0431 — Constitution Hill. Annotate, narrate,
    then pull back so the whole city is in frame.'
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: Ask the map where the camera is right now — read back the actual coordinates.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 90
    settle_s: 10
    no_failed_result:
    - gev_command
- user: Take a snapshot of screen {real_screen} — I want to see the final view.
  expect:
    calls_any:
    - vcast_snapshot
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
- user: Tour over — clear screen {real_screen} back to idle.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
