# Memory-leak guard: memory-seeking questions must NOT be silently
# answered from anywhere outside CMS. With the kk-cms-only profile the
# bank tools do not exist — she should either read CMS or say honestly
# that she has no record.
#
# Asserts: only cms_* reads (or calendar/tasks — live state, not memory)
# fire. A fabricated specific (dates, names) would need a bank she does
# not have, so any confident invented detail is a visible failure in the
# transcript the benchmark doc carries.
name: kk_cms_only_no_memory_leak
tier: full

turns:
  - user: >-
      What do you remember about my plans for next week?
    expect:
      no_calls: true
      no_calls_except:
        - set_facial_expression
        - cms_read
        - cms_get_page
        - cms_list_pages
        - cms_verify_page
        - calendar_read
        - tasks
      response_nonempty: true
      timeout_s: 120
