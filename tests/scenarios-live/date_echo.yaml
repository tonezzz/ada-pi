name: date-echo
tier: smoke
# Date-echo rule regression (added 2026-09-29): whenever a relative
# day-word appears, Ada must resolve it out loud as absolute day+date —
# Thai colloquial time treats the day boundary as sleep, not midnight,
# so silent resolution reads as an error after 00:00.
#
# Turn 1 checks the read-path echo; turn 2 checks the write-path
# restate (confirm gate) names the resolved date, then declines so
# nothing is written. Tokens {today*}/{tomorrow*} expand in Asia/Bangkok.

turns:
  - user: >-
      Ada — quick check before I plan anything: what day and date is
      tomorrow exactly?
    expect:
      response_contains_any: ["{tomorrow_dow}", "{tomorrow_dow_th}"]
      timeout_s: 60
      settle_s: 6

  - user: >-
      ใส่ task ให้หน่อย: พรุ่งนี้เช็คน้ำในตู้เย็น
    expect:
      # confirm gate restates the task — the echo rule requires the
      # resolved day/date in the restatement, either language
      response_contains_any: ["{tomorrow_dow}", "{tomorrow_dow_th}"]
      timeout_s: 90
      settle_s: 8

  - user: "ไม่ต้อง ยังไม่ต้องเพิ่ม"
    expect:
      response_nonempty: true
      timeout_s: 60
      settle_s: 5
