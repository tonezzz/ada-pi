# cam-to-screen — the real camera->display loop Tony hit on 2026-09-28:
# snap a VMS camera, put the still on vcast screens, VERIFY visually, clean
# up. Guards the regressions seen live:
#   1) Ada inventing a snapshot URL -> broken image (must return cast_url)
#   2) vcast_snapshot saying idle-or-overlay on a broken img (now reports
#      image-load-failed)
#   3) starting a capture without asking — the capture gate now DENIES
#      cctv_snapshot/cctv_wall/uplink until the user says yes, so the
#      scenario does the ask -> confirm -> act handshake explicitly.
# tier: full — casts content to real displays. Targets screen 2 because
# screen 1 (iPad) is typically offline outside demo sessions; an offline
# screen can never return delivered>0.
name: cam-to-screen
tier: full

turns:
  # T1 — request: Ada must ASK before capturing (the tool may fire and be
  # denied; the contract is that she asks rather than casting silently).
  - user: "Ada, take a snapshot of the swimming pool camera and put it on screen 2."
    expect:
      response_contains_any:
        - "confirm"
        - "ok to"
        - "okay to"
        - "shall I"
        - "want me to"
        - "may I"
        - "ไหม"
        - "ยืนยัน"
        - "ให้ดึง"
        - "ตกลง"
      max_calls: 10
      timeout_s: 120
      settle_s: 8

  # T2 — explicit yes: the capture+cast must actually happen this time.
  - user: "Yes, go ahead."
    expect:
      calls_any: [cctv_snapshot, ada_camera_snapshot, cast_to_screen]
      result_contains: ["delivered"]
      response_nonempty: true
      max_calls: 10
      timeout_s: 240                        # vms snap ~16s (+retry) + cast
      settle_s: 10

  # T3 — visual verify on screen 2.
  - user: "Look at screen 2 and tell me what it's actually showing."
    expect:
      calls_any: [vcast_snapshot, vcast_list]  # liveness check first is fine
      response_nonempty: true
      # she should describe the pool still — or honestly report a failure
      response_contains_any: ["pool", "water", "camera", "snapshot",
                              "image", "offline", "not connected", "idle",
                              "สระ", "น้ำ", "กล้อง", "เชื่อมต่อ", "ว่าง"]
      max_calls: 8
      timeout_s: 120
      settle_s: 8

  # T4 — teardown.
  - user: "Thanks — stop screen 2, back to idle."
    expect:
      calls_any: [cast_to_screen]
      response_nonempty: true
      max_calls: 8
      timeout_s: 90
      settle_s: 8
