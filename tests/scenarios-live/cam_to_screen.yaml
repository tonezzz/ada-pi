# cam-to-screen — the real camera->display loop Tony hit on 2026-09-28:
# snap a VMS camera, put the still on vcast screens, VERIFY visually, clean
# up. Guards the regressions seen live:
#   1) Ada inventing a snapshot URL -> broken image (must return cast_url)
#   2) vcast_snapshot saying idle-or-overlay on a broken img (now reports
#      image-load-failed)
#   3) contract updated 2026-09-29: an EXPLICIT camera request IS the
#      consent — Ada must cast directly on T1, no confirm round-trip.
#      (The companion scenario camera_cast_permission covers the
#      unprompted-capture gate.)
# tier: full — casts content to real displays. Targets {real_screen} —
# the real-browser lab display (vcast-real@N on idc02, default 6;
# override with VCAST_REAL_SCREEN). An offline screen can never return
# delivered>0 and only a real browser produces frame-ok evidence.
name: cam-to-screen
tier: full

# The still must actually reach the screen's room — headless display or
# real device, offline is INFRA.
preflight:
  - {check: vcast_online, screens: ["{real_screen}"]}

turns:
  # T1 — explicit ask: capture + cast directly, no confirm dance.
  - user: "Ada, take a snapshot of the swimming pool camera and put it on screen {real_screen}."
    expect:
      calls_any: [cctv_snapshot, ada_camera_snapshot, cast_to_screen, cctv_wall]
      result_contains: ["delivered"]
      response_nonempty: true
      max_calls: 10
      timeout_s: 240                        # vms snap ~16s (+retry) + cast
      settle_s: 8

  # T2 — the redundant "yes": if the image already landed, re-casting is
  # unnecessary — or_state waives the call assertions when screen {real_screen}
  # already shows the image.
  - user: "Yes, go ahead."
    expect:
      calls_any: [cctv_snapshot, ada_camera_snapshot, cast_to_screen]
      or_state: {vcast_screen: 2, state: image}
      response_nonempty: true
      max_calls: 10
      timeout_s: 160
      settle_s: 10

  # T3 — visual verify on screen {real_screen}.
  - user: "Look at screen {real_screen} and tell me what it's actually showing."
    expect:
      calls_any: [vcast_snapshot, vcast_list]  # liveness check first is fine
      response_nonempty: true
      # she should describe the pool still — or honestly report a failure
      response_contains_any: ["pool", "water", "camera", "snapshot",
                              "image", "offline", "not connected", "idle",
                              "สระ", "น้ำ", "กล้อง", "เชื่อมต่อ", "ว่าง",
                              "ภาพ", "ไม่ได้", "ลิงก์", "แสดง"]
      max_calls: 8
      timeout_s: 160
      settle_s: 8

  # T4 — teardown.
  - user: "Thanks — stop screen {real_screen}, back to idle."
    expect:
      calls_any: [cast_to_screen]
      response_nonempty: true
      max_calls: 8
      timeout_s: 90
      settle_s: 8
