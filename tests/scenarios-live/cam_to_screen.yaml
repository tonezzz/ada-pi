# cam-to-screen — the real camera->display loop Tony hit on 2026-09-28:
# snap a VMS camera, put the still on vcast screens, VERIFY visually, clean
# up. Guards the regressions seen live:
#   1) Ada inventing a snapshot URL -> broken image (must return cast_url)
#   2) vcast_snapshot saying idle-or-overlay on a broken img (now reports
#      image-load-failed)
#   3) starting a capture without asking — the capture gate now DENIES
#      cctv_snapshot/cctv_wall/uplink until the user says yes, so the
#      scenario does the ask -> confirm -> act handshake explicitly.
# tier: full — casts content to real displays.
name: cam-to-screen
tier: full

turns:
  # T1 — request: Ada must ASK before capturing (the tool may fire and be
  # denied; the contract is that she asks rather than casting silently).
  - user: "Ada, take a snapshot of the swimming pool camera and put it on screen 1."
    expect:
      response_contains_any:
        - "confirm"
        - "ok to"
        - "okay to"
        - "shall I"
        - "want me to"
        - "may I"
        - "ยืนยัน"
        - "ให้ดึง"
        - "ตกลง"
      max_calls: 10
      timeout_s: 120
      settle_s: 8

  # T2 — explicit yes: the capture+cast must actually happen this time.
  - user: "Yes, go ahead."
    expect:
      calls_any: [cctv_snapshot, ada_camera_snapshot, cast_to_screen]
      result_contains: ["delivered"]
      response_nonempty: true
      max_calls: 10
      timeout_s: 180                        # vms snap ~15s + cast
      settle_s: 10

  # T3 — visual verify on screen 1.
  - user: "Look at screen 1 and tell me what it's actually showing."
    expect:
      calls_any: [vcast_snapshot, vcast_list]  # liveness check first is fine
      response_nonempty: true
      # she should describe the pool still — or honestly report a failure
      response_contains_any: ["pool", "water", "camera", "snapshot",
                              "image", "offline", "not connected",
                              "สระ", "น้ำ", "กล้อง", "ไม่ได้เชื่อม"]
      max_calls: 8
      timeout_s: 120
      settle_s: 8

  # T4 — extend to screen 2. The capture contract asks once per capture;
  # the already-confirmed session intent carries, but a second ask is also
  # acceptable behavior — so no hard call expectation, just a response.
  - user: "Show the pool camera on screen 2 as well — same confirmation applies."
    expect:
      response_nonempty: true
      max_calls: 10
      timeout_s: 180
      settle_s: 8

  # T5 — verify screen 2.
  - user: "Check screen 2 as well — is the same picture up?"
    expect:
      calls_any: [vcast_snapshot]
      response_nonempty: true
      max_calls: 8
      timeout_s: 120
      settle_s: 8

  # T6 — teardown.
  - user: "Thanks — stop both screens, back to idle."
    expect:
      calls_any: [cast_to_screen]
      response_nonempty: true
      max_calls: 8
      timeout_s: 90
      settle_s: 8
