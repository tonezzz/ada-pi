name: gev_bkk_route_th
tier: full
turns:
- user: สวัสดีครับ Ada
  expect:
    timeout_s: 45
    settle_s: 4
- user: ก่อนอื่น หยุดผังกล้องที่ผูกกับหน้าจอ {real_screen} ไว้ก่อน — โซน traffic กับ rama9 — ให้จอว่างสนิท
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    timeout_s: 120
    settle_s: 10
- user: เปิด God's Eye View เต็มจอบนหน้าจอ {real_screen} แล้วปักหน้าต่างกล้องลอยมุมขวาบน โซน rama9
  expect:
    calls_any:
    - cast_to_screen
    - cctv_wall
    response_nonempty: true
    timeout_s: 180
    settle_s: 50
- user: 'วาดเส้นทางบินบนแผนที่: จากแยกประชานิเวศน์ (13.8399, 100.5412) ลงมาที่ทางด่วนพระราม
    4 (13.7226, 100.5533) แล้วไปต่อที่ทางพิเศษบูรพาวิถี กม.0 บางนา (13.6689, 100.6292)'
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    - '"ok": false'
    - '\\"ok\\": false'
    gev_view_near:
    - 13.7226
    - 100.5533
    - 15
    gev_screen: "{real_screen}"
    timeout_s: 240
    settle_s: 15
    no_failed_result:
    - gev_command
- user: บินตามเส้นทางนั้นเลย — ใช้ fly_route ความเร็ว 'fast' (มันจะเร่งตอนออกตัวและชะลอเองตอนเข้าใกล้จุด)
    — พร้อมบรรยายบนจอว่าเรากำลังผ่านอะไร
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    timeout_s: 240
    settle_s: 60
    no_failed_result:
    - gev_command
- user: จับภาพหน้าจอ {real_screen} ให้ดูหน่อย แล้วเคลียร์จอกลับเป็นว่าง
  expect:
    calls_any:
    - vcast_snapshot
    timeout_s: 120
    settle_s: 10
