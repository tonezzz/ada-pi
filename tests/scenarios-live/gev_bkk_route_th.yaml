# Bangkok tour (Thai) — smooth fly_route through drawn waypoints.
# annotate_map(type=route, points=[...]) draws the path, fly_route then
# flies it as one continuous camera move — no jump-cuts between stops.
# PiP pane top-right keeps the rama9 wall visible during the flight.
# tier: full — actuates a real display.
name: gev_bkk_route_th
tier: full
turns:
  - user: "สวัสดีครับ Ada"
    expect:
      timeout_s: 45
      settle_s: 4

  - user: "ก่อนอื่น หยุดผังกล้องที่ผูกกับหน้าจอ 4 ไว้ก่อน — โซน traffic กับ rama9 — ให้จอว่างสนิท"
    expect:
      calls_any: [cctv_wall, cast_to_screen]
      timeout_s: 120
      settle_s: 10

  - user: "เปิด God's Eye View เต็มจอบนหน้าจอ 4 แล้วปักหน้าต่างกล้องลอยมุมขวาบน โซน rama9"
    expect:
      calls_any: [cast_to_screen, cctv_wall]
      response_nonempty: true
      timeout_s: 180
      settle_s: 50   # pip layout + Cesium cold-load + wall thumbs

  # draw the route — annotate_map(type=route) resolves+draws the path
  - user: "วาดเส้นทางบินบนแผนที่: จากแยกประชานิเวศน์ (13.8399, 100.5412) ลงมาที่ทางด่วนพระราม 4 (13.7226, 100.5533) แล้วไปต่อที่ทางพิเศษบูรพาวิถี กม.0 บางนา (13.6689, 100.6292)"
    expect:
      calls_any: [gev_command]
      no_unattempted_refusal: [gev_command]
      result_not_contains: ['gev command relay', 'no GEV clients',
                            '"ok": false', '\\"ok\\": false']
      result_geo_near: [13.7226, 100.5533, 15]
      timeout_s: 240
      settle_s: 15

  # fly it smoothly — fly_route uses the drawn path
  - user: "บินตามเส้นทางนั้นเลย — ใช้ fly_route ความเร็ว 'fast' (มันจะเร่งตอนออกตัวและชะลอเองตอนเข้าใกล้จุด) — พร้อมบรรยายบนจอว่าเรากำลังผ่านอะไร"
    expect:
      calls_any: [gev_command]
      no_unattempted_refusal: [gev_command]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 60   # the route flight itself takes a while

  - user: "จับภาพหน้าจอ 4 ให้ดูหน่อย แล้วเคลียร์จอกลับเป็นว่าง"
    expect:
      calls_any: [vcast_snapshot]
      timeout_s: 120
      settle_s: 10
