name: gev_za_tour_th
tier: full
turns:
- user: สวัสดีครับ Ada
  expect:
    timeout_s: 45
    settle_s: 4
- user: หยุดผังกล้องที่ผูกกับหน้าจอ {real_screen} — โซน traffic กับ rama9 — ให้จอว่าง
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    - vcast_list
    timeout_s: 120
    settle_s: 10
- user: 'เปิด God''s Eye View เต็มจอบนหน้าจอ {real_screen} แล้วปักหน้าต่างกล้องลอยมุมขวาบน — เอาไลฟ์สตรีมซาฟารี
    Africam จาก YouTube: https://www.youtube.com/watch?v=ZwxMY_3XZ_A'
  expect:
    calls_any:
    - cast_to_screen
    - cctv_wall
    response_nonempty: true
    timeout_s: 180
    settle_s: 65
- user: พาไปทัวร์แอฟริกาใต้ — บินเข้าเมืองโจฮันเนสเบิร์กก่อน แล้วบรรยายภาษาไทยบนจอว่าเรามาถึงอะไร
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -26.2041
    - 28.0473
    - 60
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - โจฮัน
    timeout_s: 240
    settle_s: 20
    no_failed_result:
    - gev_command
- user: 'วาดเส้นทางบินในเมืองโจฮันเนสเบิร์ก: จากตัวเมือง (-26.2041, 28.0473) ไปแซนด์ตัน
    (-26.1076, 28.0567) แล้วบินตามเส้นทางนั้นช้าๆ พร้อมบรรยาย'
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -26.1076
    - 28.0567
    - 15
    gev_screen: "{real_screen}"
    timeout_s: 240
    settle_s: 60
    no_failed_result:
    - gev_command
- user: บินลงใต้ไปเคปทาวน์ เทเบิลเมาเทน (-33.9628, 18.4098) — บรรยายเป็นภาษาไทยบนจอว่าถึงเคปทาวน์แล้ว
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -33.9249
    - 18.4241
    - 60
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - เคปทาวน์
    timeout_s: 240
    settle_s: 20
    no_failed_result:
    - gev_command
- user: ขึ้นเหนือไปลังก์บานลากูน (-33.0965, 18.0300) แล้วบรรยายปิดท้ายเป็นภาษาไทยบนจอ
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -33.0965
    - 18.0299
    - 40
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - ลังก์บาน
    timeout_s: 240
    settle_s: 20
    no_failed_result:
    - gev_command
- user: จับภาพหน้าจอ {real_screen} ให้ดูหน่อย แล้วเคลียร์จอกลับเป็นว่าง
  expect:
    calls_any:
    - vcast_snapshot
    timeout_s: 120
    settle_s: 10
