# Guided GEV camera tour (tour card th001, prepared by tour-prep.py).
# Pre-selected live cams + coords + cached frame URLs — deterministic.
# Each stop: fly to the cam's real coordinates -> pop its live frame on
# the right pane -> narrate on the display. Ends with the report wall
# and a CMS write-up. Tier: full — actuates real displays.
name: gev_tour_report
tier: full
turns:
  - user: "Hi Ada."
    expect:
      timeout_s: 45
      settle_s: 4

  - user: "First, stop the camera walls bound to screen 4 — the traffic and rama9 zones. I want it fully idle."
    expect:
      calls_any: [cctv_wall, cast_to_screen]
      timeout_s: 120
      settle_s: 10
      # traffic+rama9 zones hold a screen-4 binding and re-assert the wall
      # over any split layout — release the binding before the tour

  - user: "Split screen 4 — God's Eye View on the left, a camera pane on the right."
    expect:
      response_nonempty: true
      timeout_s: 120
      settle_s: 8

  - user: "Yes — set up the split and load God's Eye View on the left."
    expect:
      calls_any: [cast_to_screen]
      response_nonempty: true
      timeout_s: 150
      settle_s: 30   # Cesium init

  # stop 1 — Pracha Niwet intersection, Bangkok (traffic zone, live)
  - user: "Tour stop 1: fly the map to 13.8399, 100.5412 — that's the Pracha Niwet intersection. Then put this camera frame on the right pane: https://tony-dell.taila0626a.ts.net/apps/camwall/data/traffic/itic---pracha-niwet-intersection--bangkok.jpg — and narrate what the camera shows on that screen."
    expect:
      calls_any: [gev_command, cast_to_screen]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 16

  # stop 2 — Rama 4 expressway interchange (traffic zone, live)
  - user: "Stop 2: fly to 13.7226, 100.5533 — the Rama 4 expressway interchange. Swap the right pane to this frame: https://tony-dell.taila0626a.ts.net/apps/camwall/data/traffic/itic---expressway--rama-4-interchange.jpg — narrate it again."
    expect:
      calls_any: [gev_command, cast_to_screen]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 16

  # stop 3 — Burapha Withi Bangna-Trat km 0 East (burapha zone, live)
  - user: "Final stop: fly to 13.6689, 100.6292 — Burapha Withi expressway, Bang Na km zero. Right pane gets this frame: https://tony-dell.taila0626a.ts.net/apps/camwall/data/burapha/%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B8%9E-%E0%B9%80%E0%B8%A8%E0%B8%A9%E0%B8%9A-%E0%B8%A3%E0%B8%9E%E0%B8%B2%E0%B8%A7-%E0%B8%96----bangna-trat-km-0--east.jpg — narrate it."
    expect:
      calls_any: [gev_command, cast_to_screen]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 16

  # the trip report wall — pre-built presentation page
  - user: "Show the trip report on the right pane — open https://tony-dell.taila0626a.ts.net/apps/camwall/tour-th001.html there."
    expect:
      calls_any: [cast_to_screen]
      timeout_s: 120
      settle_s: 12

  # CMS write-up — she summarizes the tour with what she saw
  - user: "Write up this trip as a short report page — 'Bangkok Traffic Cam Tour' — listing the three stops and what each camera showed."
    expect:
      calls_any: [cms_publish_page]
      response_nonempty: true
      timeout_s: 150
      settle_s: 12

  - user: "Snapshot screen 4, then clear it back to idle."
    expect:
      calls_any: [vcast_snapshot]
      timeout_s: 120
      settle_s: 10
