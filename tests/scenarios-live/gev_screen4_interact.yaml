# GEV on screen 4 — incremental interaction chain.
#   cast /apps/gev/ -> screen 4 (browser)
#   verify via get_current_view_state (nav casts sit in an iframe — the
#   display-side snapshot can't read cross-origin pixels, so GEV's own
#   state endpoint is the verification path)
#   fly to Bangkok -> zoom out -> track entity -> clear -> stop cast
# tier: full — actuates a real display.
name: gev_screen4_interact
tier: full
turns:
  - user: Put God's Eye View on screen 4 for me.
    expect:
      response_nonempty: true
      timeout_s: 90
      settle_s: 8
      # if the screen is busy she may ask before replacing its content —
      # the confirm contract; the next turn affirms

  - user: "Yes, go ahead — screen 4 is fine to use."
    expect:
      # she may already have cast on the previous turn — then there's
      # nothing to do here; downstream gev_command turns carry the weight
      result_not_contains: ['denied']
      response_nonempty: true
      timeout_s: 120
      settle_s: 20   # the display needs a beat to load Cesium before the next step

  # Verify what's actually on the screen — Ada should ask GEV for its own
  # view state, or try a snapshot (which will report uncapturable-iframe —
  # still a correct answer about what's showing).
  - user: What's it showing right now?
    expect:
      calls_any: [gev_command, vcast_snapshot, vcast_list]
      response_nonempty: true
      timeout_s: 90
      settle_s: 12

  - user: Fly the view to Bangkok.
    expect:
      calls_any: [gev_command]
      # relay must actually deliver — delivered:0 / relay errors must fail
      result_contains: ['delivered']
      result_not_contains: ['"delivered": 0', '\\"delivered\\": 0', 'gev command relay', 'no GEV clients']
      response_nonempty: true
      timeout_s: 90
      settle_s: 15   # the fly animation takes a few seconds

  - user: Now zoom out so I can see the whole globe.
    expect:
      calls_any: [gev_command]
      result_contains: ['delivered']
      result_not_contains: ['"delivered": 0', '\\"delivered\\": 0', 'gev command relay', 'no GEV clients']
      response_nonempty: true
      timeout_s: 90
      settle_s: 15

  - user: Confirm the camera actually moved — ask it for the current view state.
    expect:
      calls_any: [gev_command]
      # the verify loop: a live GEV page must return a tool_response —
      # 'responses' in the relay result is the real check
      result_contains: ['responses']
      result_not_contains: ['gev command relay', 'no GEV clients', '"delivered": 0', '\\"delivered\\": 0']
      response_nonempty: true
      timeout_s: 90
      settle_s: 10

  # Cleanup — leave the display idle like we found it.
  - user: Done — take it off that screen.
    expect:
      calls_any: [cast_to_screen, vcast_screen_cast]
      response_nonempty: true
      timeout_s: 90
      settle_s: 12
