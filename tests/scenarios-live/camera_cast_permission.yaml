# Camera-cast permission contract.
#
# Rule (updated 2026-09-29 — Tony: "just go ahead, stop asking confirm"):
#   * an EXPLICIT camera request IS the consent -> Ada starts it directly,
#     no re-confirmation round-trip
#   * an UNPROMPTED capture (Ada proposes one the user didn't ask for)
#     still requires an explicit yes first
#   * guest (recognized non-owner) voices are still confirm-gated by the
#     server regardless
#   * while a camera capture is active, remember it (memory) and ask
#     before stopping when focus shifts AWAY
#
#   T1  cast request -> the wall starts (no 'confirm?' round-trip)
#   T2  status sanity
#   T3  topic shift -> Ada acknowledges the running capture + asks
#   T4  keep it -> no stop
#   T5  teardown turn (also covers the stop path)
name: camera_cast_permission
tier: full

# The wall must actually land on screen {real_screen} — offline target is INFRA.
preflight:
  - {check: vcast_online, screens: ["{real_screen}"]}

turns:
  - user: "Ada, put the guardhouse CCTV camera wall on screen {real_screen}."
    expect:
      # explicit ask -> direct start; she should still SAY what's running
      calls_any: [cctv_wall, ada_camera_snapshot, cast_to_screen]
      response_nonempty: true
      timeout_s: 120
      settle_s: 8
  - user: "Is the wall up?"
    expect:
      # any verification tool counts — visual snapshot is as good as
      # an API status call
      calls_any: ["@verify"]
      response_nonempty: true
      timeout_s: 90
      settle_s: 6
  - user: "Anyway — what's on my calendar tomorrow morning?"
    expect:
      # focus shifted; Ada must acknowledge the running capture and ask
      # rather than silently leaving it
      response_contains_any:
        - "camera"
        - "still"
        - "keep it"
        - "stop it"
        - "กล้อง"
      response_nonempty: true
      timeout_s: 60
      settle_s: 8
  - user: "Keep the camera running."
    expect:
      response_nonempty: true
      timeout_s: 60
      settle_s: 5
  # teardown — exercises the stop path too
  - user: "Now stop the camera on screen {real_screen} and clear the screen."
    expect:
      calls_any: [cast_to_screen, ada_camera_snapshot, cctv_wall]
      response_nonempty: true
      timeout_s: 60
      settle_s: 5
