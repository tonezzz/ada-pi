# Regression for 2026-09-28 session: outdoor cameras all offline —
# Ada must report the failure gracefully in one turn instead of
# retry-looping or going silent. cctv/ada_camera_snapshot hit the
# vms-snap shim which can take ~10s.
name: camera_snapshot_offline
tier: full
turns:
  - user: "Ada, show me the camera snapshot from the guardhouse camera — if it's offline just tell me, don't keep retrying."
    expect:
      calls_any: [ada_camera_snapshot, cctv_snapshot, vcast_snapshot]
      max_calls: 4
      response_nonempty: true
      timeout_s: 160
      settle_s: 8
