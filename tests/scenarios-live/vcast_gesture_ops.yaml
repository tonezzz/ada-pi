# vcast-gesture ops — drives the gesture/pose mode on a real vcast display
# once the tool exists. Until then the early turns exercise vcast_list and
# the explain-path; actuation turns are whitelisted hard so any device or
# CMS side-effect fails the run.
#
# Expected tools (pending implementation):
#   vcast_gesture(screen, mode)  mode: off | hand | room
#     (hand=MediaPipe desk UX, room=YOLO-pose wake)
#   vcast_snapshot(screen)       display self-capture -> relay /frame -> image
#     (canvas snap of the video/img element; iframe casts report
#      uncapturable-iframe — then state-check is the fallback)
#
# tier: full — enables/disables a live display feature.
name: vcast-gesture-ops
tier: full

# Actuation turns need a gesture tool that has not shipped — score
# UNIMPLEMENTED (exit 4) instead of FAIL until it lands.
needs_any: [vcast_gesture, vcast_pose]
preflight:
  - {check: vcast_online, screens: [1]}

turns:
  # --- inventory -----------------------------------------------------------
  - user: "What vcast displays are registered right now?"
    expect:
      calls_any: [vcast_list]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - ada_memory_search
        - ada_session_recall
      max_calls: 6
      timeout_s: 60
      settle_s: 6

  # --- enable room-pose on a screen ---------------------------------------
  # Whichever tool name ships (vcast_gesture / vcast_pose), calls_any catches
  # it; adjust when the tool lands.
  - user: "Turn on the room-scale pose control on screen 1 — the wave-to-wake mode."
    expect:
      calls_any: [vcast_gesture, vcast_pose, vcast_screen_cast]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - vcast_screen_cast
        - ada_memory_search
      max_calls: 8
      timeout_s: 90
      settle_s: 8

  # --- confirm/verify state -------------------------------------------------
  - user: "Is pose control active on that screen now?"
    expect:
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - ada_memory_search
      max_calls: 6
      timeout_s: 60
      settle_s: 6

  # --- visual verify — she should LOOK at the screen, not trust the tool ---
  # This is the key training behavior: confirm via captured frame, not the
  # API's word. Any snapshot-family tool name passes.
  - user: "Don't just trust the setting — capture what the screen is actually showing and tell me if the pose overlay is on it."
    expect:
      calls_any: [vcast_snapshot, vcast_screenshot, ada_camera_snapshot]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - vcast_snapshot
        - vcast_screenshot
        - ada_camera_snapshot
        - ada_memory_search
      max_calls: 8
      timeout_s: 120
      settle_s: 10

  # --- disable -------------------------------------------------------------
  - user: "Turn it back off."
    expect:
      calls_any: [vcast_gesture, vcast_pose, vcast_screen_cast]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - vcast_screen_cast
      max_calls: 8
      timeout_s: 90
      settle_s: 8
