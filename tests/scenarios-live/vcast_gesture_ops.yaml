# vcast-gesture ops — drives the gesture/pose mode on a real vcast display
# once the tool exists. Until then the early turns exercise vcast_list and
# the explain-path; actuation turns are whitelisted hard so any device or
# CMS side-effect fails the run.
#
# Expected tool (pending implementation): vcast_gesture(screen, mode)
#   mode: off | hand | room   (hand=MediaPipe desk UX, room=YOLO-pose wake)
#
# tier: full — enables/disables a live display feature.
name: vcast-gesture-ops
tier: full

turns:
  # --- inventory -----------------------------------------------------------
  - user: "What vcast displays are registered right now?"
    expect:
      calls_any: [vcast_list]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - ada_memory_search
        - ada_session_recall
      max_calls: 6
      timeout_s: 60
      settle_s: 6

  # --- enable room-pose on a screen ---------------------------------------
  # Whichever tool name ships (vcast_gesture / vcast_pose), calls_any catches
  # it; adjust when the tool lands.
  - user: "Turn on the room-scale pose control on screen 1 — the wave-to-wake mode."
    expect:
      calls_any: [vcast_gesture, vcast_pose, vcast_screen_cast]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - vcast_screen_cast
        - ada_memory_search
      max_calls: 8
      timeout_s: 90
      settle_s: 8

  # --- confirm/verify state -------------------------------------------------
  - user: "Is pose control active on that screen now?"
    expect:
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - ada_memory_search
      max_calls: 6
      timeout_s: 60
      settle_s: 6

  # --- disable -------------------------------------------------------------
  - user: "Turn it back off."
    expect:
      calls_any: [vcast_gesture, vcast_pose, vcast_screen_cast]
      response_nonempty: true
      no_calls_except:
        - set_facial_expression
        - vcast_list
        - vcast_gesture
        - vcast_pose
        - vcast_screen_cast
      max_calls: 8
      timeout_s: 90
      settle_s: 8
