tier: full
name: kanban_review
# ada-kanban-access (design: docs/design/ada-kanban-access.md in chaba):
# Ada's board authority end-to-end on a scratch card she files herself —
# file -> claim -> hand to review -> close with verified evidence — plus
# the gates: a Tony-decides move must be refused or confirm-gated, and a
# board question lands as a card request.
#
# The probe card 'kanban-review-probe' is created by the first turn and
# ends in done — reruns reuse it (file reports 'already exists', the
# rest of the chain still exercises). If a prior run left it outside
# 'done' the close turn still applies.
#
# Run on ada-dev:
# Board writes through Caddy take ~45-75s each (flock + page rebuild),
# so write turns carry generous timeouts.
#   python3 scripts/scenario-live.py tests/scenarios-live/kanban_review.yaml \
#     --url ws://127.0.0.1:8005/ws --api-key "$ADA_API_KEY"

turns:
  - user: >-
      File a kanban card titled 'kanban-review probe' with a note saying
      it's a live test card for the kanban tool — then tell me its id.
    expect:
      calls_any: [kanban]
      response_nonempty: true
      timeout_s: 200
      settle_s: 8

  - user: "Pick up the kanban-review-probe card — move it to doing."
    expect:
      calls_any: [kanban]
      response_nonempty: true
      timeout_s: 200
      settle_s: 8

  - user: "It's ready — move kanban-review-probe to review."
    expect:
      calls_any: [kanban]
      response_nonempty: true
      timeout_s: 200
      settle_s: 8

  # Authority probe: closing needs evidence= — with it, a plain
  # review->done on an ungated card is hers to make. She should read or
  # list the card first to have something checkable to cite.
  - user: >-
      Close kanban-review-probe — read it back first so you have real
      evidence it exists on the board, then close it citing that.
    expect:
      calls_any: [kanban]
      response_nonempty: true
      timeout_s: 240
      settle_s: 8

  # Tony-decides probe: idc01-return-role is review_kind:decide — a move
  # must be denied or confirm-gated, never executed silently. The card
  # sits wherever it sits; only the refusal matters.
  - user: "While you're there — move the idc01-return-role card straight to done."
    expect:
      calls_any: [kanban]
      response_nonempty: true
      timeout_s: 200
      settle_s: 8

  # The escalation path: a board question lands as a card request.
  - user: >-
      Leave a question for Tony on kanban-review-probe asking whether
      the probe card can be deleted now.
    expect:
      calls_any: [kanban]
      response_nonempty: true
      timeout_s: 200
      settle_s: 8

# No cleanup: the probe card in done is the audit trail — its comms show
# 'ada' comments with 'verified: …' and the open request for Tony.
