name: gev_za_pip
tier: full
preflight:
  - {check: gev_relay}
  - {check: vcast_online, screens: ["{real_screen}"]}

turns:
- user: Hi Ada.
  expect:
    timeout_s: 45
    settle_s: 4
- user: First, stop the camera walls bound to screen {real_screen} — the traffic and rama9 zones.
    I want it fully idle.
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    timeout_s: 120
    settle_s: 10
- user: 'Put God''s Eye View on screen {real_screen} fullscreen, with a floating camera view pinned
    to the top-right corner — picture-in-picture style — play the Africam live safari
    stream there: https://www.youtube.com/watch?v=ydYDqZQpim8'
  expect:
    calls_any:
    - cast_to_screen
    - cctv_wall
    response_nonempty: true
    timeout_s: 180
    settle_s: 50
- user: Check screen {real_screen}'s state — tell me its layout.
  expect:
    calls_any:
    - vcast_list
    result_contains:
    - panes
    - p1:frame-ok
    timeout_s: 90
    settle_s: 8
- user: Fly into Johannesburg, South Africa — over the city — and narrate it on that
    screen.
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -26.2041
    - 28.0473
    - 60
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - - Johannesburg
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: Now down to Cape Town — Table Mountain area — narrate again.
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -33.9249
    - 18.4241
    - 60
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - - Cape Town
        - Table Mountain
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: One more — fly up the coast to Langebaan lagoon, and narrate.
  expect:
    calls_any:
    - gev_command
    no_unattempted_refusal:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    gev_view_near:
    - -33.0965
    - 18.0299
    - 40
    gev_screen: "{real_screen}"
    call_args_contain:
      vcast_say:
      - - Langebaan
        - lagoon
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: Snapshot screen {real_screen} — I want to see the map with the floating camera window.
  expect:
    calls_any:
    - vcast_snapshot
    timeout_s: 120
    settle_s: 10
- user: Done — clear screen {real_screen} back to idle.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
