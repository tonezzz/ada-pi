# South Africa tour — GEV fullscreen + floating CCTV picture-in-picture
# in the top-right corner (layout mode='pip'). The PiP shows Africam's 24/7 YouTube live safari (embeddable).
# tier: full — actuates a real display.
name: gev_za_pip
tier: full
turns:
  - user: "Hi Ada."
    expect:
      timeout_s: 45
      settle_s: 4

  - user: "First, stop the camera walls bound to screen 4 — the traffic and rama9 zones. I want it fully idle."
    expect:
      calls_any: [cctv_wall, cast_to_screen]
      timeout_s: 120
      settle_s: 10

  - user: "Put God's Eye View on screen 4 fullscreen, with a floating camera view pinned to the top-right corner — picture-in-picture style — play the Africam live safari stream there: https://www.youtube.com/watch?v=ZwxMY_3XZ_A"
    expect:
      calls_any: [cast_to_screen, cctv_wall]
      response_nonempty: true
      timeout_s: 180
      settle_s: 50   # pip layout + slow Cesium cold-load + wall thumbs

  - user: "Check screen 4's state — tell me its layout."
    expect:
      calls_any: [vcast_list]
      result_contains: ['panes']
      timeout_s: 90
      settle_s: 8
      # layout state detail is overwritten by later states (speak-blocked
      # etc.) — the durable signal is panes: 2 on the screen entry

  - user: "Fly into Johannesburg, South Africa — over the city — and narrate it on that screen."
    expect:
      calls_any: [gev_command]
      no_unattempted_refusal: [gev_command]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 16

  - user: "Now down to Cape Town — Table Mountain area — narrate again."
    expect:
      calls_any: [gev_command]
      no_unattempted_refusal: [gev_command]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 16

  - user: "One more — fly up the coast to Langebaan lagoon, and narrate."
    expect:
      calls_any: [gev_command]
      no_unattempted_refusal: [gev_command]
      result_not_contains: ['gev command relay', 'no GEV clients']
      timeout_s: 240
      settle_s: 16

  - user: "Snapshot screen 4 — I want to see the map with the floating camera window."
    expect:
      calls_any: [vcast_snapshot]
      timeout_s: 120
      settle_s: 10

  - user: "Done — clear screen 4 back to idle."
    expect:
      calls_any: [cast_to_screen]
      response_nonempty: true
      timeout_s: 90
      settle_s: 8
