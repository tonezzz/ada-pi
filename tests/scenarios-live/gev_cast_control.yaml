name: gev_cast_control
tier: full
preflight:
  - {check: gev_relay}
  - {check: vcast_online, screens: [9]}

turns:
- user: Cast God's Eye View to screen 9.
  expect:
    calls_any:
    - cast_to_screen
    timeout_s: 120
    settle_s: 15
- user: Fly the map to Bangkok.
  expect:
    calls_any:
    - gev_command
    timeout_s: 90
    settle_s: 15
    no_failed_result:
    - gev_command
