name: gev_th_tour
tier: full
turns:
- user: Hi Ada.
  expect:
    timeout_s: 45
    settle_s: 4
- user: First, stop the camera walls bound to screen {real_screen} — the traffic and rama9 zones.
    I want it fully idle.
  expect:
    calls_any:
    - cctv_wall
    - cast_to_screen
    - vcast_list
    timeout_s: 120
    settle_s: 10
- user: 'On screen {real_screen} — split it: God''s Eye View on the left, the camera wall (rama9
    zone) on the right.'
  expect:
    response_nonempty: true
    timeout_s: 120
    settle_s: 8
- user: Yes — go ahead and set it up.
  expect:
    calls_any:
    - cast_to_screen
    - cctv_wall
    response_nonempty: true
    timeout_s: 150
    settle_s: 30
- user: Fly to Nonthaburi town — and point the camera pane at the nearest live cam
    still; tell the screen what you see.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 240
    settle_s: 16
    no_failed_result:
    - gev_command
- user: 'Now fly over to Pak Kret — same thing: nearest camera picture on the right,
    narrate it on the screen.'
  expect:
    calls_any:
    - gev_command
    - traffic_camera
    - cast_to_screen
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 150
    settle_s: 14
    no_failed_result:
    - gev_command
- user: One more — fly to Bang Bua Thong, refresh the camera pane with the nearest
    cam, and narrate again.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 150
    settle_s: 14
    no_failed_result:
    - gev_command
- user: Ask the map where the camera is right now — read back the actual coordinates.
  expect:
    calls_any:
    - gev_command
    result_not_contains:
    - gev command relay
    - no GEV clients
    response_nonempty: true
    timeout_s: 90
    settle_s: 10
    no_failed_result:
    - gev_command
- user: Take a snapshot of screen {real_screen} — I want to see the final view.
  expect:
    calls_any:
    - vcast_snapshot
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
- user: Tour over — clear screen {real_screen} back to idle.
  expect:
    calls_any:
    - cast_to_screen
    response_nonempty: true
    timeout_s: 90
    settle_s: 8
