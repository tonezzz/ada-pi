name: tv-cast-control
# Live scenario — exercises the tv_action vocabulary against the real TV
# (cast-browser on tony-omen :8799, TONY-TV Cast).
#
# What it verifies:
#   - nav <URL> casts a controllable page
#   - scroll / press verbs reach the cast-browser API and return a REAL
#     result — the old path echoed args through HA rest_command, so a dead
#     click looked identical to success (2026-10-01 'Live Contacts' bug).
#     Results now come back as {'ok': True, 'cast': ...} or an error string.
#   - tony-omen:workspace:N / screenlive:workspace:N desktop casting
#     (side effect: switches the live workspace — run when that's OK)
#
# NOTE: tool_result events stringify nested dicts with repr() (single
# quotes), so result_contains substrings use 'ok': True style.
#
# tier: full — real TV actuation.
tier: full

turns:
  - user: "Put google dot com on the TV."
    expect:
      calls: [tv_action]
      result_contains: ["'ok': True"]
      response_nonempty: true
      timeout_s: 90
      settle_s: 6

  - user: "Scroll down on the TV."
    expect:
      calls: [tv_action]
      # scroll/press return {'cast': 'unchanged'|'cast:N'} — 'unchanged' is
      # correct on google.com (nothing scrollable); the check is that a real
      # cast result came back, not an error.
      result_contains: ["'cast'"]
      response_nonempty: true
      timeout_s: 90
      settle_s: 5

  - user: "Press the escape key on the TV."
    expect:
      calls: [tv_action]
      result_contains: ["'cast'"]
      response_nonempty: true
      timeout_s: 90
      settle_s: 5

  - user: "Now cast my desktop on the TV — workspace one."
    expect:
      calls: [tv_action]
      response_nonempty: true
      # workspace cast can legitimately fail if the stream isn't running —
      # the point is the error surfaces, not that it's claimed as success.
      timeout_s: 120
      settle_s: 8

  - user: "Stop casting my desktop — put the TV back to normal."
    expect:
      calls_any: [tv_action, yt_cast_stop, control_media_player]
      response_nonempty: true
      timeout_s: 120
      settle_s: 6
