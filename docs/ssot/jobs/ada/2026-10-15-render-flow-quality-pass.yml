# SSOT Job: render flow quality pass — iterate-on-last, vision QA,
# multi-ref, aspect notices, delivery fidelity, transient retry
# Card: render-flow-quality-pass (kanban). Dispatch
# 20261015-155419-from-tony-2026-10-14-what-else. Tony's 2026-10-14
# six-item list, all implemented in ada_render_image (+ 'last' alias
# in ada_render_video, 429-vs-quota split in gemini_pool).

title: render flow quality pass — six card items on ada_render_image
subtitle: last-render memory via backend/render_state, cheap vision
  self-check w/ one retry, ref_urls[] multi-ref, page/px notices,
  arch full_url on 2K/4K, transient retry + pool 429-vs-quota split

planning:
  goal: |
    Close Tony's six render-quality gaps: edits iterate on the
    session's last render instead of rerolling, a cheap vision pass
    catches obvious misses once, multi-photo composes take ref_urls[],
    page/pixel asks carry honest-capability notices, big renders attach
    a full-res arch link, and transient gateway failures retry once.
  decisions: |
    - Shared store: backend/render_state.py (new) — tools.d modules
      load by file path so module state isn't shareable; the store
      lives in backend/. Keyed by bound relay chat first (survives ws
      reconnects) then per-call session id; group chats share the chat
      key, the session key disambiguates. resolve_last() prefers the
      on-disk artifact (<=15MB) over refetching the published URL.
    - 'last' is an explicit alias in BOTH tools (video animates the
      last image; video renders are remembered as kind=video so they
      never feed image-kind lookups). Auto-feed (no ref_url passed)
      fires only on the gemini image path: prompt <=400 chars, an
      edit cue (pronoun/comparative/edit-verb, or phrase cue 'the
      text|caption|background|...' unless the prompt opens with an
      indefinite article/'draw|generate|create' — 'a poster with the
      text SALE' is a fresh gen), no fresh cue (new|another|
      different|from scratch|reroll), and a remembered render fresher
      than ADA_RENDER_AUTO_REF_TTL_S (900s; explicit 'last' uses the
      full 7200s TTL).
    - Self-check: one gemini_pool.generate call on
      ADA_RENDER_CHECK_MODEL (gemini-3.5-flash-lite, gateway 'summary'
      class, ~$0.004/turn), single-line PASS|MISS verdict, fail-open
      on any error or unparseable verdict. MISS re-renders once with
      the critique appended; a failed retry keeps the first render and
      says so. Gemini path only (local renders cost ~10min). Result
      carries selfcheck={verdict,retried?,detail?,retry?};
      ADA_RENDER_IMAGE_SELFCHECK=0 disables.
    - Multi-ref: ref_urls[] merges with ref_url, 'last' allowed per
      entry, hard cap 3. Local provider still refuses any refs.
    - Aspect intent: _PAGE_ASK_RE/_PIXEL_ASK_RE attach result.notice —
      never a refusal. Page asks get 'picture OF a page' + offer of
      the real-page path (render hero/section art, assemble with the
      page/CMS tools); px asks get the aspect-vs-pixel mismatch note.
    - Delivery fidelity: size 2K/4K also writes the original bytes to
      LINE_MEDIA_ARCHIVE_DIR/renders and returns full_url — the same
      arch hop ada_render_video uses; LINE re-encodes photo messages.
      Needs OPS-0651's arch route serving to matter.
    - Transient retry: _render_retry wraps _render once on transport/
      gateway/5xx/timeout errors (ADA_RENDER_RETRY_S=2 backoff).
      Quota-shaped errors are excluded — the pool handles those.
    - 429-vs-quota in gemini_pool: _park_until() classifies the error —
      per-day/daily text -> the free-tier reset; 'retry in Ns' ->
      N capped at 900s; rpm/rate-limit/parallel text ->
      ADA_GEMINI_QUOTA_SHORT_TTL_S (120s); ambiguous -> daily reset
      (conservative). A LiteLLM rpm 429 no longer poisons a lane for
      a day. Drained-pool error text now distinguishes the two cases.
    - timeout_s bumped 90->120 (selfcheck + possible re-render add
      seconds on the gemini path).
  owner: tony

