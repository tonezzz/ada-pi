      notes: "tool_runner/memory.py MEMORY_HIT_CONTENT_MAX=2048 +
        _cap_hit_content applied to merged hits in ada_memory_search."
    - id: 4
      label: "regression test"
      status: done
      notes: "tests/test_dead_turn.py — 13 tests: plate-question replay
