  - "python3 - <<'EOF'  # alias routing smoke
    from backend.tool_runner import _resolve_alias
    assert _resolve_alias('cctv_snapshot') == ('ada_camera_snapshot', {'source': 'vms', 'target': 'tv'})
    assert _resolve_alias('traffic_camera') == ('ada_camera_snapshot', {'source': 'traffic'})
    assert _resolve_alias('capture_frame') == ('vcast_snapshot', {})
    EOF"
  - "python3 -m pytest tests/ -q  # 469 pass; 8 env/pre-existing fails"
