# SSOT Job: ada_render_video — Veo predictLongRunning drop-in tool
# Card: veo-video-render (kanban). Dispatch
# 20261008-152538-ada-render-video-prompt-ref-ur. Same 'render' tool
# group as ada_render_image (card nano-banana-image, sibling dispatch
# 20261006-111525 — merges independently; both generalize
# traffic_camera.publish_relay with the same mime=/prefix= signature).

title: ada_render_video — prompt/ref -> Veo predictLongRunning ->
  relay asset URL, playable mp4 clip
subtitle: tools.d drop-in; REST submit + bounded poll + download +
  publish through the shared input-bridge /frame hop

planning:
  goal: |
    ada_render_video(prompt, ref_url?, secs, aspect) renders a short
    clip via Veo's REST predictLongRunning on generativelanguage —
    async op, bounded ~120s poll until done, mp4 download, then the
    same artifact->URL hop ada_render_image uses so the returned
    video_url is a playable clip URL.
  decisions: |
    - Seat: tools.d drop-in (one file + manifest line), same group as
      ada_render_image — no tool_runner/realtime_provider edits, per
      the ada-tool-dev contract.
    - Wire: POST {ADA_GEMINI_API_BASE}/v1beta/models/{model}:
      predictLongRunning {instances:[{prompt, image?}],
      parameters:{aspectRatio, durationSeconds}} -> {name}; poll GET
      /v1beta/{name} until done -> response.generateVideoResponse.
      generatedSamples[0].video.uri; download with x-goog-api-key +
      redirect follow. Plain REST, not the genai SDK — same as the
      image tool.
    - Long-poll shape: bounded wait inside run() (card allows
      "background task or bounded wait ~60-120s"): poll every
      ADA_RENDER_VIDEO_POLL_S (6s) up to ADA_RENDER_VIDEO_WAIT_S
      (120s). On timeout -> ok:false + pending + operation name, and
      an operation= param resumes the same op without re-billing —
      Veo can take 1-6 min, so a hard drop would strand paid renders.
      Manifest timeout_s=220 covers wait+download+publish.
    - Artifact: saved under ADA_RENDER_DIR (render-vid-*.mp4), then
      traffic_camera.publish_relay(data, slug, 'video/mp4', 'render')
      — literally shared code with the image tool's hop.
    - Return shape: video_url (NOT image_url/cast_url/url — the tg/line
      relays auto-fetch those fields and would upload an mp4 as a
      broken photo; relay video delivery isn't implemented yet).
      cast_to_screen(action='play', url=video_url) is the display path.
    - aspect: Veo only does 16:9/9:16 (+ aliases); 'square' errors
      honestly. secs: 4|6|8, default 8.
    - KNOWN GAP (chaba-side, flagged): input-bridge GET /frame sniffs
      only png/wav magic and labels everything else image/jpeg — the
      mp4 clip serves 200 with correct bytes but a wrong content-type.
      <video> elements sniff the container and play it; direct browser
      nav shows broken-image. Proper fix: input-bridge stores the
      declared data-URI mime (or sniffs ftyp) — a stacks/web card, out
      of this worktree's scope.
    - /api/tools unions tools.d names (same fix the sibling needed) so
      scenario needs_tools gating sees drop-ins.
  owner: tony

