title: yt merge — yt(action=cast|status|stop|transcript) absorbs the four yt_* names
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 27 retirees

planning:
  goal: |
    Cut the YouTube group to one canonical tool per the card spec:
    yt(action=cast|status|stop|transcript) absorbs yt_cast,
    yt_cast_status, yt_cast_stop and yt_transcript. Absorbed names stay
    callable but hidden — soft aliases via tool_runner._ALIASES, removed
    from the declared surface (the repo's x-legacy mechanism; no literal
    x-legacy field). DEVIN_CONFIRMED_TOOLS/confirm_strip unchanged —
    gates key off the resolved tool name, not the alias.
  decisions: |
    - Canonical is 'yt', not 'yt_cast': the card's 4->1 collapses to a
      NEW name, so yt_cast itself joins _ALIASES (yt_cast -> yt
      {action: cast}) like the other three retirees.
    - Action-dispatch method: yt() routes per-action onto the unchanged
      absorbed methods (yt_cast/yt_cast_status/yt_cast_stop/
      yt_transcript) — same pattern as calendar_read. query=/url= cross-
      fill each other so a canonical call can pass the video either way.
    - No gate moved: the yt tools were never confirm-gated and are not
      in any *_TOOLS set — the only provider-side seat was
      ACTUATING_TOOLS (yt_cast + yt_cast_stop). Exact parity needs
      per-action counting, so 'yt' did NOT join ACTUATING_TOOLS
      wholesale; a probe counts the call only when action=cast|stop
      (same pattern as ada_camera_snapshot's display-push probe) —
      status/transcript reads stay uncounted.
    - SSOT: new 'yt' family (canonical yt, scenario tool_merge_yt). The
      display family's absorbed list now names 'yt' instead of the three
      yt_* names — those are already aliases, and absorbing them into
      ada_display would create alias chains (lint-fail) until the
      display card re-points them. yt_cast_status left coverage_debt
      (no longer declared).
    - No arg shim needed: yt_cast(query,language) and
      yt_transcript(url,language) map 1:1 onto yts params after the
      implied action= merges; status/stop take none.
  owner: tony

