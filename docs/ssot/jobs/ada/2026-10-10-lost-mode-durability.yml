notes: |
  - The claim is not a distributed lock — it is a heartbeat + post-write
    re-check, which makes double-arm a lost-race that the loser detects
    and abandons. A crashed owner frees the watch for adoption after
    max(3*interval, 300s).
  - During an mddb outage the loop's doc-check fails — after
    _DOC_MISS_LIMIT consecutive misses the watcher exits and its finally
    delete also fails, so the doc survives in the store and the next
    resume (restart or later resume scan) re-adopts it.
  - on_service_start is a generic tools.d convention, not
    track-specific — other drop-in tools can use it for boot-time
    recovery without touching pwa_server again.
  - No commit/push/deploy — worktree only; prod picks it up via the next
    deploy-ada.sh on idc03.
