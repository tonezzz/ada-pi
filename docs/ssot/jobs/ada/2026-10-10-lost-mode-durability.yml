# SSOT Job: lost-mode durability — persist armed watches across restarts
# Card: ada-track-lost-persist. Dispatch
# 20261010-110959-lost-mode-durability-persist-a.

title: ada_track_device — persist lost-mode watches as mddb _watch/<device> docs + resume on service start

context:
  card: |
    Kanban 'ada-track-lost-persist': armed lost-mode watches used to die
    with the backend process (by-design volatile). Persist them to MDDB
    device-telemetry as _watch/<device> docs (armed_at, channel prefs,
    last-pushed sighting); on service start resume watchers whose docs
    exist; 'found'/stale cleanup deletes them.
  prior_state: |
    backend/tools.d/ada_track_device.py armed in-process asyncio watcher
    tasks keyed on runner._track_watches — a restart silently dropped
    every armed watch.

design: |
  _watch/<canon> docs in device-telemetry (same collection the beacon
  uses) hold: device, armed_at, interval_s, channel, until, last_pushed,
  last_sighting, last_fp (delta fingerprint), and a resume claim
  (resumed_at, resumed_by = host:pid:time_ns — unique per resume
  attempt).

  Multi-instance safety: several ada services share one mddb store, so
  resume is claim-based — the live loop re-stamps resumed_at every poll
  (heartbeat); resume_watches skips docs whose claim is fresh
  (< max(3*interval, 300s)); a stale claim means the owner died. The
  resumer writes its claim then re-reads prefer_leader — a different
  resumed_by means it lost the race and it stands down (no duplicate
  pushes).

  Disarm semantics: the loop reads its doc (prefer_leader — follower lag
  could fake a 'deleted') each poll; a miss skips the persist so a
  remote 'found' delete cannot be resurrected; 3 consecutive misses
  (_DOC_MISS_LIMIT) exit the loop. 'found' pops the in-process watch AND
  deletes the doc (all _watch/* docs when no device is given, or the
  input's canon even when the device is out of the fleet pool). Expired
  docs (until <= now) are deleted during resume scans; the loop's
  finally always deletes its own doc (covers until-expiry + task
  cancel).

  Resume entry points: resume_watches() is called by
  on_service_start(runner) — a new tools.d convention wired in
  pwa_server.warm_cache (every tools.d module may define
  async on_service_start(runner); called once at boot with the shared
  runner) — AND lazily once per process at the top of run() guarded by
  runner._track_resumed, so services without a startup hook still pick
  watches up on their first track call.

  Resumed watchers seed last_fp from the doc — no duplicate baseline
  push for an unchanged sighting, but a device that moved during the
  downtime immediately pushes a 'delta'.

changes:
  - file: backend/tools.d/ada_track_device.py
    what: |
      + ~200 lines: _resumer_id/_watch_key/_mddb_write/_persist_watch/
      _drop_watch_doc/_watch_doc/_fp_restore/_claim_fresh helpers;
      resume_watches() + on_service_start() hook; _watch_loop now checks
      its doc per poll, re-stamps resumed_at, persists last_pushed/
      last_sighting/last_fp on each iteration, exits on 3 consecutive
      doc misses or mid-iteration disarm, and always drops the doc in
      finally; _arm_lost persists before spawning; 'found' deletes docs
      (all of them when no device given); 'watches' also lists remote
      (other-process) watchers; _fleet_pool skips '_' prefixed keys so
      _watch/* docs never become fleet devices; run() lazy-resumes once
      per process; docstring/declaration updated.
  - file: pwa_server.py
    what: |
      warm_cache() now runs tools.d on_service_start(runner) hooks —
      any drop-in tool may define `async def on_service_start(runner)`;
      each is called once at boot with the shared ToolRunner, failures
      logged and skipped.
  - file: tests/test_track_device.py
    what: |
      FakeMddb gained add_document/delete_document + prefer_leader;
      watch-loop tests seed the persisted doc (loop only polls while it
      exists); +6 tests: resume re-arms live doc, expired-doc cleanup,
      fresh-claim skip, doc-delete loop exit, _watch/* fleet-pool
      exclusion, persisted-doc assertions in the arm/found lifecycle.

