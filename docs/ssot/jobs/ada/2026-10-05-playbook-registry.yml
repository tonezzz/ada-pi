# SSOT Job: playbook registry — dispatch contract layer for Ada's
# self-development loop.
# Card: ada-devteam-pipeline (chaba kanban). Dispatch 20261005-173154.

title: Playbook registry — devin_dispatch gains gated, templated playbooks
subtitle: >-
  build-tool / fix-scenario / investigate; build-tool refuses without a
  status=pass spec-review doc and steers to ada_devteam_review

planning:
  goal: |
    Close the loop Ada devteam pipeline left open: specs land in the
    devin-handoff bank (kind=spec-review) but nothing stopped Ada from
    dispatching a build with no reviewed spec. backend/playbooks/*.yml is
    the registry; devin_dispatch(playbook=, params=) renders the task,
    enforces the gate, and stamps the job ledger for the watch timer.
  decisions: |
    - Registry is data, not code: backend/playbooks/*.yml loaded +
      validated inside devin_dispatch.py (mirrors tools_loader's
      data-dir convention). Fields: params (with `line:` sub-templates
      for optional sections), task_template, memory_domains,
      gate {confirm, identity}, requires, verify, report_to,
      max_runtime_min. Template placeholders are checked at load —
      {name} must be a declared param, {name}_line auto-renders the
      param's line template (or empty when unset).
    - Gate enforcement lives in dispatch(): identity (owner|identified|
      any) checked against the caller; requires.spec_status does an
      mddb get_document on the devin-handoff bank and refuses unless the
      doc is kind=spec-review with the required status. Fails CLOSED —
      mddb unavailable is a refusal, not a pass. Refusals return
      {ok: false, gate, offer: "ada_devteam_review"} so the model steers
      to the review pipeline instead of dispatching raw.
    - Job stamp = job/<task_id>/contract doc, kind=job-contract — NOT
      meta on job/<id>: devin-dispatch(-watch)'s mddb_job rewrites that
      doc's meta wholesale on every transition, so a stamp there dies at
      exactly the completion moment the verify list is needed. A
      job/-prefixed companion key is skipped by render-handoff-inbox.py
      and (being kind != job) invisible to devin_job_report /
      render-report-feed job rows.
    - confirm gate unchanged: devin_dispatch stays in
      DEVIN_CONFIRMED_TOOLS; the playbook's gate.confirm is declarative
      (documents the requirement). tool_runner confirm internals not
      touched per card rails — only the devin_dispatch method signature
      gained playbook/params, and it passes policy_identity() +
      _persona_admin() through as caller/is_owner.
    - devin_dispatch tool declaration: playbook enum (registry names) +
      params object (union of declared param names); `task` stays
      required and becomes 'Request context' appended to the rendered
      template, so dedup still sees the requester's phrasing.
  owner: tony

