# SSOT Job: memory tool-group merge (8 -> 4)
# Card: tools-merge-memory (chaba kanban). Dispatch 20261004-210440.

title: Memory tool merge — ada_memory_search / ada_remember / ada_session_recall absorb six names
subtitle: First tools-merge-* card landed — the _ALIASES machinery now carries real retirees

planning:
  goal: |
    Cut the memory group to its canonical four:
    ada_memory_search, ada_remember, ada_forget, ada_session_recall.
    Absorbed names stay callable but hidden — soft aliases via
    tool_runner._ALIASES, removed from the declared surface
    (the repo's x-legacy mechanism; no literal x-legacy field exists).
  decisions: |
    - Three canonical targets, not one: the card's mapping is
      scope=/kind= onto existing tools, so the SSOT family is split
      into memory_search / memory_remember / memory_recall rather than
      a single 'ada_memory' canonical (spec table updated to match).
    - Alias resolution runs BEFORE gates, so confirm/secondary gates
      always key off the canonical name (DEVIN_CONFIRMED_TOOLS and
      confirm_strip untouched).
    - Gate carve-outs preserve pre-merge access exactly:
      ada_remember kind in {vocab, guest, habit} skips the
      MEMORY_WRITE_TOOLS bank gate + secondary block + Jev probe +
      budget remember_block (the absorbed vocab_note / guest_* /
      report_habit_observation were never gated);
      ada_memory_search scope=guest skips the secondary block
      (guest_recall read a public store);
      ada_session_recall scope=history skips the provider secondary
      block and the redundant-recall gate (ada_ha_recall had neither).
    - kind='habit' is provider-dispatched telemetry (ProviderEvent
      'habit_observation' to visual_habits), not a store write — a
      direct runner call returns a descriptive error.
    - Chaba guest mode re-declares ada_remember/ada_memory_search with
      guest-scoped schemas (kind='guest' / scope='guest' fixed) — the
      main bank-facing declarations are swapped out so no name is
      declared twice.
    - ada_memory_search defaults: bank='all' + no scope searches
      banks+sessions(+guest on chaba); an explicit bank name implies
      scope='banks' so pre-merge single-bank callers keep their result
      shape.
  owner: tony

