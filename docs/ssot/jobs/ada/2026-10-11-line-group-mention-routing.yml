# SSOT Job: LINE group mention-routing — one chaba bot, per-persona
# backends. Card: line-multihome-group. Dispatch
# 20261011-163937-line-group-tony-kk-nhong-per-s (attempt 2).

title: >
  Shared LINE group (tony+kk+nhong) routes addressed turns to each
  member's home persona; unaddressed chatter is ignored

subtitle: >
  The chaba bot (@339sbrov) sits in one shared group. A member names a
  persona (ada|kaewta|chaba) and the relay opens a per-(group, sender,
  persona) WS session to that backend, replies tagged [persona->sender].

planning:
  goal: |
    Implement Tony's updated spec (2026-10-11): mention-triggered
    routing, no default-to-Ada flood, per-sender identity via
    LINE_USER_CALLERS, voice notes following the tg voice rule + a
    mirror to the speaker's home (DM) channel.
  decisions: |
    - LINE_NAME_BACKENDS "name:ws-url,..." is the persona registry the
      relay parses; 'ada' falls back to ADA_WS_URL, a bare host:port gets
      /ws appended, and an empty URL ('chaba:') marks a known-but-offline
      persona that answers "isn't home yet" rather than being ignored.
    - Mention parse: first configured persona name at a word boundary
      (case-insensitive, optional '@'); a leading 'name,' / '@name:' is
      stripped as addressing noise. Unaddressed room text -> ignore
      unless LINE_DEFAULT_PERSONA is set.
    - Rooms have no admin fallback — an unmapped member's routed message
      earns a 1/h refusal echoing their userId (same rule tg_relay
      applies to group senders). Rooms must be in
      LINE_ALLOWED_GROUP_IDS; the bot's join greeting prints the groupId
      for allowlisting.
    - Reply tag [persona->sender]: sender label = LINE group profile
      displayName (cached) -> caller name minus 'user-' -> userId tail.
    - Voice: audio messages save to LINE_VOICE_CORPUS_DIR (manifest
      JSONL, per-sender slug — same as tg), ack in-channel; with
      LINE_VOICE_TRANSCRIBE=1 the transcript routes like text. Group
      clips also push the ack/transcript to the speaker's DM
      (LINE_VOICE_DM_MIRROR, default on).
    - Latent bugs fixed along the way: _mark_read was being passed the
      replyToken as a chat userId (always 400s) — now posts the event's
      markAsReadToken per current LINE docs; LINE_PUBLIC_IMG_BASE repo
      default updated idc01 -> idc03 edge (157.85.102.125.sslip.io).

verification: |
  tests/test_line_relay_group.py — 21 tests: backend map parse + /ws
  normalization, mention variants/boundaries/first-wins, lead strip,
  route defaults + unknown-default ignore, group route+tag, unaddressed
  ignore, unallowed group ignore, unmapped refusal rate-limit, offline
  persona, DM default, unauthorized DM, join greeting + replyToken,
  room-source /room/ profile endpoint, markAsReadToken, voice save/ack/
  mirror, unmapped-clip drop, transcript routing. All pass.
  Full suite via unittest discovery (no pytest in this venv): 1276 run,
  only pre-existing env-dep errors (pytest/ai_edge_litert/hailo absent —
  identical on the clean tree). tool-lint clean.

hardening (dispatch 20261011-170000, attempt 3): |
  - _route now validates the resolved default persona against
    LINE_NAME_BACKENDS — a LINE_DEFAULT_PERSONA naming no configured
    persona resolves to ignore (logged), where before it KeyError'd
    _name_backends()[name] and killed the handle_event task. Group
    images route through _route too so the same guard applies.
  - _sender_label picks the member-profile endpoint by event source
    type — 'room' sources use /v2/bot/room/{id}/member/{uid} (they
    404'd on /group/ and always fell back to the caller name).
  - join greeting now sends via the event's replyToken (free reply,
    not a push message).
  - get_event_loop -> get_running_loop in the voice transcribe path.

hardening-2 (dispatch 20261013-182818, attempt 4): |
  - Room persona pin is now member-only: handle_event no longer hands
    _room_pin to _route for unmapped senders, so a stranger's mention
    can't pin the room (it would reroute every member's unaddressed
    follow-ups — a noise-rule bypass) and unmapped chatter can't ride
    someone else's pin into a refusal. Mapped members pin/switch as
    before; the pin itself was previously untested — now covered.
  - auth.import_key(name, key, apps, ha_person, person) added — the
    missing half of "mint member key on each reachable persona
    backend". create_key mints a fresh random value per call while the
    relay resolves ONE string from its ADA_KEYS_FILE and presents it to
    every LINE_NAME_BACKENDS backend; enrolment must therefore reuse
    the same value. import_key enrols it live with the target
    backend's own ha_person/apps (per-backend tier), refusing a taken
    name or a value already registered under another name.
  - Docs corrected: msg-lane-multihome-routing.md previously implied
    minting per backend via create_key (which would NOT work — each
    backend would hold a different string). It now documents the
    one-key-value model + the create_key -> import_key runbook.

