# SSOT Job: get_home_state plug summary discovers plug-family switches
# Card: ada-get-home-state-plug-omission (chaba kanban).
# Dispatch 20261014-215517 — repro of ada-kk 2026-10-13 23:19:37.

title: get_home_state all_plugs omitted switch.plakkaaaef_local — plug
  summary was configured-list-only
subtitle: snapshot() now unions HOME_ASSISTANT_HOME_PLUGS with the
  switch.(plug|plak|usb_test_hub) family found in live states

planning:
  goal: |
    Repro (live ada-kk): get_home_state returned
    all_plugs={switch.plug_tv} while a same-session home_search listed
    switch.plakkaaaef_local available+off beside switch.plug_tv. The
    summary must include plug-family entities even when the env list
    predates them.
  root_cause: |
    NOT a name filter, NOT availability, NOT domain scoping inside the
    tool — it is configured-entity whitelisting one layer down.
    get_home_state's all_plugs/plugs_on are built from
    snapshot.plug_states/plug_names, and HomeAssistantClient.snapshot()
    populated them strictly from self.home_plug_entities — the
    HOME_ASSISTANT_HOME_PLUGS env list (fallback DEFAULT_HOME_PLUGS,
    the five office lights). On ada-kk that env holds only
    'switch.plug_tv', so plakkaaaef_local never entered the dict.
    home_search lists it because entities()/search_entities() scan all
    /api/states under DISCOVERABLE_DOMAINS — different selection path,
    which is why the two tools disagreed.
  decisions: |
    - Fix at snapshot() in backend/home_assistant.py, not in the tool:
      both get_home_state paths (tool_runner/ha.py and the
      realtime_provider fast-path at ~L5297) and OfficeLightMonitor all
      consume the same snapshot, so widening there fixes every consumer.
    - Discovery reuses the existing plug-family convention —
      switch.(plug|plak|usb_test_hub) — hoisted into
      home_assistant.HOME_PLUG_ENTITY_RE; tool_runner/common.py's safety
      classifier now imports it instead of carrying its own copy, so
      "what counts as a mains plug" stays single-source.
    - plugs_on derives from the widened plug_states, so a discovered
      plug that is ON appears in plugs_on — the summary never
      contradicts itself.
    - OfficeLightMonitor keeps its configured-list semantics: it now
      filters snapshot.plugs_on against ha_client.home_plug_entities so
      a TV plug left on can't read as "office lights left on".
  owner: tony

processing:
  status: done
  started_at: "2026-10-14"
  steps:
    - id: 1
      label: "snapshot plug discovery"
      status: done
      notes: "HOME_PLUG_ENTITY_RE added next to DEFAULT_HOME_PLUGS;
        snapshot() builds plug_entity_ids = configured list + discovered
        matches from live states; plug_states/plug_names/plugs_on all
        cover the union."
    - id: 2
      label: "single-source the plug regex"
      status: done
      notes: "tool_runner/common.py imports HOME_PLUG_ENTITY_RE and
        drops its inline re.match copy in _classify_and_sync."
    - id: 3
      label: "office-lights scope pin"
      status: done
      notes: "office_lights.evaluate() narrows plugs_on to the
        configured list before habit evaluation; FakeHomeAssistant-based
        tests unaffected (empty watched set = keep all)."
    - id: 4
      label: "unit test"
      status: done
      notes: "test_home_assistant.py
        ::test_snapshot_discovers_plug_family_beyond_configured_list —
        env HOME_ASSISTANT_HOME_PLUGS='switch.plug_tv', states carry
        switch.plakkaaaef_local (off) + switch.plug_fan (on) +
        non-plug switch; asserts plak* survives all_plugs/plug_names,
        non-plugs stay out, an on discovered plug lands in plugs_on."

invoke:
  commands:
    - "python3 -m pytest tests/test_home_assistant.py tests/test_office_lights.py -x -q"
    - "python3 -m pytest tests/ -x -q"
    - "python3 scripts/tool-lint.py"

