# SSOT Job: secret-drop — chat-card modal + /api/secret-drop + hygiene standard
# Card: ada-secret-drop (chaba kanban). Dispatch
# 20261009-151754-part-a-secret-drop-ui-ada-chat (attempt 2 — attempt 1
# left no branch or detail, rebuilt from scratch).

title: secret-drop UI + endpoint — drop secrets onto fleet hosts, receipt is path+sha8 only

context:
  card: |
    Part A: ada-chat-card gains a .acc-secret button + modal (target
    host dropdown idc03/tony-dell/tony-omen/idc02, name validated
    [a-z0-9._-]+, value type=password autocomplete=off no echo);
    submit posts POST /api/secret-drop; UI shows only the receipt
    (path + sha256 first8), never the value. Backend writes
    ~/.config/secrets/<name> with 0600. Auth: existing ada-chat key
    auth, only paired keys, ~5/hour rate limit. Compliance: after a
    drop the value must be absent from transcript + ops-events +
    journal. Part B: secrets hygiene standard — transport rule,
    grep-canary detection, rotate-then-scrub incident rule,
    metadata-only rotation inventory.
  prior_state: |
    No ada-chat-card.js existed anywhere in the repo — created new per
    the ada-*-card component standard (pwa/cards/, vanilla shadow-DOM,
    api-base attr), mounted at pwa/chat.html. Secrets moved ad-hoc
    (direct edits, occasionally comms) with no audit receipt.
  answers: |
    Card comms: drop-scope=fanout ("v1 includes ssh fan-out to
    dell/omen/idc02"), auth-surface=any-paired. The dispatch brief said
    ssh out-of-scope — the explicit fanout answer was honored: non-local
    hosts deliver over ssh (BatchMode, value on stdin, never argv),
    local host writes directly. Flag for review if scope should clamp.

decisions:
  - no_logging_of_value: |
      The value never touches a durable text surface: receipt carries
      {host,name,path,sha8,via}; logger.info + event_log.log_event carry
      caller/host/name/sha8/via only. ssh delivers via stdin (argv is
      ps-visible). tests/test_secret_drop.py asserts a sentinel value is
      absent from captured log records, the events file, live session
      transcripts, and the response body.
  - auth_surface: |
      caller_name() + key_can(name,"chat") — env/operator keys and
      issued chat keys pass; pending/revoked keys never resolve; view-
      only keys (cms-viewer) get 403. Anonymous allowed only when auth
      is unconfigured (same posture as _require_api_key).
  - rate_limit: |
      Sliding window, 5 drops/hour per caller name (429). The hit is
      counted before delivery so a dead host can't be hammered through
      retries.
  - name_safety: |
      name validated ^[a-z0-9._-]{1,64}$ server-side AND client-side;
      ^ada-ha-.+-keys\.json$ is reserved — the auth key store lives in
      the same secrets dir and overwriting it locks everyone out.
  - host_resolution: |
      host==local hostname (or ADA_HOST_ALIAS / localhost) -> local
      write; else ssh fan-out. Existing-file mode is normalized to 0600
      on every write (O_CREAT mode only applies on create).

deliverables:
  - file: pwa/cards/ada-chat-card.js + pwa/chat.html
    what: New <ada-chat-card> — text chat over /ws (guest.js protocol)
      + .acc-secret button + modal. Value cleared from DOM on submit
      and on modal close; receipt shows path + sha8 only.
  - file: pwa_server.py
    what: POST /api/secret-drop — {host,name,value} ->
      {ok,host,name,path,sha8,via}. Local write 0600 or ssh fan-out;
      per-caller 5/h sliding-window limit; metadata-only audit.
  - file: tests/test_secret_drop.py
    what: 15 cases — auth gates, validation, local write + mode
      normalization, rate limit, ssh argv-isolation, and the compliance
      test (sentinel absent from logs/events/transcripts/response).
  - file: docs/kb/ada-secrets-hygiene.md
    what: Part B standard — transport rule, canary detection,
      rotate-then-scrub incident rule, rotation inventory.
  - file: scripts/secret-canary.py
    what: grep-canary over transcripts/events/focus-inbox (+configurable
      roots); reports file:line+pattern+sha8 fingerprint (never the
      match); findings file an incident card via board-api, exit 2.
  - file: scripts/secret-inventory.py
    what: Per-host ~/.config/secrets listing — name/mode/size/mtime/
      sha8, no values; flags !mode and !sha-mismatch across hosts.

verification:
  - .venv/bin/python -m pytest tests/test_secret_drop.py -> 15/15 OK
    (venv built in-worktree with CI dep set — torch/speechbrain excluded
    like .github/workflows/ci.yml)
  - scripts/secret-inventory.py --json ran live on tony-dell — metadata
    only, no values in output
  - scripts/secret-canary.py smoke-tested on synthetic root — detected
    sk-/xoxb patterns, printed fingerprints only, incident-card post
    degrades cleanly when board unreachable
  - pwa/cards/ada-chat-card.js passes node --check

notes:
  - Deploy via ~/.local/bin/deploy-ada.sh on idc03 (per AGENTS.md) —
    NOT deployed from this worktree. idc03 needs ADA_HOST_ALIAS=idc03 in
    the service env only if its uname differs from 'idc03'.
  - On production the local write path targets idc03; dell/omen/idc02
    drops ride ssh from the service account — requires outbound
    BatchMode ssh to already exist (same pattern as cms
    host-services-cms generator).
  - The ops-event for each drop goes to ~/.local/share/ada/events.md
    (ADA_EVENTS_FILE), so secret-canary will see 'secret-drop' lines —
    they carry sha8 fingerprints, not values, by design.
