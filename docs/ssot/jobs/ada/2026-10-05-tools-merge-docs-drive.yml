# SSOT Job: docs+drive tool-group merge (8 -> 2)
# Card: tools-merge-docs-drive (chaba kanban). Dispatch 20261005-180155.

title: Docs+drive merge — docs / drive absorb eight names
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 31 retirees

planning:
  goal: |
    Cut the docs+drive group to its canonical two per the card spec:
    docs(action=search|get|print|archive) absorbs ada_doc_search,
    ada_doc_get, ada_doc_print, ada_doc_archive; drive(action=
    search|show|get|update) absorbs drive_search, drive_show, drive_get,
    drive_update. Absorbed names stay callable but hidden — soft aliases
    via tool_runner._ALIASES, removed from the declared surface (the
    repo's x-legacy mechanism; no literal x-legacy field).
  decisions: |
    - Arg maps are 1:1 — every absorbed tool's parameters already match
      the canonical schema, so _alias_call_args needs no new branches;
      only _ALIAS_ARG_DEFAULTS carries the implied action=.
    - Gate keys off the resolved name: docs takes both the DOC_TOOLS and
      DOC_CONFIRMED_TOOLS seats; drive takes DRIVE_TOOLS +
      DRIVE_CONFIRMED_TOOLS. Per-action splits live inside
      _check_doc_confirmed (search/get free — the absorbed readers were
      never gated) and the new _check_drive_confirmed (search/get/show
      free — only drive_update was ever gated). Unknown actions fall
      through to confirmation on both, matching the cms_edit precedent.
    - _check_drive_confirmed adds an ADA_READ_ONLY denial the bare
      drive_update gate never had — the kill-switch should cover a Drive
      rewrite; noted as a deliberate tightening, not a merge requirement.
    - _CHANGE_LOG_TOOLS: ada_doc_archive -> docs with an action=='archive'
      filter in _log_change_request — only the archive action is a change
      worth logging, not the reads (drive_update was never logged).
    - ACTUATING_TOOLS (provider): ada_doc_archive/ada_doc_print removed;
      the per-turn actuation budget keys docs off action in
      {archive, print} at the call site, same pattern as the
      ada_camera_snapshot display-push probe. drive stays out — none of
      the absorbed drive names were actuation-counted.
    - _CONFIRM_GATED_TOOLS picks up 'docs' via DOC_CONFIRMED_TOOLS, so
      the Jev advisory probe now fires on every docs call (incl. reads);
      DEVIN_CONFIRMED_TOOLS / confirm_strip unchanged per the card.
    - scenario-live LEGACY_TOOL_ALIASES: added the 8 new rows AND the 8
      calendar+plan rows that tools-merge-calendar-plan missed — the
      comment says keep in sync with _ALIASES and absorbed names in
      scenario expectations (calls_any/no_calls_except) must expand to
      the canonical or they go silently stale.
    - benchmark.yml write_tools: ada_doc_archive/ada_doc_print -> docs.
      Name-level policy can't split actions, so doc_recall,
      chaba_memory_review and tool_merge_docs_drive join
      write_allowed_in (they legitimately call docs reads; the write
      path inside docs is what the seat guards).
    - doc_upload.yaml events_not_contain: tool_call events carry the
      resolved name, so {name: ada_doc_archive} could never match — now
      {name: docs}; stricter (any docs call on the declined-upload turn
      fails) but the absorbed-name form was already vacuous.
  owner: tony

