# SSOT Job: display tool-group merge (8 -> 2 canonical seats)
# Card: tools-merge-display (chaba kanban). Dispatch 20261005-175553.

title: Display merge — cast_to_screen absorbs vcast_say/list/status/shortcut; vcast_snapshot keeps its seat
subtitle: Fifth tools-merge-* card — _ALIASES now carries 27 retirees

planning:
  goal: |
    Cut the display group to the card's canonical seats:
    cast_to_screen keeps its name and absorbs vcast_say, vcast_list,
    vcast_status and vcast_shortcut as action=say|list|status|shortcut
    (plus a content-routed action='cast'); vcast_snapshot stays declared
    as its own tool — the verify-after-act loop needs a separate name —
    and absorbs the retired GEV remote command capture_frame;
    vcast_gesture is a distinct subsystem and is unchanged. Absorbed
    names stay callable but hidden: soft aliases via
    tool_runner._ALIASES, removed from the declared surface.
  decisions: |
    - The card spec overrides the older local spec (which sketched a
      future 'ada_display' canonical absorbing yt_cast too): the card's
      self-contained shape is authoritative — cast_to_screen is the
      canonical, yt_cast*/vcast_gesture untouched.
    - vcast_status/vcast_shortcut were census journal names (2 and 1
      calls in 7d) with no committed implementation in this repo or any
      idc01 deploy snapshot — they alias into new action= seats anyway
      so a stale/hallucinated call lands somewhere sane instead of
      KeyError'ing.
    - Gate carve-outs: action=list|status|say skip the secondary-speaker
      block and the CONTROL_TOOLS gate (cast_ungated) — vcast_list was
      an ungated read and vcast_say was never gated or
      secondary-blocked; the merged seats keep exactly that access.
      Screen-ownership ACL still runs inside the method (vcast_say
      self-checks; casts call _check_screen_owner). 'shortcut' and
      'cast' are content-changing casts — they keep the full
      control-gate + busy-screen interrupt contract.
    - action='cast' probes the URL with _frame_check and routes by
      content-type: image/* -> image, audio/* -> audio,
      video/*/mpegurl/YouTube/Vimeo/video-ext -> play, else nav. It runs
      the busy-screen check pre-routing and reports action_routed in the
      result. Existing play->image auto-reroute and dead-URL rejection
      are unchanged.
    - Actuation budget: vcast_say leaves ACTUATING_TOOLS (canonical
      holds the seat) but action=list|status carve out of the per-turn
      actuation count — absorbed reads must not eat actuation budget.
    - scenario-live.py: LEGACY_TOOL_ALIASES gained the display rows AND
      the calendar+plan rows the earlier card missed; _expand_families
      now alias-expands @family members too (@verify carries vcast_list);
      call_args_contain matches a canonical-side call only when it
      carries the implied seat args (vcast_say -> action='say'), via a
      new LEGACY_ARG_DEFAULTS mirror.
    - benchmark.yml write_allowed_in: +tool_merge_display, +vcast_list —
      absorbed read/narrate calls now record as cast_to_screen (a
      write_tools member), which would flag policy violations on the
      smoke/casting suites.
    - DEVIN_CONFIRMED_TOOLS and confirm_strip untouched; confirm gating
      keys off the resolved canonical name.
  owner: tony

