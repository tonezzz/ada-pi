# SSOT Job: meta/voice tool-group merge (8 -> 3)
# Card: tools-merge-meta-voice (chaba kanban). Dispatch 20261005-182958.

title: Meta/voice tool merge — ada_persona + ada_ops + ada_enroll_speaker absorb seven names
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 30 retirees

planning:
  goal: |
    Cut the meta/voice group to its canonical three per the card spec:
    ada_persona absorbs ada_set_voice (action=set_voice|show_voice|
    list_voices); NEW ada_ops absorbs ada_outcome / ada_usage_summary /
    ada_mddb_health / ada_decision_check / ada_deep_research
    (action=outcome|usage|health|check|research); ada_enroll_speaker
    absorbs guest_register (who=speaker|guest).
    Absorbed names stay callable but hidden — soft aliases via
    tool_runner._ALIASES + _ALIAS_ARG_DEFAULTS, removed from the
    declared surface (the repo's x-legacy mechanism).
  decisions: |
    - ada_ops(action=check|research) is a thin shell: decision-check and
      deep-research are provider-side background ops (results injected
      into the live session), so the canonical runner method only owns
      outcome/usage/health; provider dispatch maps the actions onto
      _start_decision_check / _start_deep_research exactly where the
      old names dispatched.
    - ada_mddb_health was a tools.d drop-in, not a builtin — its module
      is deleted, its manifest entry removed, and its run() body ported
      verbatim into runner._ops_mddb_health. tools.d count drops to 2.
    - Voice stays provider-side: set_voice needs the idle-gated
      reconnect in _set_voice, so ada_persona voice actions dispatch
      there on live sessions; the runner method handles show/list only
      (runner can't reconnect a socket it doesn't own).
    - ada_set_voice action shim: the legacy tool reused action=
      set|show|list — _alias_call_args rewrites them to set_voice /
      show_voice / list_voices so the caller's action can't collide
      with ada_persona's persona set.
    - Gates key off the resolved name: ada_ops joins
      MEMORY_WRITE_TOOLS and _CONFIRM_GATED_TOOLS but BOTH carve out
      per-action — only action=outcome invokes the memory-bank write
      gate / confirmation (usage|health|check|research keep their
      old ungated read/background semantics). Bank allowed_tools are
      normalized through _ALIASES so legacy 'ada_outcome' entries
      still authorize canonical ada_ops.
    - Confirm parity for guest_register: ada_enroll_speaker is
      confirm-gated, so who='guest' is carved out of the probe —
      guest_register was never gated. who='guest' also returns before
      the secondary-speaker enrollment check (unchanged behavior).
    - Secondary parity: provider secondary-block elif now covers
      ada_persona voice actions + ada_ops action=check (the old
      ada_set_voice / ada_decision_check entries); runner
      SECONDARY_BLOCKED keeps only persona set/reset, matching the
      pre-merge runner-side surface.
    - DEVIN_CONFIRMED_TOOLS and confirm_strip unchanged — both already
      operate on the resolved canonical name.
    - benchmark.yml write_tools: ada_outcome -> ada_ops, ada_set_voice
      -> ada_persona; tool_merge_meta_voice scenario joins
      write_allowed_in (it exercises the alias paths).
  owner: tony

