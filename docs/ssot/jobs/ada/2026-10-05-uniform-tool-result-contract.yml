    - id: 3
      label: "scenario honesty checks"
      status: done
      notes: "scenario_engine.check_expect no_error now fails on
        error-field OR ok:false, and tool exceptions land as canonical
        {ok: False, error, error_type}; scenario-live no_failed_result
        checks only the named tool's top-level ok."
    - id: 4
      label: "tests + docs"
      status: done
      notes: "~30 assertion sites migrated from assertRaises/raw-shape
