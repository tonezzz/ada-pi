# SSOT Job: ada_render_video — Veo spend metering into the local usage
# ledger + LiteLLM passthrough readiness
# Card: ada-render-video-bypasses-litellm-no-per-ede157 (kanban).
# Dispatch 20261014-220118-ada-render-video-calls-generat.

title: ada_render_video — meter Veo spend locally (secs*rate at submit)
subtitle: option (b) from the card — flat-cost rows in usage.jsonl;
  option (a) verified upstream and made a 2-env flip away

planning:
  goal: |
    ada_render_video calls generativelanguage.googleapis.com directly
    (predictLongRunning + operation polling on the lane's AI Studio
    key), so Veo spend never reaches the LiteLLM spend ledger — unlike
    ada_render_image, which rides the 'image' class through the gateway
    (ADA_GEMINI_REST_BASE_URL). Video is owner-only today
    (ADA_RENDER_VIDEO_OPEN on ada-ha-tony) but the ledger hole is real.
  options_reviewed: |
    (a) Route through a LiteLLM 'video' path — VERIFIED UPSTREAM, not
        deployable from this worktree: LiteLLM's /gemini passthrough
        officially supports Veo predictLongRunning + GET
        /v1beta/{operation} polling + file download (docs.litellm.ai/
        proxy/veo_video_generation, PR BerriAI/litellm#14228), and the
        native /v1/videos API meters duration-based cost with virtual
        keys. Gaps: the proxy config lives outside this repo (idc03),
        passthrough cost attribution for LRO calls needs a live check
        on the deployed proxy version, and Veo's clip download URI
        comes back Google-hosted — the caller must rewrite it onto the
        proxy (now implemented).
    (b) Meter in-tool — IMPLEMENTED: the card's 'local
        spend-ledger.jsonl' is realized as flat-cost rows in the one
        existing local ledger (usage_ledger -> ADA_USAGE_LOG,
        data/usage.jsonl), extended to carry est_cost_usd + detail.
        That puts video spend inside est_cost_usd on ada_usage_summary
        / ada_ops action=usage — the surface Tony already asks — with
        zero new files to consume.
    (c) Document-only — rejected; (b) was cheap and the rate table is
        one small dict.
  decisions: |
    - usage_tracker.record() gains est_cost_usd (flat USD, stored as
      'cost' in the jsonl) + detail (audit-only dict — snapshot() never
      aggregates it). Buckets sum cost_usd; reports add flat_cost_usd
      and fold it into est_cost_usd. Backwards compatible: rows
      without 'cost' read as 0; token_usage scenario asserts unchanged.
    - _meter_submit() runs once per accepted predictLongRunning — the
      render is billed on accept; the resume path (operation=) meters
      nothing. Never raises: a ledger outage must not break a paid
      render (logged warning).
    - Rate table _RATE_PER_SEC keyed by model-id prefix with res tiers
      (ai.google.dev pricing, Oct 2026): veo-3.1-fast $0.10/s@720p
      $0.12/s@1080p, veo-3.1-lite $0.05/$0.08, veo-3.1 $0.40. Unknown
      models use ADA_RENDER_VIDEO_RATE_USD (default 0.10). Card's
      '~$0.15/s ~$1.20/8s' was stale — current fast rate is
      ~$0.80/8s@720p.
    - Gateway readiness (option a, zero-code later): _download rewrites
      the Google-hosted clip URI onto ADA_GEMINI_API_BASE when it is
      non-default, and ADA_RENDER_VIDEO_API_KEY overrides the key —
      so ADA_GEMINI_API_BASE=<proxy>/gemini + a virtual key routes the
      whole flow through the passthrough. Local metering still logs the
      same estimate either way (local ledger vs proxy ledger are
      separate stores; no double-count in one ledger).
    - est_cost_usd rides the result payload on submit and pending, so
      Ada can quote the cost; tool_guide notes it.
  owner: tony

