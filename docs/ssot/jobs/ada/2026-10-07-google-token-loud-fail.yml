title: Google token loud fail — calendar/tasks reads surface auth failure, not empty lists
subtitle: Distinguish "genuinely empty" from "unreachable/unauthenticated" at the provider boundary

planning:
  goal: |
    The idc03 Google refresh token was revoked (invalid_grant on the
    token endpoint). Every calendar_read / tasks / plan_day call kept
    returning ok:true with empty events/tasks lists — the per-provider
    exception was buried in the 'errors' side-channel — so Ada told
    Tony "nothing scheduled" while the whole backend was dead. Card:
    surface auth failure as ok:false / a top-level error Ada is
    instructed to relay, and keep genuinely-empty distinguishable.
  decisions: |
    - CalendarService._raise_untrustworthy() is the single rule applied
      after every aggregating read (list_calendars, list_events,
      freebusy, list_task_lists, list_tasks): any CalendarAuthError
      raises immediately (a dead token is an ops condition — a partial
      answer built around it lies by omission); an empty result with
      ANY provider failure raises too ("unreachable" is not "nothing
      scheduled"); partial failures that still produced items stay
      graceful and ride in the result's 'errors' list.
    - Raised exceptions become {ok: false, error, error_type} at the
      runner boundary (uniform-tool-result contract) — error_type
      'CalendarAuthError' vs 'CalendarError' distinguishes
      unauthenticated from unreachable.
    - plan_day propagates through its gather of list_events+list_tasks;
      shift_overdue raises when nothing moved AND nothing was even
      examined (errors + empty moved+skipped = blind write pass).
    - _session_context_tail no longer drops a failed agenda prefetch
      silently: the injected blob now says the agenda is unavailable
      and why, so Ada can't read it as "no events today".
    - CALENDAR_INSTRUCTIONS + tool_guide.yml (calendar_read/plan_day/
      tasks) now state the contract: ok:false/error means unreachable
      or unauthenticated — relay it; a non-empty 'errors' list means
      partial.
    - Other Google-backed tools (drive/photos/docs via
      doc_archive_client) already raise into ok:false — no change.
  owner: tony

