# SSOT Job: cms_read discovery + reports-index flood + memory-search pollution
# Card: ada-cms-discovery-fixes (chaba kanban). Dispatch
# 20261008-060641-ada-pi-cms-read-discovery-repo. liam-e2e fallout,
# session ece770ccb0.

title: CMS discovery — search action, newest-first list, index dedupe/cap, devin-dump demotion
subtitle: Ada could not find the Liam dub though all infra was green — three ada-pi-side fixes

planning:
  goal: |
    yt-dub-liam-e2e live pass 2026-10-07 (transcript ece770ccb0): Ada
    could not find the Liam dub. Diagnosis (chaba
    docs/ssot/jobs/yt-dub/2026-10-07-yt-dub-liam-e2e-pass1-diagnosis.yml)
    found three ada-pi-side gaps: (1) cms_read action=list returns an
    unordered arbitrary subset — 373 docs, a limit=10 call showed cam-*
    pages only and the model wrongly concluded the page did not exist;
    (2) _cms_reports_index lacked the chaba cms_index.py index_rows()
    fixes (per-domain cap + en/th dedupe) — the index rendered 59/60 cam
    rows and pushed cached-videos-report off entirely; (3)
    ada_memory_search bank='all' hits were all devin/* session dumps —
    synced transcripts match any topical query by sheer size.
  decisions: |
    - MDDB /v1/search has no ordering — fix at the tool: cms_read now
      fetches a bounded window (CMS_FETCH_WINDOW=600, env
      ADA_CMS_FETCH_WINDOW) and orders/filters locally. action='list'
      returns pages sorted by meta.updated desc so limit=N is the N
      NEWEST pages, not an arbitrary N. Backward compatible — the result
      is still a bare list.
    - New action='search' (query=, falls back to key/slug for
      model-misrouted args): token match over slug/title/summary/domain
      across every live page; returns {query, count, total_pages,
      pages[{...,match}]} — total_pages tells the model the search is
      exhaustive, killing the 'page does not exist' misread.
    - _cms_reports_index refactored onto module-level cms_index_rows()
      — the port of chaba's index_rows(): en/th variants dedupe to one
      row per slug (en supplies title/summary, freshest variant wins
      updated), dead-status pages drop, and CMS_INDEX_DOMAIN_CAP=10
      (env ADA_CMS_INDEX_DOMAIN_CAP) bounds each domain; hidden rows are
      reported in a '_Not shown: +N <domain>' footer pointing at
      action='search'. Fetch window raised 200 -> CMS_FETCH_WINDOW.
    - memory_ops.memory_search bank='all': hits whose key starts with a
      bulk-archive prefix (ADA_MEMORY_DEMOTE_PREFIXES, default 'devin/')
      sort below real hits regardless of score and are tagged
      archive:true. Explicit bank='devin'/'reports' searches are
      unfiltered — dispatch forensics stays reachable, it just can't
      crowd out memory.
    - Provider surface: cms_read schema gains 'search' in the action
      enum + a query= param; descriptions steer 'does a page exist'
      toward search; CMS_INSTRUCTIONS, tool_guide.yml and the
      ada_memory_search bank= description document the new shapes.
  owner: tony

