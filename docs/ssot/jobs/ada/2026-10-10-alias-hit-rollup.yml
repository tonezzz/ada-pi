title: Alias-hit rollup — emitted-name census that makes the 92-name compat
  layer removable
subtitle: The data existed in call-logs; nothing aggregated it, and the
  session report's tool_call.tool held the resolved canonical — not the
  emitted name the card assumed

planning:
  goal: |
    Every merged tool name stays callable via tool_runner._ALIASES (92
    rows at writing). Deprecation needs evidence: per-emitted-name call
    counts over a window, so an alias at 0 hits for 14d can retire.
    The card brief claimed conversation.log_event already records the
    emitted name — it does not: the provider resolves the alias BEFORE
    dispatch (call = call.model_copy(update={"name": _rname})), so
    tool_call.tool is canonical. The emitted name survives in two
    places: the call-logs JSONL `function_call` event (written
    pre-resolution, journald-immune by design) and the journal `tool
    alias <old> -> <new>` line.
  decisions: |
    - New scripts/ada/alias_hit_report.py (stdlib-only, same pattern as
      tool-usage-report.py / cms_regen.py). Sources: call-logs
      `function_call` names (primary, per-day), session-report
      tool_call events for sessions with NO call-log (emitted=, else
      canonical fallback), and the service journal's `tool alias` /
      `tool <name> args=` lines for the ws/HTTP execute() path which
      writes no call-log.
    - realtime_provider.py: log_event("tool_call") gains emitted=<as-
      called name> so session reports carry the emitted name going
      forward — the card's premise becomes true.
    - Eligibility is conservative: quiet_days = today - last_hit across
      transcript AND journal, and never-hit aliases only count the
      observed data span — a 5d-old call-log dir cannot declare an
      alias dead at 14d.
    - Removal path documented on the page: delete the _ALIASES row AND
      the family's `absorbed` entry together (lint fails on either
      half: absorbed-without-alias AND stray-alias are both errors).
    - Publish = CMS page report/alias-hits in ada-cms-pages
      (kind=report -> reports-index; report-meta contract enforced
      pre-publish) + machine JSON at <data>/runs/alias-hits/<date>.json
      — the same dict feeds ada-dead-surface-metric (dead_surface =
      declared names unused on every path).
    - Weekly ada-alias-report.timer (Mon 06:40), inert repo files —
      install on idc03 like ada-tool-usage.timer.
  owner: tony

