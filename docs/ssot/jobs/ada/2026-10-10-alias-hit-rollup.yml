# SSOT Job: alias-hit rollup — deprecation path for the _ALIASES compat layer
# Card: ada-alias-telemetry (chaba kanban). Dispatch
# 20261010-080626-alias-hit-rollup-deprecation-p, attempt 2 (attempt 1
# left no comms trail — card shows no failure detail; this run rebuilt
