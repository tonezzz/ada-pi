# SSOT Job: tasks+status tool-group merge (10 -> 3)
# Card: tools-merge-tasks-status (chaba kanban). Dispatch 20261005-183350.

title: Tasks+status merge — tasks / home_status / chat_send absorb sixteen names
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 39 retirees

planning:
  goal: |
    Cut the tasks+status group to its canonical three per the card spec:
    tasks (action=add|list|done|move) absorbs the four tasks_* names,
    home_status (what=battery|power|inverter|pool|dashboard|habit)
    absorbs the seven status getters, and chat_send absorbs the photos
    picker pair plus the three chaba-side doc-upload card names
    (sys_show_uploaded_document / process_document_upload /
    doc_upload_card_action — never declared in this repo, registered as
    forward aliases). Absorbed names stay callable but hidden via
    tool_runner._ALIASES (the repo's x-legacy mechanism; no literal
    x-legacy field), removed from the declared surface.
  decisions: |
    - Canonical name is home_status, not 'status': the card's
      "NEW home_status" wording follows the calendar card's "NEW X"
      convention (cal(...) shorthand became calendar_read/write).
    - tasks holds the CALENDAR_WRITE_TOOLS seat: unlike calendar_write
      it has a free read action, so _check_calendar_write_allowed gained
      a per-action early return — action='list' (absorbed tasks_list)
      was never confirm-gated or READ_ONLY-blocked; add/done/move keep
      confirmed=true. ACTUATING_TOOLS seat likewise moved to the
      canonical name (a stray list call draws the shared budget — same
      name-keyed convention as the other merged actuators).
    - chat_send joined DRIVE_TOOLS with per-flow carve-outs: photo=/
      doc= calls keep the owner-tier documents-bank + secondary-speaker
      gates the absorbed photos_* names had; a plain text/image send
      was never bank-scoped or secondary-blocked, so the gate keys off
      args, not just the resolved name.
    - Doc-upload forward aliases: ada-pi has no process_document_upload
      pipeline — uploads enter via POST /api/documents/intake and are
      held in RAM by document_check.engine(). chat_send doc='show'/
      'process' resolve a held intake key (default: newest, via the new
      engine.latest()) and post/return the summary; 'card' takes
      op='archive' which re-dispatches ada_doc_archive through
      execute() so the DOC confirm gate still applies (the denial
      carries the bound confirm_token; replay on ada_doc_archive
      directly). op='print' on a held doc declines honestly — printing
      needs an archived slug.
    - _alias_call_args moves the doc card's own action= to op= and
      intake_key to key= (the implied doc= slot is the sub-action).
      get_battery_detail keeps battery_index=1 default under
      what='battery' so bare and indexed reads both work.
    - Provider-path gap found + fixed: the provider resolves call.name
      to canonical before runner.execute, so _alias_call_args keyed on
      the as-called name never ran there — surrogate remaps (slug->key,
      end->day, action->op) were silently skipped for live-routed stale
      calls. The provider now applies _alias_call_args on the merged
      args at resolve time; covered by
      test_doc_card_alias_remaps_args_before_dispatch.
    - Provider dispatch: the seven inline HA-client branches collapsed
      into one home_status branch keyed on what=; what='habit' still
      reads habit_state_getter. FunctionResponse echoes the as-called
      name (alias included) — unchanged.
    - Group sets: CALENDAR_TOOLS/HABIT_TOOLS/DRIVE_TOOLS/CHABA_ALLOW
      carry canonical names (home_status takes get_habit_status's
      habit-exclusion seat — excluding habit tools now also drops the
      other status reads; noted in the comment, no live config uses
      ADA_EXCLUDED_TOOLS for it). DRIVE_INSTRUCTIONS steer 'show my
      photos' to chat_send photo='pick'. benchmark.yml unchanged —
      tasks/chat_send are mixed-use (list/plain send are free) so
      name-based write_tools would false-positive; server-side
      confirm gates cover the writes.
    - LEGACY_TOOL_ALIASES in scenario-live.py resynced with the full
      _ALIASES table, including the eight calendar-plan rows that card
      missed.
  owner: tony

