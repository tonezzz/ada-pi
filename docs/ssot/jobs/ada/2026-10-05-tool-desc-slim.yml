    53 pre-existing warnings"
  - "gev_command spot-check: description 47 source lines -> 3
    (3,622 -> 196 chars); parameters_json_schema byte-identical to
    HEAD (AST-verified for all 37 decls)"
  - "tests.test_tool_audit: 21/21 — incl. 2 new descsize fixture tests"
  - "tests.test_tool_runner: 155/155 — incl. gates, aliases, denial
    breaker (usage text observed appended to raised errors)"
  - "tests.test_scenarios: 7/7 — offline ToolRunner scenarios route
    canonical + aliased tools (ada_outcome/ada_usage_summary/
