# SSOT Job: ha tool-group merge (21 -> 6)
# Card: tools-merge-ha (chaba kanban). Dispatch 20261005-173343.

title: HA merge — home_search / get_home_state / home_history / control_entity / ha_confidence absorb nineteen names
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 42 retirees

planning:
  goal: |
    Cut the Home Assistant group to its canonical six per the card spec:
    home_search (kind=device|sensor|event), get_home_state extended with
    entity_id=/domain= (domain='memory' is the stored-snapshot seat),
    home_history (kind=logbook|events|timeline|series|snapshots),
    control_entity with domain dispatch on entity_id (on=/action=/
    source=), ha_confidence (read with no args, write with entity_id+
    status/safety), and tv_action kept separate — its cmd/text/selector/
    role/key/dx/dy/factor surface doesn't fold into action=. Absorbed
    names stay callable but hidden — soft aliases via
    tool_runner._ALIASES, removed from the declared surface.
  decisions: |
    - Five canonicals, not one 'ada_ha': the card superseded the
      2026-10-04 spec's single-canonical design. The split keeps the
      gate boundary on a tool-name boundary (control_entity is the only
      actuation seat) and keeps each read family's kind= enum small
      enough for Gemini Live to validate.
    - home_search kind='event' routes to the memory event search
      (recorder + persisted MDDB batches); the provider fast-path only
      serves kind=device|sensor — kind='event' falls through to the
      runner, and CHABA/no-memory mode fails closed with 'recorded event
      memory not available'.
    - get_home_state keeps its name: entity_id= reads one entity live,
      domain= lists a domain, domain='memory' is the alias-internal seat
      for the absorbed ada_ha_get_state (returns memory.overview(),
      preserving its contract exactly).
    - home_history kind resolution: explicit kind wins; else entity_id
      -> series for sensor.* / timeline for other domains, domain=
      'memory'|'snapshots' -> snapshots, query -> events, bare -> logbook.
      The provider kept the sensor-series fast-path
      (home_history + sensor.* entity -> ha_client.history).
    - control_entity dispatches on the entity domain: cover.* -> cover
      verbs, button.*/input_button.* or action='press' -> press,
      media_player.* -> the media verbs (with source=), everything else
      -> set_power via on=/action=on|off. CONTROL_TOOLS keeps one seat;
      the resolved canonical name is what every gate sees.
    - ha_confidence is read-without-args / write-with-status: the
      secondary-speaker block covers the resolved name with a read
      carve-out (absorbed ada_ha_get_device_confidence was never
      blocked); _CHANGE_LOG_TOOLS logs writes only.
    - DEVIN_CONFIRMED_TOOLS and the provider's confirm_strip logic are
      byte-for-byte unchanged — gates key off the resolved name.
    - ada_ha_search_devices/sensors searched the memory snapshot while
      search_home_devices/search_sensors searched HA live — both lanes
      converge on kind=device|sensor (same {entity_id,name,state,
      available} shape); live search is the shape-compatible superset.
    - benchmark.yml write_tools already listed control_entity — no
      change needed; tool_merge_ha scenario is read-only so no
      write_allowed_in entry.
  owner: tony

