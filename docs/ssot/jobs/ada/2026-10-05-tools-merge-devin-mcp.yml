# SSOT Job: devin tool-group merge (8 -> 2)
# Card: tools-merge-devin-mcp (chaba kanban). Dispatch 20261005-143702.

title: Devin merge — devin / devin_read absorb eight names
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 31 retirees

planning:
  goal: |
    Cut the devin group to its canonical two per the card spec:
    devin (action=dispatch|followup|answer — session writes,
    confirm-gated) and devin_read (action=status|jobs|pending|report|
    review — ledger reads, the report composer, and the absorbed
    ada_devteam_review spec pipeline). Absorbed names stay callable but
    hidden — soft aliases via tool_runner._ALIASES, removed from the
    declared surface (the repo's x-legacy mechanism; no literal
    x-legacy field).
  decisions: |
    - Two canonical devin tools, not one: the card's 8->2 split maps
      the three session writers onto `devin` and the four ledger
      readers + ada_devteam_review onto `devin_read`, so the
      DEVIN_CONFIRMED_TOOLS boundary stays a clean tool-name boundary —
      every `devin` action mutates a dispatched session, so the whole
      tool keeps the confirm-gate seat (same convention as
      calendar_write).
    - 'review' action: the card listed read actions
      status|jobs|pending|report for devin_read but also assigned
      ada_devteam_review to it — 'review' is the fifth enum value and
      the devteam pipeline's honest verb (it runs an LLM panel and
      writes a spec doc; none of the four read actions describe it).
    - ada_devteam_review was a tools.d drop-in (manifest owner_only,
      secondary_allowed=false, timeout_s=300). The manifest entry is
      gone; the logic moved verbatim onto ToolRunner.ada_devteam_review
      with the owner gate re-implemented inline (secondary turn OR
      missing person_policies full:true -> PermissionError) and the
      300s cap kept via asyncio.wait_for in the devin_read branch.
      devin_read itself stays ungated/unblocked like the four absorbed
      readers.
    - Gate keys off the resolved name: `devin` replaces the three
      absorbed names in DEVIN_CONFIRMED_TOOLS, so confirm_strip /
      token binding / secondary-speaker rules all cover it unchanged.
      devin_job_report's internal publish re-check now fingerprints
      under 'devin_read'.
    - Arg shims: none needed — every absorbed name's args already map
      1:1 onto the canonical params; _ALIAS_ARG_DEFAULTS supplies only
      the action=.
    - benchmark.yml write_tools: devin_dispatch -> devin (the name the
      model emits now). devin_read stays out — its report publish path
      was never in write_tools.
  owner: tony

