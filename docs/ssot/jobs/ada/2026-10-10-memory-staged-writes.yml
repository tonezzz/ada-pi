notes: |
  Approver surface = card comms + CLI (no new UI): staging posts an
  events.md line (surfaced by the existing ada-review digest) and, when
  ADA_MEMORY_REVIEW_CARD is set, a board comment naming the pending id.
  Out of scope by design: ada_forget (deletes are reversible via mddb
  history and already confirmation-gated) and ada_ops outcome (telemetry).
