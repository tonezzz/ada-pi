title: Cast suite — multi-device / restart-window / flap-e2e gap scenarios
subtitle: New vcast_display driver primitive runs the real claim/flap/release lifecycle on the live input-bridge

planning:
  goal: |
    Keep the named seven cast scenarios green and add the three gap
    scenarios the vcast program was missing: multi-device simultaneous
    cast, cast during the restart window, and flap detection end-to-end.
  decisions: |
    - "cast during HA restart" is exercised as the ada-ha SERVICE restart
      window — the reconnect turn drops and re-establishes the session ws
      (the same failure shape a service bounce produces) and asserts the
      cast survives on relay ground truth. Bouncing real Home Assistant
      mid-test is neither safe nor needed: HA state is not what a restart
      breaks — the lost ws session is.
    - Flap e2e needed a driver-side display: scenario-live.py only drives
      Ada's ws, so a new `vcast_display` turn primitive claims a REAL
      screen on the live input-bridge (pending → claim → paired →
      registered — the genuine flow, tailnet-trusted + ADA_ADMIN_KEY) and
      can flap/drop/reattach its ws. This exercises the relay's supersede
      + lastCast-replay invariants that vcast-flap-check.mjs guards on a
      spawned relay — here against the live relay with Ada in the loop.
      The claimed screen number is exposed as the {flap_screen} token.
    - or_state gained list form (every entry must hold for the waiver)
      and a contains_any variant — needed for multi-target assertions.
      Driver-side `pub` action gives a deterministic deferred-cast check
      (relay remembers a nav pubbed while the display is down and replays
      it on reattach).
    - cast_interrupt_gate T3 was a stale expectation: an explicit wall
      ask is not confirm-gated (2026-09-29 contract), so when Ada starts
      the wall at T2 the T3 "yes" has nothing to execute. The turn now
      carries or_state {screen 4 contains 'rama9'} — pass iff the wall is
      actually up after the confirm, on either path.

