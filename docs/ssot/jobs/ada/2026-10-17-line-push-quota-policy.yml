notes: |
  - No regression to reply path: replyToken deliveries unchanged; the
    parked-ride flush is the same OPS-0651 code, bulk just feeds the
    same queue earlier.
  - Parking is durable (jsonl on disk) — relay restart mid-depletion
    loses nothing; boot probe re-arms the block from LINE's own
    consumption counter.
  - Decision input for Tony: at ~35 push calls/day the free 300/mo cap
    is structurally too small. Cheapest fix is marking nag/watch/digest
    senders bulk (they ride free replies). Upgrading the plan is a
    billing call, out of scope here.
  - relay-img transient-miss spam: by-design transient keys, noted only.
