title: Calendar+plan merge — calendar_read / calendar_write / plan_day absorb eight names
subtitle: Fourth tools-merge-* card landed — _ALIASES now carries 23 retirees

planning:
  goal: |
    Cut the calendar+plan group to its canonical three per the card spec:
    calendar_read (events|calendars|freebusy), calendar_write
    (create|delete|shift — write-gated), and plan_day extended with
    period=today|tomorrow|week absorbing ada_daily_summary +
    ada_weekly_comparison. Absorbed names stay callable but hidden —
    soft aliases via tool_runner._ALIASES, removed from the declared
    surface (the repo's x-legacy mechanism; no literal x-legacy field).
  decisions: |
    - Two canonical calendar tools, not one 'cal': the card's
      "cal(action=...)" maps onto calendar_read / calendar_write so the
      write gate boundary stays a clean tool-name boundary — every
      calendar_write action mutates, so the whole tool keeps the
      CALENDAR_WRITE_TOOLS seat and per-action gate special-casing is
      unnecessary. ssot.tool-surface.yml got calendar_read /
      calendar_write / plan_day sub-families (memory-merge precedent).
    - Alias-internal period 'digest': ada_daily_summary's alias stamps
      period='digest' so /api/tools/call consumers keep the bare-digest
      contract; period='today'|'tomorrow' return the merged
      events+tasks view with the day's session digest folded in under
      'digest'. plan_day works without a configured calendar — digest
      alone is the day view, tagged calendar='not configured'.
    - Arg shim: ada_weekly_comparison's 'end' isn't a plan_day param —
      _alias_call_args maps end->day (the window end) and keeps days/.
      refresh. The three calendar writers' args pass through verbatim
      (title/start/end/notes/location/calendar, event_id, to).
    - Gate keys off the resolved name: calendar_write replaces the
      three absorbed names in CALENDAR_WRITE_TOOLS, so _CONFIRM_GATED_
      TOOLS / confirm_strip / secondary-speaker rules all cover it
      unchanged. DEVIN_CONFIRMED_TOOLS untouched.
    - CALENDAR_INSTRUCTIONS rewritten for canonical names and the old
      SUMMARY_INSTRUCTIONS folded in (daily/weekly digest phrasing now
      lives under plan_day); SUMMARY_TOOLS set removed.
    - benchmark.yml write_tools: the three absorbed writers ->
      calendar_write; tool_merge_calendar_plan joins write_allowed_in.
  owner: tony

