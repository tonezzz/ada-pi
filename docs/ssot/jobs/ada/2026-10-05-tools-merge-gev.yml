# SSOT Job: gev tool-group merge (2 -> 1)
# Card: tools-merge-gev (chaba kanban). Dispatch 20261005-180945.

title: GEV merge — gev_command absorbs gev_tour via its tour= param
subtitle: Fifth tools-merge-* card landed — _ALIASES now carries 24 retirees

planning:
  goal: |
    Cut the gev group to its canonical one per the card spec:
    gev_command absorbs gev_tour -> gev(command|tour=...). The absorbed
    name stays callable but hidden — a soft alias via
    tool_runner._ALIASES, removed from the declared surface (the repo's
    x-legacy mechanism; no literal x-legacy field).
  decisions: |
    - Canonical keeps the name gev_command, not a new 'gev': the card's
      "gev(command|tour=...)" describes the merged call shape — one tool
      taking either command params (name+args+screen+pane+wait) or
      tour=<id|alias>. Renaming would churn every scenario/prompt that
      already says 'gev_command fly_to_location'.
    - No action= param: gev_command's 'name' already IS the action
      selector (the GEV tool name). tour= is an orthogonal mode switch —
      when set, name/args are ignored and the tour registry answers.
    - No _ALIAS_ARG_DEFAULTS or _alias_call_args shim: the absorbed tool's
      only param is 'tour', identical on the canonical — the alias row
      alone routes old calls.
    - Bare call = discovery mode: gev_command() with no name and no tour
      lists tours — same contract the standalone gev_tour() had.
    - Gates unchanged: gev_command already held the CONTROL_TOOLS seat;
      gev_tour was never gated. Aliased tour calls now count against the
      control rate limit and ADA_READ_ONLY — the gate keys off the
      resolved name per the card rule. DEVIN_CONFIRMED_TOOLS and the
      provider-side confirm_strip path are untouched.
    - scenario-live.py LEGACY_TOOL_ALIASES gained gev_tour AND the eight
      calendar+plan rows — that mirror landed after the calendar merge
      and was never backfilled; scenarios asserting legacy names only
      widen (accept canonical OR legacy), never narrow.
  owner: tony

