verification:
  - "pytest TvGevLaneTests — 10 tests: gev key/URL/relative-path rewrite,
    env override, plain URL untouched, verify off/idle fail, wake-after-
    first-poll, inconclusive pass, non-cast skip"
  - "offline scenario tv_cast_gev_live — rewrite + verification replayed"
  - "omen: `systemctl --user status gev-workspace cast-stream-http`,
