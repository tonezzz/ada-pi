notes:
  - "The lane switches tony-omen's physical workspace to 4 and leaves it
    there — designed behavior of the tony-omen:workspace target (the
    stream IS the physical display)."
  - "gev_workspace choice is config-driven: cast-screens.json 'gev'
    block or ADA_GEV_TV_TARGET; default tony-omen:workspace:4."
  - "screens.json 'tv-desk' source (shared virtual display) is the
    future home for GEV-to-TV so non-owners can cast it too — needs an
    Xvfb seat + a cast-browser nav handler; out of scope here."
  - "Follow-up if wanted: cast-browser could get a real 'gev' handler
    (provision window + stream + play_stream atomically) — cleaner UX,
    but the file is hand-managed on omen (not in a repo)."
