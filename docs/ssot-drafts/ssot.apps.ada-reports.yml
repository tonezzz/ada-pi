title: Ada Report Hierarchy
subtitle: "L0 events → L1 session/run reports → L2 daily rollups → L3 weekly rollups — linked by stable refs so every level digs to raw data"
icon: 📊
sections:
  - title: Layers
    icon: "🧱"
    layout: list
    items:
      - label: L0 raw facts
        text: "Append-only evidence: transcript files, session_items events, run-event lists. Never rewritten; everything above is derived and regeneratable."
      - label: L1 session/run report
        text: "Per-session report JSON (reports/<date>-<sid>.json) plus run records (runs/*.json) from benchmarks, scenarios, and dispatch tasks — one common envelope {ref, kind, ts, owner, metrics, events, escalations, summary}."
      - label: L2 daily rollup
        text: "runs/daily/<date>.json — aggregates the day's sessions and runs, computes latency stats and escalation deltas vs baseline. Generated by scripts/report-rollup.py."
      - label: L3 weekly rollup
        text: "Same schema over the week's L2 files. Rollups are derived views — re-running regenerates them from lower levels."
  - title: Reference Scheme
    icon: "🔗"
    layout: list
    items:
      - label: Refs not copies
        text: "Every layer links down by stable string refs — report:<date>-<sid>, transcript:<date>-<sid>#t<n>, report:<date>-<sid>#ev<n>, run:<kind>/<date>-<id>, mddb://<collection>/<key>, file:<abs-path>. Upper levels store distillation + refs, never copied raw content."
      - label: Runtime refs are plain strings
        text: "Report refs are NOT dynamic SSOT refs — MDDB docs, report JSON, and session-memory.md are read by plain YAML/JSON consumers with no !ssot_ref resolver. Dynamic SSOT (${ssot(...)}, __ref__, !ssot_ref) applies only to spec/config files read by mcp_query_ssot/mcp_ssot_get or render tooling."
      - label: Ref versioning
        text: "Hyrum's law — once consumers exist the format is a contract. The scheme above is v1; changes need a ref_version field or a v2: prefix."
  - title: Escalation
    icon: "📣"
    layout: list
    items:
      - label: What reaches the top
        text: "Decided by rules, not volume. Session events in {tool_denied, secondary_speaker, speaker_unrecognized, barge_noise, reconnect} escalate; run records propagate their own computed escalations (failures, accuracy drops) verbatim with refs intact."
      - label: Baselines
        text: "Audited baselines (tests/baselines.yaml, seeded from ssot.values) define regressions: e.g. p95 ttft > baseline×1.25, denial count unexpectedly below baseline (security regression)."
      - label: Action proposals
        text: "Escalations materialize as action-proposal docs with status pending→approved→implemented→verified→closed; a later green run closes the loop."
  - title: Storage
    icon: "🗄️"
    layout: list
    items:
      - label: Reports bank
        text: "MDDB collection ada-ha-reports-{instance} (bank name 'reports', scope instance). System writes only — write_policy: direct, allowed_tools: [] — reads via ada_memory_search and the mddb MCP server (the Devin↔Ada recall bridge)."
      - label: Keys
        text: "rollup/daily/<date>, rollup/weekly/<week>, report/<date>-<sid>, run/<kind>/<date>-<id>, devin/session-summary/<stem>, devin/report/<date>-<tag>."
      - label: Meta fields
        text: "kind, level (session|daily|weekly), date, session_id, owner, ref, parent, source — declared in the banks schema so validate_meta stays quiet and recall can filter."
  - title: Retention
    icon: "🧹"
    layout: list
    items:
      - label: Raw
        text: "Transcripts and L0 events: keep_days 90 (tune in ssot.values paths.reports_dir)."
      - label: Reports
        text: "L1 keep_days 365; L2/L3 rollups keep forever — they are the compressed long-term memory."
      - label: Privacy
        text: "Per-person report visibility follows person_policies — KK's session reports are not searchable from Tony-scoped banks and vice versa."
  - title: Runtime Wiring
    icon: "⚙️"
    layout: list
    items:
      - label: Rendered config
        text: "Rendered into ~/.config/ada/memory-banks.json alongside banks: {reports: {keep_days: {...}}, session_security: {secondary_blocked: [...]}}. tool_runner reads the rendered block list; absent config fails closed to the built-in default."
      - label: Producers
        text: "conversation_memory (L0 items + L1 fold), realtime_provider (turn_latency/tool_call timing events), scripts/report-rollup.py (L2/L3), scripts/identify_eval.py + recall-bench.py + scenario-live --json-out (run records), scripts/devin-memory-bridge.py (Devin artifacts → MDDB)."
