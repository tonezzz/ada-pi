<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Chaba — Guest</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #02090f; color: #c9fbff; font: 15px/1.45 system-ui, sans-serif; }
      #ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr auto; padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom); gap: 8px; }
      #banner { text-align: center; color: #ffd97a; font-size: 12px; padding: 4px 8px; border: 1px solid #4a3a08; border-radius: 8px; background: rgba(60,45,5,.4); }
      #identity { text-align: center; color: #75bdc5; font-size: 13px; min-height: 18px; }
      #log { overflow-y: auto; padding: 10px; border-radius: 10px; background: rgba(0,12,19,.85); display: flex; flex-direction: column; gap: 6px; }
      .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg .who { display: block; font-size: 11px; opacity: .65; margin-bottom: 2px; }
      .msg.mine { align-self: flex-end; background: rgba(8,126,242,.22); border: 1px solid rgba(8,126,242,.5); }
      .msg.ada { align-self: flex-start; background: rgba(13,74,99,.55); border: 1px solid #0d4a63; }
      .msg.system { align-self: center; background: none; color: #ff9a8a; font-size: 12px; padding: 2px; }
      .msg.streaming { opacity: .75; }
      #input-row { display: flex; gap: 8px; }
      #chat-input { flex: 1; min-height: 44px; padding: 10px 14px; border: 1px solid #087ef2; border-radius: 9px; background: rgba(5,35,48,.9); color: #c9fbff; font: 15px system-ui, sans-serif; }
      .btn { min-height: 44px; padding: 10px 16px; border: 1px solid #087ef2; border-radius: 9px; color: #aef8ff; background: rgba(5,35,48,.9); font: 600 15px system-ui, sans-serif; cursor: pointer; }
      .btn:disabled { opacity: .4; }
      #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,8,12,.94); z-index: 200; }
      #overlay[hidden] { display: none; }
      #overlay-card { width: min(360px, 90vw); padding: 28px 24px; border: 1px solid #0d4a63; border-radius: 14px; background: #04141c; text-align: center; }
      #overlay-card h1 { margin: 0 0 6px; color: #aef8ff; font: 700 26px system-ui, sans-serif; }
      #overlay-hint { margin: 0 0 16px; color: #75bdc5; font: 14px/1.5 system-ui, sans-serif; }
      #name-input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #087ef2; border-radius: 9px; background: rgba(5,35,48,.9); color: #c9fbff; font: 16px system-ui, sans-serif; }
      #name-error { min-height: 20px; margin: 8px 0; color: #ff9a8a; font: 13px system-ui, sans-serif; }
      #name-submit { width: 100%; }
      #key-input { margin-top: 10px; }
      #voice-btn.recording { border-color: #f2a008; color: #ffd97a; }
      #toolbar { display: flex; gap: 8px; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <main id="ui" aria-label="Chaba guest chat">
      <div id="banner">Memories saved here are visible to everyone in this household.</div>
      <div id="toolbar">
        <button id="voice-btn" class="btn" hidden title="Record a voice clip for registration">🎙 Voice</button>
        <button id="connect" class="btn">Connect</button>
      </div>
      <div id="identity">Guest</div>
      <div id="log"></div>
      <div id="input-row">
        <input id="chat-input" type="text" placeholder="Say hello…" autocomplete="off" disabled>
        <button id="chat-send" class="btn" disabled>Send</button>
      </div>
    </main>
    <div id="overlay">
      <div id="overlay-card">
        <h1>Welcome</h1>
        <p id="overlay-hint">
          You're talking to Chaba, the house assistant. Tell us your first
          name so we can remember you — anything you save is
          <b>visible to everyone in this household</b>.
        </p>
        <input id="name-input" type="text" placeholder="Your name" autocomplete="off" maxlength="30">
        <div id="name-error"></div>
        <button id="name-submit" class="btn">Continue</button>
        <input id="key-input" type="password" placeholder="Access key (if asked)" style="display:none">
      </div>
    </div>
    <script src="guest.js" defer></script>
  </body>
</html>
