<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <title>Chaba CMS</title>
  <link rel="stylesheet" href="tailwind.min.css">
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/echarts-5.5.1.min.js"></script>
  <script src="vendor/echarts-gl-2.1.0.min.js"></script>
  <script src="vendor/mermaid-11.4.1.min.js"></script>
  <style>
    .cms-chart { width: 100%; height: 320px; }
    .cms-media { max-width: 100%; border-radius: .5rem; margin: .6rem 0; }
    .cms-figure { margin: .8rem 0; }
    .cms-figure figcaption { font-size: .8rem; color: #94a3b8; margin-top: .3rem; }
  </style>
  <style>
    /* tailwind .flex utility outranks [hidden] (same specificity, later in
       source order) — the unlock overlay would render permanently without
       this id-scoped override. */
    #unlock-overlay[hidden] { display: none; }
    .prose-ada h1 { font-size: 1.6rem; font-weight: 700; color: #fff; margin: 1rem 0 .5rem; }
    .prose-ada h2 { font-size: 1.3rem; font-weight: 600; color: #fff; margin: 1rem 0 .5rem; }
    .prose-ada h3 { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; margin: .75rem 0 .4rem; }
    .prose-ada p  { margin: .5rem 0; color: #cbd5e1; }
    .prose-ada ul, .prose-ada ol { margin: .5rem 0 .5rem 1.4rem; color: #cbd5e1; }
    .prose-ada ul { list-style: disc; } .prose-ada ol { list-style: decimal; }
    .prose-ada code { background: #0f172a; padding: .1em .35em; border-radius: .3rem; font-size: .85em; }
    .prose-ada pre { background: #0f172a; padding: .75rem; border-radius: .5rem; overflow-x: auto; margin: .6rem 0; }
    .prose-ada pre code { background: none; padding: 0; }
    .prose-ada a { color: #38bdf8; } .prose-ada a:hover { text-decoration: underline; }
    .prose-ada table { border-collapse: collapse; margin: .6rem 0; }
    .prose-ada th, .prose-ada td { border: 1px solid #334155; padding: .35rem .7rem; font-size: .9rem; }
    .prose-ada blockquote { border-left: 3px solid #0a84ff; padding-left: .8rem; color: #94a3b8; margin: .6rem 0; }
  </style>
</head>
<body class="bg-bg text-slate-100 min-h-screen">
  <nav class="bg-card border-b border-slate-700 px-4 py-3 flex items-center gap-3">
    <a href="../" class="text-sky-400 hover:text-sky-300">&larr; Ada</a>
    <span class="text-slate-500">|</span>
    <span class="font-semibold">Chaba CMS</span>
    <div class="ml-auto flex items-center gap-1">
      <button id="lang-en" class="text-xs px-2 py-1 rounded">EN</button>
      <button id="lang-th" class="text-xs px-2 py-1 rounded">ไทย</button>
    </div>
    <button id="btn-edit" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600" hidden>Edit</button>
    <button id="btn-refresh" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">Refresh</button>
  </nav>

  <div id="edit-drawer" class="fixed inset-x-0 bottom-0 bg-card border-t border-slate-700 p-4 hidden" style="max-height:70vh;overflow:auto">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center gap-2 mb-2">
        <h2 class="text-sm font-semibold">Edit <span id="edit-slug" class="text-slate-400"></span></h2>
        <select id="edit-section" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs ml-auto">
          <option value="">whole page</option>
        </select>
        <button id="edit-close" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">Close</button>
      </div>
      <input id="edit-target" placeholder="target slug (split/merge only)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs mb-2 hidden">
      <input id="edit-instr" placeholder="instruction for improve/expand/consolidate (optional)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs mb-2">
      <textarea id="edit-text" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm font-mono" placeholder="markdown — required for add/update"></textarea>
      <div class="flex flex-wrap gap-2 mt-2">
        <button data-op="add" class="edit-op px-3 py-1 rounded bg-sky-700 hover:bg-sky-600 text-xs">Add</button>
        <button data-op="update" class="edit-op px-3 py-1 rounded bg-sky-700 hover:bg-sky-600 text-xs">Update</button>
        <button data-op="improve" class="edit-op px-3 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-xs">Improve</button>
        <button data-op="expand" class="edit-op px-3 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-xs">Expand</button>
        <button data-op="consolidate" class="edit-op px-3 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-xs">Consolidate</button>
        <button data-op="split" class="edit-op px-3 py-1 rounded bg-amber-700 hover:bg-amber-600 text-xs">Split →</button>
        <button data-op="merge" class="edit-op px-3 py-1 rounded bg-amber-700 hover:bg-amber-600 text-xs">Merge ←</button>
        <span id="edit-status" class="text-xs text-slate-400 self-center ml-2"></span>
      </div>
    </div>
  </div>

  <div class="max-w-6xl mx-auto p-4 md:flex md:gap-6">
    <aside class="md:w-64 shrink-0 mb-6 md:mb-0">
      <div class="flex items-center gap-2 mb-2">
        <h2 class="text-xs uppercase tracking-wide text-slate-500">Chaba CMS</h2>
        <button id="btn-toggle-list" class="md:hidden ml-auto text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">Pages ▾</button>
      </div>
      <input id="page-filter" type="search" placeholder="Filter pages…"
             class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm mb-2">
      <div id="page-tabs" class="flex gap-1 mb-2 text-xs">
        <button data-tab="pages" class="tab-btn flex-1 px-2 py-1 rounded">Pages</button>
        <button data-tab="cctv" class="tab-btn flex-1 px-2 py-1 rounded">CCTV</button>
      </div>
      <div id="page-list" class="space-y-1 text-sm hidden md:block"></div>
    </aside>
    <main class="flex-1 min-w-0">
      <div id="content" class="text-slate-400">Loading…</div>
    </main>
  </div>

  <div id="unlock-overlay" class="fixed inset-0 bg-black/70 flex items-center justify-center" hidden>
    <div class="bg-card border border-slate-700 rounded-xl p-6 w-80">
      <h2 class="font-semibold mb-1">Unlock Pages</h2>
      <p id="unlock-hint" class="text-sm text-slate-400 mb-3">Enter an Ada API key.</p>
      <input id="unlock-key" type="password" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mb-2" placeholder="API key">
      <p id="unlock-error" class="text-xs text-red-400 mb-2"></p>
      <button id="unlock-submit" class="w-full bg-accent text-white rounded py-2 text-sm font-semibold">Unlock</button>
    </div>
  </div>

<script>
"use strict";
const AUTH_KEY = "ada_api_key";       // shared with the voice PWA (same origin)
const DEVICE_KEY = "ada_device_id";

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).replace(/-/g, "");
    localStorage.setItem(DEVICE_KEY, id);
  }
  return id;
}

function getApiKey() {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("api_key");
  if (fromUrl) {
    localStorage.setItem(AUTH_KEY, fromUrl);
    params.delete("api_key");
    const clean = params.toString();
    history.replaceState(null, "", location.pathname + (clean ? `?${clean}` : "") + location.hash);
  }
  return localStorage.getItem(AUTH_KEY) || "";
}

// API lives on the app root: /api/... direct on mn01, or
// /apps/ha/ada-*/api/... through the Caddy proxy (prefix stripped upstream).
function cmsBasePath() {
  return location.pathname.replace(/\/cms\/?$/, "") || "/";
}
const API_BASE = cmsBasePath() === "/" ? "" : cmsBasePath();

function apiFetch(path, opts = {}) {
  return fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: {
      "x-api-key": getApiKey(), "x-device-id": getDeviceId(),
      ...(opts.headers || {}),
    },
  });
}

function fmtUpdated(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("en-GB", {
    timeZone: "Asia/Bangkok",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }) + " ICT";
}

function escapeHtml(t) {
  if (t == null) return "";
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function showUnlock(msg) {
  const o = document.getElementById("unlock-overlay");
  o.hidden = false;
  document.getElementById("unlock-hint").textContent = msg || "Enter an Ada API key.";
  document.getElementById("unlock-key").focus();
}

document.getElementById("unlock-submit").addEventListener("click", () => {
  const k = document.getElementById("unlock-key").value.trim();
  if (!k) return;
  localStorage.setItem(AUTH_KEY, k);
  document.getElementById("unlock-overlay").hidden = true;
  loadPages();
});
document.getElementById("unlock-key").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("unlock-submit").click();
});
document.getElementById("btn-refresh").addEventListener("click", loadPages);
window.addEventListener("hashchange", renderRoute);

// --- Edit drawer -----------------------------------------------------------
// Section list comes from the page's own '## ' headings — same addressing
// the backend uses, so what you pick is what it edits.
let curPage = null;

function sectionsOf(md) {
  return (md.match(/^## .+$/gm) || []).map(h => h.slice(3).trim());
}

function openEdit() {
  if (!curPage) return;
  const sel = document.getElementById("edit-section");
  sel.innerHTML = '<option value="">whole page</option>' +
    sectionsOf(curPage.content || "")
      .map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  document.getElementById("edit-slug").textContent = curPage.slug;
  document.getElementById("edit-text").value = curPage.content || "";
  document.getElementById("edit-status").textContent = "";
  document.getElementById("edit-drawer").hidden = false;
}

document.getElementById("btn-edit").addEventListener("click", openEdit);
// Picking a section scopes the textarea to just that block.
document.getElementById("edit-section").addEventListener("change", (e) => {
  const name = e.target.value;
  const ta = document.getElementById("edit-text");
  if (!name || !curPage) { ta.value = curPage ? (curPage.content || "") : ""; return; }
  const re = new RegExp(`^## ${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\n([\\s\\S]*?)(?=^## |\\s*$)`, "m");
  const m = (curPage.content || "").match(re);
  ta.value = m ? `## ${name}\n${m[1].trim()}` : curPage.content;
});
document.getElementById("edit-close").addEventListener("click", () => {
  document.getElementById("edit-drawer").hidden = true;
});

document.querySelectorAll(".edit-op").forEach(btn => {
  btn.addEventListener("click", async () => {
    const op = btn.dataset.op;
    const needsText = op === "add" || op === "update";
    const needsTarget = op === "split" || op === "merge";
    document.getElementById("edit-target").classList.toggle("hidden", !needsTarget);
    const text = document.getElementById("edit-text").value;
    const target = document.getElementById("edit-target").value.trim();
    if (needsText && !text.trim()) {
      document.getElementById("edit-status").textContent = `${op} needs markdown in the box`;
      return;
    }
    if (needsTarget && !target) {
      document.getElementById("edit-status").textContent = `${op} needs a target slug`;
      return;
    }
    const st = document.getElementById("edit-status");
    st.textContent = `${op}…`;
    document.querySelectorAll(".edit-op").forEach(b => b.disabled = true);
    try {
      const res = await apiFetch(`/api/cms/pages/${encodeURIComponent(curPage.slug)}/edit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          op, text, target_slug: target,
          section: document.getElementById("edit-section").value,
          instruction: document.getElementById("edit-instr").value,
          lang: curLang,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { st.textContent = `failed: ${data.detail || res.status}`; return; }
      st.textContent = `${data.status || "done"}${data.created ? " → " + data.created : ""}`;
      renderRoute();
    } catch (e) {
      st.textContent = `failed: ${e.message || e}`;
    } finally {
      document.querySelectorAll(".edit-op").forEach(b => b.disabled = false);
    }
  });
});

// Language toggle — en/th page variants coexist under one slug; the
// backend falls back to en when the requested variant is missing.
const LANG_KEY = "cms_lang";
let curLang = localStorage.getItem(LANG_KEY) || "en";
function paintLangBtns() {
  for (const l of ["en", "th"]) {
    const b = document.getElementById(`lang-${l}`);
    b.className = "text-xs px-2 py-1 rounded " + (l === curLang
      ? "bg-accent text-white" : "bg-slate-700 hover:bg-slate-600");
  }
}
function setLang(l) {
  curLang = l;
  localStorage.setItem(LANG_KEY, l);
  paintLangBtns();
  renderPageList(document.getElementById("page-filter").value.trim().toLowerCase());
  renderRoute();
}
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
document.getElementById("lang-th").addEventListener("click", () => setLang("th"));
paintLangBtns();

// Mobile: page list starts collapsed; toggle button + auto-collapse on
// selection (only applies below the md breakpoint — check per click).
const pageList = document.getElementById("page-list");
const isMobile = () => window.matchMedia("(max-width: 767px)").matches;
document.getElementById("btn-toggle-list").addEventListener("click", () => {
  pageList.classList.toggle("hidden");
});
document.getElementById("page-filter").addEventListener("input", (e) => {
  renderPageList(e.target.value.trim().toLowerCase());
});
document.getElementById("page-tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab-btn");
  if (!b) return;
  curTab = b.dataset.tab;
  paintTabs();
  renderPageList(document.getElementById("page-filter").value.trim().toLowerCase());
});
paintTabs();
document.addEventListener("click", (e) => {
  const a = e.target.closest("#page-list a");
  if (a && isMobile()) pageList.classList.add("hidden");
});

let pages = [];

// Group pages by slug/title conventions — no backend needed:
//   cctv-walls / dvr-wall / wall-*        -> "CCTV Walls"
//   cam-* or "CCTV: <Area> — <label>"     -> "Cameras", sub-grouped by area
//   *-report* / benchmark-* / assessments -> "Reports"
//   everything else                       -> "Pages"
function pageGroup(p) {
  const t = p.title || "", s = p.slug || "";
  if (s === "cctv-walls" || s === "dvr-wall" ||
      s.startsWith("wall-") || t.startsWith("CCTV Wall"))
    return { g: "CCTV Walls", sub: "" };
  if (s.startsWith("cam-") || t.startsWith("CCTV:")) {
    const m = t.match(/^CCTV:\s*(.+?)\s*[—-]/) || s.match(/^cam-([a-z0-9]+)-/);
    return { g: "Cameras", sub: m ? m[1].trim() : "Other" };
  }
  if (/report|benchmark|audit|assessment/i.test(s))
    return { g: "Reports", sub: "" };
  return { g: "Pages", sub: "" };
}
const GROUP_ORDER = ["CCTV Walls", "Cameras", "Reports", "Pages"];
const groupOpen = new Map();  // survives list re-renders; all open initially
let curTab = "pages";         // "pages" | "cctv" — sidebar split

const isCctv = (p) => {
  const t = p.title || "", s = p.slug || "";
  return s === "cctv-walls" || s === "dvr-wall" || s.startsWith("wall-") ||
         s.startsWith("cam-") || t.startsWith("CCTV");
};

function paintTabs() {
  for (const b of document.querySelectorAll("#page-tabs .tab-btn")) {
    const on = b.dataset.tab === curTab;
    b.className = "tab-btn flex-1 px-2 py-1 rounded " +
      (on ? "bg-sky-700 text-white" : "bg-slate-800 text-slate-400 hover:bg-slate-700");
  }
}

function renderPageList(filter = "") {
  const list = document.getElementById("page-list");
  list.innerHTML = "";
  const slug = decodeURIComponent((location.hash.match(/^#\/(.+)$/) || [])[1] || "");
  // opening a CCTV page flips the tab so the page is visible in the list
  if (!filter && slug) {
    const cur = pages.find((p) => p.slug === slug);
    if (cur) curTab = isCctv(cur) ? "cctv" : "pages";
    paintTabs();
  }
  const shown = pages.filter((p) =>
    (curTab === "cctv") === isCctv(p) &&
    (!filter ||
      (p.title || "").toLowerCase().includes(filter) ||
      (p.slug || "").toLowerCase().includes(filter)));
  if (!shown.length) {
    list.innerHTML = filter
      ? '<div class="text-slate-500 italic">No matches.</div>'
      : '<div class="text-slate-500 italic">No pages yet — ask Ada to create one.</div>';
    return;
  }
  const mkLink = (p) => {
    const a = document.createElement("a");
    a.href = `#/${encodeURIComponent(p.slug)}`;
    a.className = "block px-2 py-1.5 rounded hover:bg-slate-800 truncate" +
      (p.slug === slug ? " bg-slate-800" : "");
    const langs = (p.langs || ["en"]);
    const langBadge = langs.includes(curLang)
      ? ""
      : ` <span class="text-xs text-amber-500">no ${curLang}</span>`;
    a.innerHTML = `<span class="text-slate-200">${escapeHtml(p.title)}</span>
      <span class="hidden sm:inline text-xs text-slate-500 ml-1">${escapeHtml(p.format || "markdown")}</span>${langBadge}`;
    return a;
  };
  if (filter) {           // flat list while filtering
    for (const p of shown) list.appendChild(mkLink(p));
    return;
  }
  const groups = {};
  for (const p of shown) {
    const { g, sub } = pageGroup(p);
    ((groups[g] ||= {})[sub] ||= []).push(p);
  }
  const order = [
    ...GROUP_ORDER.filter((g) => groups[g]),
    ...Object.keys(groups).filter((g) => !GROUP_ORDER.includes(g)).sort(),
  ];
  // Groups start OPEN and stay as the user left them — re-rendering the
  // list on every page click must not collapse sections, otherwise pages
  // feel like they keep disappearing (2026-10-02).
  for (const g of order) {
    const subs = groups[g];
    const n = Object.values(subs).reduce((a, v) => a + v.length, 0);
    const det = document.createElement("details");
    det.open = groupOpen.has(g) ? groupOpen.get(g) : true;
    det.className = "mb-1";
    det.addEventListener("toggle", () => groupOpen.set(g, det.open));
    const sum = document.createElement("summary");
    sum.className = "px-2 py-1 rounded cursor-pointer select-none " +
      "text-xs font-semibold uppercase tracking-wide text-slate-400 " +
      "hover:bg-slate-800";
    sum.textContent = `${g} · ${n}`;
    det.appendChild(sum);
    for (const sub of Object.keys(subs).sort()) {
      if (sub) {
        const h = document.createElement("div");
        h.className = "px-3 pt-1 text-[11px] text-slate-500";
        h.textContent = sub;
        det.appendChild(h);
      }
      for (const p of subs[sub]) det.appendChild(mkLink(p));
    }
    list.appendChild(det);
  }
}

async function loadPages() {
  const list = document.getElementById("page-list");
  try {
    const res = await apiFetch("/api/cms/pages?limit=500");
    if (res.status === 401) { showUnlock("API key required (or invalid for this device)."); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    pages = (await res.json()).pages || [];
    renderPageList(document.getElementById("page-filter").value.trim().toLowerCase());
    renderRoute();
  } catch (err) {
    document.getElementById("content").innerHTML =
      `<div class="text-red-400">Error loading pages: ${escapeHtml(err.message)}</div>`;
  }
}

async function renderRoute() {
  const slug = decodeURIComponent((location.hash.match(/^#\/(.+)$/) || [])[1] || "");
  renderPageList(document.getElementById("page-filter").value.trim().toLowerCase());
  const el = document.getElementById("content");
  if (!slug) {
    el.innerHTML = pages.length
      ? '<div class="text-slate-500 italic">Pick a page on the left.</div>'
      : '<div class="text-slate-500 italic">No pages yet.</div>';
    return;
  }
  el.textContent = "Loading…";
  try {
    const res = await apiFetch(`/api/cms/pages/${encodeURIComponent(slug)}?lang=${curLang}`);
    if (res.status === 401) { showUnlock(); return; }
    if (res.status === 404) { el.innerHTML = `<div class="text-slate-500">Page not found: ${escapeHtml(slug)}</div>`; return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderPage(el, await res.json());
  } catch (err) {
    el.innerHTML = `<div class="text-red-400">Error: ${escapeHtml(err.message)}</div>`;
  }
}

function renderPage(el, page) {
  curPage = page;
  document.getElementById("btn-edit").hidden = false;
  el.innerHTML = "";
  const head = document.createElement("div");
  head.className = "mb-5";
  head.innerHTML = `<h1 class="text-2xl font-bold text-white">${escapeHtml(page.title)}</h1>
    <div class="text-xs text-slate-500 mt-1">${escapeHtml(page.slug)} · ${escapeHtml(page.format)} · ${escapeHtml(page.lang || "en")}${page.updated ? " · updated " + escapeHtml(fmtUpdated(page.updated)) : ""}</div>`;
  // Generated pages carry provenance (generated_by) — offer Regenerate,
  // which queues run_now in the page's automation registry doc.
  if (page.generated_by) {
    const row = document.createElement("div");
    row.className = "text-xs text-slate-500 mt-1 flex items-center gap-2";
    const gen = document.createElement("span");
    gen.textContent = `generated by ${page.generated_by}`;
    const btn = document.createElement("button");
    btn.className = "px-2 py-0.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-200";
    btn.textContent = "Regenerate";
    const st = document.createElement("span");
    st.className = "text-slate-500";
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Queuing…";
      try {
        const res = await apiFetch(`/api/cms/pages/${encodeURIComponent(page.slug)}/regenerate`, { method: "POST" });
        const data = await res.json().catch(() => ({}));
        st.textContent = res.ok
          ? "queued — the worker regenerates on its next pass"
          : `failed: ${data.detail || res.status}`;
      } catch (e) {
        st.textContent = `failed: ${e.message || e}`;
      }
      btn.disabled = false;
      btn.textContent = "Regenerate";
    });
    row.appendChild(gen);
    row.appendChild(btn);
    row.appendChild(st);
    head.appendChild(row);
  }
  if (page.fallback) {
    const fb = document.createElement("div");
    fb.className = "text-xs text-amber-500 mb-2";
    fb.textContent = `No ${curLang} version — showing the English page.`;
    head.appendChild(fb);
  }
  el.appendChild(head);

  const body = document.createElement("div");
  el.appendChild(body);
  const fmt = (page.format || "markdown").toLowerCase();
  if (fmt === "html") renderHtml(body, page.content);
  else if (fmt === "yaml") renderYaml(body, page.content);
  else if (fmt === "slides") renderSlides(body, page.content);
  else renderMarkdown(body, page.content, page.title);
}

function renderMarkdown(el, md, pageTitle) {
  const d = document.createElement("div");
  d.className = "prose-ada";
  // Drop a leading '# Title' that just repeats the page header.
  md = (md || "").replace(/^\s*#\s+(.+)\n+/, (m, t) =>
    pageTitle && t.trim() === pageTitle.trim() ? "" : m);
  d.innerHTML = DOMPurify.sanitize(marked.parse(md));
  el.appendChild(d);
  // Rich blocks: ```chart (echarts 2D JSON option), ```chart3d (echarts-gl),
  // ```mermaid, ```media (image|video|audio + optional caption/url).
  d.querySelectorAll("pre code").forEach((code) => {
    const cls = code.className.replace("language-", "");
    const pre = code.parentElement;
    try {
      if (cls === "chart" || cls === "chart3d") {
        const opt = jsyaml.load(code.textContent);
        const box = document.createElement("div");
        box.className = "cms-chart";
        if (opt && opt.height) box.style.height = `${opt.height}px`;
        pre.replaceWith(box);
        const c = echarts.init(box, null, { renderer: "canvas" });
        c.setOption(opt.option || opt || {});
        window.addEventListener("resize", () => c.resize());
      } else if (cls === "mermaid") {
        const div = document.createElement("pre");
        div.className = "mermaid";
        div.textContent = code.textContent;
        pre.replaceWith(div);
        mermaid.run({ nodes: [div] }).catch(() => {});
      } else if (cls === "media") {
        const spec = jsyaml.load(code.textContent) || {};
        const fig = document.createElement("figure");
        fig.className = "cms-figure";
        const kind = spec.type || (/\.(mp4|webm|mov)/i.test(spec.url) ? "video"
          : /\.(mp3|wav|m4a|ogg)/i.test(spec.url) ? "audio" : "image");
        let node;
        if (kind === "video") {
          node = document.createElement("video");
          node.controls = true; node.src = spec.url;
        } else if (kind === "audio") {
          node = document.createElement("audio");
          node.controls = true; node.src = spec.url;
        } else {
          node = document.createElement("img");
          node.src = spec.url; node.alt = spec.alt || "";
        }
        node.className = "cms-media";
        fig.appendChild(node);
        if (spec.caption) {
          const cap = document.createElement("figcaption");
          cap.textContent = spec.caption;
          fig.appendChild(cap);
        }
        pre.replaceWith(fig);
      }
    } catch (err) {
      pre.innerHTML = `<div class="text-red-400">Block parse error (${escapeHtml(cls)}): ${escapeHtml(err.message)}</div>`;
    }
  });
}

function renderHtml(el, html) {
  // Ada-authored raw HTML renders in an isolated sandbox — scripts run but
  // cannot reach this app's origin, storage, or API credentials.
  const f = document.createElement("iframe");
  f.className = "w-full rounded-lg border border-slate-700 bg-white";
  f.style.minHeight = "70vh";
  f.setAttribute("sandbox", "allow-scripts");
  f.srcdoc = html || "";
  el.appendChild(f);
}

function renderSlides(el, md) {
  const slides = (md || "").split(/^---\s*$/m);
  slides.forEach((s, i) => {
    const card = document.createElement("section");
    card.className = "bg-card border border-slate-700 rounded-xl p-8 mb-6 min-h-[40vh] prose-ada";
    card.innerHTML = `<div class="text-xs text-slate-500 mb-3">${i + 1} / ${slides.length}</div>`
      + DOMPurify.sanitize(marked.parse(s));
    el.appendChild(card);
  });
}

// Chaba-style structured page: sections[] with layout list|grid|timeline and
// items[] carrying label/text/url/status/priority/tags/subtasks.
function renderYaml(el, src) {
  let data;
  try {
    data = jsyaml.load(src || "");
  } catch (err) {
    el.innerHTML = `<div class="text-red-400">YAML parse error: ${escapeHtml(err.message)}</div>`;
    return;
  }
  if (!data || typeof data !== "object") {
    el.innerHTML = '<div class="text-slate-500 italic">Empty page.</div>';
    return;
  }
  if (data.subtitle) {
    const p = document.createElement("p");
    p.className = "text-slate-400 mb-4";
    p.textContent = data.subtitle;
    el.appendChild(p);
  }
  (data.sections || []).forEach((section) => {
    const sec = document.createElement("section");
    sec.className = "bg-card border border-slate-700 rounded-xl p-4 mb-4";
    sec.innerHTML = `<h2 class="text-lg font-semibold mb-3">${section.icon ? escapeHtml(section.icon) + " " : ""}${escapeHtml(section.title || "")}</h2>`;
    const items = section.items || [];
    const wrap = document.createElement("div");
    if (section.layout === "grid") wrap.className = "grid grid-cols-1 md:grid-cols-2 gap-3";
    else if (section.layout === "timeline") wrap.className = "border-l-2 border-slate-600 pl-4 space-y-3";
    else wrap.className = "space-y-3";
    items.forEach((item) => wrap.appendChild(renderYamlItem(item)));
    if (!items.length) wrap.innerHTML = '<p class="text-slate-500 text-sm italic">No items.</p>';
    sec.appendChild(wrap);
    el.appendChild(sec);
  });
}

const STATUS_COLORS = {
  completed: "bg-green-900 text-green-200 border-green-700",
  active: "bg-sky-900 text-sky-200 border-sky-700",
  in_progress: "bg-yellow-900 text-yellow-200 border-yellow-700",
  planned: "bg-slate-700 text-slate-300 border-slate-600",
  pending: "bg-slate-700 text-slate-300 border-slate-600",
  not_started: "bg-slate-700 text-slate-300 border-slate-600",
};

function badge(status) {
  const s = (status || "").toLowerCase();
  if (!s) return "";
  const c = STATUS_COLORS[s] || "bg-slate-700 text-slate-300 border-slate-600";
  return `<span class="text-xs px-1.5 py-0.5 rounded border ${c}">${escapeHtml(status)}</span>`;
}

function renderYamlItem(item) {
  const div = document.createElement("div");
  div.className = "border-l-4 pl-3 " + (
    item.status === "active" ? "border-sky-500"
    : item.priority === "high" ? "border-red-500"
    : item.priority === "medium" ? "border-yellow-500"
    : "border-slate-600");
  const label = item.url
    ? `<a class="font-semibold text-sky-400 hover:underline" href="${escapeHtml(item.url)}">${escapeHtml(item.label)}</a>`
    : `<span class="font-semibold">${escapeHtml(item.label)}</span>`;
  const tags = (item.tags || []).map(t =>
    `<span class="text-xs px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">${escapeHtml(t)}</span>`).join(" ");
  div.innerHTML = `<div class="flex items-center gap-2 flex-wrap">${label} ${badge(item.status)} ${tags}</div>`;
  if (item.text) {
    const p = document.createElement("p");
    p.className = "text-slate-300 text-sm mt-1";
    p.textContent = item.text;
    div.appendChild(p);
  }
  if (item.subtasks && item.subtasks.length) {
    const ul = document.createElement("ul");
    ul.className = "mt-2 space-y-1";
    item.subtasks.forEach((st) => {
      const li = document.createElement("li");
      li.className = "flex items-start gap-2 text-sm text-slate-300";
      li.innerHTML = `${badge(st.status)} <span>${escapeHtml(st.label)}</span>`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
  }
  return div;
}

mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
loadPages();
</script>
</body>
</html>
