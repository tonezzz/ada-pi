<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Ada</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="static/style.css">
    <style>
      #pwa-ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); pointer-events: none; z-index: 100; }
      #pwa-ui > * { pointer-events: auto; }
      #pwa-toolbar { justify-self: end; display: flex; gap: 12px; flex-wrap: wrap; }
      #pwa-status { justify-self: center; color: #75bdc5; font-size: 17px; }
      #pwa-log { max-height: 28vh; overflow-y: auto; padding: 10px; border-radius: 10px; background: rgba(0,12,19,.85); color: #c9fbff; font: 15.5px/1.5 system-ui, sans-serif; }
      #pwa-log img { max-height: 110px; display: block; border-radius: 6px; margin: 4px 0; }
      .pwa-button { min-height: 48px; padding: 12px 20px; border: 1px solid #087ef2; border-radius: 9px; color: #aef8ff; background: rgba(5,35,48,.9); font: 600 18px system-ui, sans-serif; }
      .pwa-button:disabled { opacity: .4; }
      #lock-toggle { border-color: #2a6a55; }
      #lock-toggle.locked { border-color: #f2a008; color: #ffd97a; }
      #unlock-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,8,12,.92); z-index: 200; }
      #unlock-overlay[hidden] { display: none; }
      #unlock-card { width: min(340px, 88vw); padding: 28px 24px; border: 1px solid #0d4a63; border-radius: 14px; background: #04141c; text-align: center; }
      #unlock-card h1 { margin: 0 0 6px; color: #aef8ff; font: 700 30px system-ui, sans-serif; }
      #unlock-hint { margin: 0 0 18px; color: #75bdc5; font: 15.5px/1.5 system-ui, sans-serif; }
      #unlock-key { width: 100%; box-sizing: border-box; padding: 13px 14px; border: 1px solid #087ef2; border-radius: 9px; background: rgba(5,35,48,.9); color: #c9fbff; font: 18px system-ui, sans-serif; }
      #unlock-error { min-height: 22px; margin: 8px 0; color: #ff9a8a; font: 15px system-ui, sans-serif; }
      #unlock-submit { width: 100%; }
      #unlock-repair { margin-top: 10px; padding: 4px 8px; border: none; background: none; color: #75bdc5; font: 15px system-ui, sans-serif; text-decoration: underline; cursor: pointer; }
      #repair-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,8,12,.92); z-index: 210; }
      #repair-overlay[hidden] { display: none; }
      #repair-card { width: min(360px, 88vw); padding: 24px; border: 1px solid #0d4a63; border-radius: 14px; background: #04141c; text-align: center; }
      #repair-card h1 { margin: 0 0 4px; color: #aef8ff; font: 700 24px system-ui, sans-serif; }
      #repair-system { margin: 0 0 12px; color: #f2a008; font: 600 15px system-ui, sans-serif; }
      #repair-hint { margin: 0 0 12px; color: #75bdc5; font: 15px/1.5 system-ui, sans-serif; }
      #repair-video { width: 100%; aspect-ratio: 4/3; border-radius: 9px; background: #000; margin-bottom: 10px; }
      #repair-link { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #087ef2; border-radius: 9px; background: rgba(5,35,48,.9); color: #c9fbff; font: 16px system-ui, sans-serif; }
      #repair-error { min-height: 22px; margin: 8px 0; color: #ff9a8a; font: 15px system-ui, sans-serif; }
      #repair-cancel { width: 100%; }
    </style>
  </head>
  <body>
    <main id="face-stage" aria-label="Ada voice assistant">
      <svg id="idle-face" viewBox="140 84 1320 792" role="img" aria-label="Ada's face">
        <defs>
          <filter id="mouth-glow" x="-80%" y="-120%" width="260%" height="340%">
            <feGaussianBlur stdDeviation="9" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="face-rig">
          <g class="eye left-eye" filter="url(#mouth-glow)">
            <g class="eye-expression">
              <path class="eye-panel" d="M215 377 Q237 390 258 376 C356 333 505 327 596 360 C642 377 666 454 675 560 C554 593 408 600 311 558 C263 537 238 477 247 396Z"/>
              <path class="shimmer-line" pathLength="1" d="M215 377 Q237 390 258 376 C356 333 505 327 596 360 C642 377 666 454 675 560 C554 593 408 600 311 558 C263 537 238 477 247 396Z"/>
            </g>
          </g>
          <g class="eye right-eye" filter="url(#mouth-glow)">
            <g class="eye-expression">
              <path class="eye-panel" d="M1385 377 Q1363 390 1342 376 C1244 333 1095 327 1004 360 C958 377 934 454 925 560 C1046 593 1192 600 1289 558 C1337 537 1362 477 1353 396Z"/>
              <path class="shimmer-line" pathLength="1" d="M1385 377 Q1363 390 1342 376 C1244 333 1095 327 1004 360 C958 377 934 454 925 560 C1046 593 1192 600 1289 558 C1337 537 1362 477 1353 396Z"/>
            </g>
          </g>
          <g class="expression-brows" filter="url(#mouth-glow)" aria-hidden="true">
            <path class="expression-brow left-brow"/>
            <path class="expression-brow right-brow"/>
          </g>
          <g class="mouth-track">
            <g class="mouth-expression">
              <path class="mouth-aura" d="M690 742 C758 776 842 776 910 742 C858 805 742 805 690 742Z"/>
              <path class="mouth" filter="url(#mouth-glow)" d="M690 742 C758 776 842 776 910 742 C858 805 742 805 690 742Z"/>
              <path class="shimmer-line mouth-shimmer" pathLength="1" d="M690 742 C758 776 842 776 910 742 C858 805 742 805 690 742Z"/>
            </g>
          </g>
        </g>
      </svg>
      <div id="pwa-ui">
        <div id="pwa-toolbar">
          <button id="lock-toggle" class="pwa-button" hidden>Locked</button>
          <button id="doc-attach" class="pwa-button" title="Send a photo/document to Ada">📎</button>
          <button id="qr-open" class="pwa-button" title="Pair this device — scan a QR or paste the redeem link">Pair/QR</button>
          <button id="mic-toggle" class="pwa-button" disabled>Mic: On</button>
          <button id="sound-toggle" class="pwa-button" title="Mute Ada's voice (text still shows)">Sound: On</button>
          <button id="font-minus" class="pwa-button" title="Smaller text">A−</button>
          <button id="font-plus" class="pwa-button" title="Bigger text">A+</button>
          <input id="doc-file" type="file" accept="image/*" hidden>
          <button id="connect" class="pwa-button">Connect</button>
          <button id="disconnect" class="pwa-button" disabled>Disconnect</button>
        </div>
        <div id="pwa-status" aria-live="polite">Tap Connect</div>
        <div id="pwa-log"></div>
      </div>
    </main>
    <div id="unlock-overlay" hidden>
      <div id="unlock-card">
        <h1>Ada</h1>
        <p id="unlock-hint">Enter the API key to unlock voice and control.</p>
        <input id="unlock-key" type="password" autocomplete="off" placeholder="API key">
        <div id="unlock-error" role="alert"></div>
        <button id="unlock-submit" class="pwa-button">Unlock</button>
        <button id="unlock-repair">Re-pair this device →</button>
      </div>
    </div>
    <div id="repair-overlay" hidden>
      <div id="repair-card">
        <h1 id="repair-title">Re-pair</h1>
        <p id="repair-system"></p>
        <p id="repair-hint"></p>
        <video id="repair-video" playsinline muted></video>
        <input id="repair-link" type="text" autocomplete="off" placeholder="…or paste redeem link / token">
        <div id="repair-error" role="alert"></div>
        <button id="repair-cancel" class="pwa-button">Cancel</button>
      </div>
    </div>
    <script src="static/idle-face.js"></script>
    <script src="static/jsQR.js"></script>
    <script defer src="vendor/transformers/transformers.min.js"></script>
    <script defer src="jev-client.js?v=1"></script>
    <script src="app.js?v=11"></script>
  </body>
</html>
