<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Ada — Chat</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #02090f; color: #c9fbff; font: 15px/1.45 system-ui, sans-serif; }
      #chat-ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr auto; padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom); gap: 8px; }
      #chat-toolbar { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
      .pwa-button { min-height: 40px; padding: 8px 14px; border: 1px solid #087ef2; border-radius: 9px; color: #aef8ff; background: rgba(5,35,48,.9); font: 600 14px system-ui, sans-serif; cursor: pointer; }
      .pwa-button:disabled { opacity: .4; }
      #lock-toggle { border-color: #2a6a55; }
      #lock-toggle.locked { border-color: #f2a008; color: #ffd97a; }
      #voice-toggle.off { border-color: #555; color: #889; }
      #chat-status { text-align: center; color: #75bdc5; font-size: 13px; min-height: 18px; }
      #chat-log { overflow-y: auto; padding: 10px; border-radius: 10px; background: rgba(0,12,19,.85); display: flex; flex-direction: column; gap: 6px; }
      .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg .who { display: block; font-size: 11px; opacity: .65; margin-bottom: 2px; }
      .msg.mine { align-self: flex-end; background: rgba(8,126,242,.22); border: 1px solid rgba(8,126,242,.5); }
      .msg.ada { align-self: flex-start; background: rgba(13,74,99,.55); border: 1px solid #0d4a63; }
      .msg.voice { align-self: flex-end; background: rgba(42,106,85,.3); border: 1px solid #2a6a55; }
      .msg.system { align-self: center; background: none; color: #ff9a8a; font-size: 12px; padding: 2px; }
      .msg.streaming { opacity: .75; }
      .msg.check { align-self: stretch; max-width: 100%; background: rgba(13,74,99,.4); border: 1px solid #0d4a63; }
      .check-verdict { display: inline-block; padding: 2px 10px; border-radius: 8px; font-weight: 700; text-transform: uppercase; font-size: 12px; margin: 4px 0; }
      .check-verdict.buy { background: rgba(42,140,90,.35); border: 1px solid #2a8c5a; color: #7dffb8; }
      .check-verdict.caution { background: rgba(200,140,20,.25); border: 1px solid #c88c14; color: #ffd97a; }
      .check-verdict.avoid { background: rgba(180,50,40,.3); border: 1px solid #b43228; color: #ff9a8a; }
      .check-section { margin: 6px 0 0; font-size: 13px; }
      .check-section ul { margin: 4px 0; padding-left: 18px; }
      .check-meta { font-size: 11px; opacity: .6; margin-top: 6px; }
      #check-panel { display: none; gap: 8px; padding: 10px; border: 1px solid #0d4a63; border-radius: 10px; background: rgba(4,20,28,.95); flex-wrap: wrap; align-items: center; }
      #check-panel.open { display: flex; }
      #check-text { flex: 1 1 100%; min-height: 56px; padding: 8px 10px; border: 1px solid #087ef2; border-radius: 8px; background: rgba(5,35,48,.9); color: #c9fbff; font: 13px system-ui, sans-serif; resize: vertical; }
      #check-file-name { flex: 1; color: #75bdc5; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #check-mode { padding: 8px; border: 1px solid #087ef2; border-radius: 8px; background: rgba(5,35,48,.9); color: #c9fbff; font: 13px system-ui, sans-serif; }
      #chat-input-row { display: flex; gap: 8px; }
      #chat-input { flex: 1; min-height: 44px; padding: 10px 14px; border: 1px solid #087ef2; border-radius: 9px; background: rgba(5,35,48,.9); color: #c9fbff; font: 15px system-ui, sans-serif; }
      #chat-send { min-width: 72px; }
      #unlock-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,8,12,.92); z-index: 200; }
      #unlock-overlay[hidden] { display: none; }
      #unlock-card { width: min(340px, 88vw); padding: 28px 24px; border: 1px solid #0d4a63; border-radius: 14px; background: #04141c; text-align: center; }
      #unlock-card h1 { margin: 0 0 6px; color: #aef8ff; font: 700 26px system-ui, sans-serif; }
      #unlock-hint { margin: 0 0 18px; color: #75bdc5; font: 14px/1.45 system-ui, sans-serif; }
      #unlock-key { width: 100%; padding: 12px 14px; border: 1px solid #087ef2; border-radius: 9px; background: rgba(5,35,48,.9); color: #c9fbff; font: 16px system-ui, sans-serif; }
      #unlock-error { min-height: 20px; margin: 8px 0; color: #ff9a8a; font: 13px system-ui, sans-serif; }
      #unlock-submit { width: 100%; }
    </style>
  </head>
  <body>
    <main id="chat-ui" aria-label="Ada text chat">
      <div id="chat-toolbar">
        <button id="check-toggle" class="pwa-button" title="Verify a product before buying">Check 🛒</button>
        <button id="lock-toggle" class="pwa-button" hidden>Locked</button>
        <button id="voice-toggle" class="pwa-button" title="Play Ada's spoken replies">Voice: On</button>
        <button id="connect" class="pwa-button">Connect</button>
        <button id="disconnect" class="pwa-button" disabled>Disconnect</button>
      </div>
      <div id="chat-status" aria-live="polite">Tap Connect</div>
      <div id="check-panel">
        <textarea id="check-text" placeholder="Paste product info or a Shopee link…"></textarea>
        <button id="check-file" class="pwa-button">Upload 📷</button>
        <span id="check-file-name">no file</span>
        <select id="check-mode" title="Quick: ~10s red-flag check. Deep: full spec/price/alternatives hunt.">
          <option value="quick">Quick</option>
          <option value="deep">Deep</option>
        </select>
        <button id="check-run" class="pwa-button">Run</button>
        <input id="check-file-input" type="file" accept="image/*,.txt,.md" hidden>
      </div>
      <div id="chat-log"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Type to Ada…" disabled>
        <button id="chat-send" class="pwa-button" disabled>Send</button>
      </div>
    </main>
    <div id="unlock-overlay" hidden>
      <div id="unlock-card">
        <h1>Ada</h1>
        <p id="unlock-hint">Enter the API key to unlock chat.</p>
        <input id="unlock-key" type="password" autocomplete="off" placeholder="API key">
        <div id="unlock-error" role="alert"></div>
        <button id="unlock-submit" class="pwa-button">Unlock</button>
      </div>
    </div>
    <script src="chat.js?v=3"></script>
  </body>
</html>
