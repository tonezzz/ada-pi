# Drop-in tools for Ada — each entry maps a tool name to a module in this
# directory. See docs/ada-tool-dev.md for the authoring contract.
#
# policy:
#   read        — callable by any identified session, no confirmation
#   confirmed   — requires confirmed=true after a spoken yes
#   owner_only  — restricted to owner identities (full person_policies)
# secondary_allowed: let non-owner identified speakers call it (default false)
# timeout_s: hard cap on run() (default 20)
tools:
  # tools-merge-meta-voice (2026-10-05): ada_mddb_health folded into the
  # builtin ada_ops action='health' — the absorbed name stays callable as a
  # tool_runner._ALIASES row; the drop-in module is retired.
  ada_devteam_review:
    module: ada_devteam_review
    policy: owner_only
    secondary_allowed: false
    timeout_s: 300
  ada_board_write:
    module: ada_board_write
    policy: read
    secondary_allowed: false
    timeout_s: 20
