# Drop-in tools for Ada — each entry maps a tool name to a module in this
# directory. See docs/ada-tool-dev.md for the authoring contract.
#
# policy:
#   read        — callable by any identified session, no confirmation
#   confirmed   — requires confirmed=true after a spoken yes
#   owner_only  — restricted to owner identities (full person_policies)
# secondary_allowed: let non-owner identified speakers call it (default false)
# timeout_s: hard cap on run() (default 20)
tools:
  # tools-merge-meta-voice (2026-10-05): ada_mddb_health folded into the
  # builtin ada_ops action='health'; tools-merge-devin-mcp folded
  # ada_devteam_review into devin_read action='review'. Both names stay
  # callable as tool_runner._ALIASES rows; the drop-in modules are retired.
  ada_board_write:
    module: ada_board_write
    policy: read
    secondary_allowed: false
    timeout_s: 20
  ada_track_device:
    module: ada_track_device
    policy: owner_only
    secondary_allowed: false
    timeout_s: 30
  ada_device_acl:
    module: ada_device_acl
    policy: owner_only
    secondary_allowed: false
    timeout_s: 10
  # speaker-profile-tool (2026-10-07): voiceprint admin — list/match are
  # reads reachable on secondary turns (the wrong-name merge flow needs
  # them while a non-owner voice is identified); remove/re-enroll/alias
  # are gated in-module to full-access identities or the profile's own
  # bound person (self-service).
  speaker_profiles:
    module: speaker_profiles
    policy: read
    secondary_allowed: true
    timeout_s: 60
  # ada-market-tool (2026-10-08): market quotes from the trade DB via
  # trade-api — FX (24 ccy), Thai gold + USD spot, DXY, WTI/Brent.
  # Read-only lookups; gold/FX questions come from any identified
  # speaker, so secondary turns may call it too.
  ada_market_quote:
    module: ada_market_quote
    policy: read
    secondary_allowed: true
    timeout_s: 20
